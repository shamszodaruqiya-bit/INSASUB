<style>
/* Layout: an IDE shell. Title bar with path and switches, explorer sidebar (strip on phones), editor area with one view per screen, status bar at the bottom. Syntax colors map to subjects. */
:root{
  --bg:#F5F6FB; --panel:#FFFFFF; --surface:#FFFFFF; --fg:#1B2240; --muted:#5E6888; --line:#DCE0EE; --soft:#ECEFF8;
  --accent:#3B5BDB; --on-accent:#FFFFFF; --code-bg:#EEF1F9; --code-fg:#1B2240;
  --s-blue:#2F5BD8; --s-violet:#8A3FD1; --s-cyan:#007A6B; --s-orange:#C2480A; --s-pink:#C2255C; --s-green:#2B7A1F; --s-yellow:#8F5F00; --s-red:#C62839;

  --font-display:'Manrope','Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

    --bg:#0C1020; --panel:#111730; --surface:#161D38; --fg:#D7DEF3; --muted:#8490B4; --line:#262F52; --soft:#1B2342;

    --s-blue:#82AAFF; --s-violet:#C792EA; --s-cyan:#7FDBCA; --s-orange:#F78C6C; --s-pink:#FF7EB6; --s-green:#A8E08A; --s-yellow:#FFCB6B; --s-red:#FF6B7A;
    --ok:#7FDB9A; --bad:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1020; --panel:#111730; --surface:#161D38; --fg:#D7DEF3; --muted:#8490B4; --line:#262F52; --soft:#1B2342;
  --accent:#82AAFF; --on-accent:#0C1020; --code-bg:#0A0E1C; --code-fg:#D7DEF3;
  --s-blue:#82AAFF; --s-violet:#C792EA; --s-cyan:#7FDBCA; --s-orange:#F78C6C; --s-pink:#FF7EB6; --s-green:#A8E08A; --s-yellow:#FFCB6B; --s-red:#FF6B7A;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.logo{display:inline-flex;align-items:center;gap:8px}.logo-ic{width:28px;height:28px;flex:none}
/* title bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:var(--panel);border-bottom:1px solid var(--line)}
.tb{height:52px;display:flex;align-items:center;gap:14px;max-width:1240px;margin-inline:auto}
.logo{font-family:var(--font-mono);font-weight:800;font-size:1.05rem;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}

.path{flex:1;min-width:0;font-family:var(--font-mono);font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path em{font-style:normal;color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}

.theme:hover{color:var(--fg);background:var(--soft)}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:36px;max-width:1240px;margin-inline:auto;padding-block:22px 64px}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;max-height:calc(100dvh - 130px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px}

.sv-head h1{font-size:clamp(1.9rem,6vw,2.9rem);font-weight:800;letter-spacing:-.03em}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;font-size:.9rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:32px;align-items:center;padding-bottom:6px}

.term-bar span{margin-left:8px;font-family:var(--font-mono);font-size:.74rem;color:var(--muted)}

/* books */
.books{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.book{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto auto;gap:8px 24px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.book:last-child{border-bottom:0}
.book h3{font-size:1.02rem;font-weight:700}
.book small{display:block;color:var(--muted);font-family:var(--font-mono);font-size:.76rem;margin-top:2px}
.book p{color:var(--muted);font-size:.92rem}
.lvl{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);white-space:nowrap}
.book a.open{font-weight:600;font-size:.9rem;white-space:nowrap;color:var(--accent);text-underline-offset:3px}
@media (max-width:760px){.book{grid-template-columns:minmax(0,1fr) auto}.book p{grid-column:1/-1;order:3}.book .lvl{grid-column:1;grid-row:2}}

/* problems */
.progress{display:flex;align-items:center;gap:14px;margin-bottom:18px;font-family:var(--font-mono);font-size:.82rem;color:var(--muted)}
.bar{flex:1;max-width:260px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.tab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;font-size:.92rem}
.tab i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.tab[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.probs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px}
.prob{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.prob-q{display:flex;gap:14px;align-items:flex-start}
.pn{font-family:var(--font-mono);font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:1px 8px;flex:none;color:var(--muted)}
.prob-row{display:flex;flex-wrap:wrap;gap:8px}
.prob input{flex:1 1 130px;min-width:0;font:inherit;font-family:var(--font-mono);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.sol{font-family:var(--font-mono);font-size:.86rem;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;overflow-wrap:anywhere}

/* languages */
.lang-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;align-items:start}
.lang-info{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.lang-info h3{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.lang-info h4{margin:0 0 8px}
.lang-info ol{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:6px}
.codes{display:flex;flex-direction:column;gap:14px;min-width:0}
.answer{font-family:var(--font-mono);font-size:.84rem;color:var(--ok);font-weight:500}
@media (max-width:860px){.lang-grid{grid-template-columns:minmax(0,1fr)}}

/* calculator */
.calc{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
.calc-main{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.calc-main input{width:100%;font-family:var(--font-mono);font-size:1.15rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.calc-out{font-family:var(--font-mono);font-size:1.9rem;font-weight:700;text-align:right;color:var(--s-cyan);overflow-wrap:anywhere;min-height:2.4rem}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:48px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-family:var(--font-mono);font-size:1.05rem}
.key:hover{background:var(--soft)}
.key.op{color:var(--s-violet)}
.key.eq{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.hist ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:.9rem}
.hist li{overflow-wrap:anywhere}
@media (max-width:860px){.calc{grid-template-columns:minmax(0,1fr)}}

/* executor */
.exec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.egrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.cell{aspect-ratio:1;border-radius:6px;background:var(--bg);border:1px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center}
.cell.wall{background:repeating-linear-gradient(135deg,var(--line) 0 5px,var(--soft) 5px 10px);border-color:var(--muted)}
.cell.goal::after{content:"";position:absolute;inset:22%;border:3px solid var(--s-green);border-radius:50%}
.bot{width:62%;height:62%;color:var(--s-orange);position:relative;z-index:1}
.cmds{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cmds+.codebox{margin-bottom:12px}
.pl{display:block}
.pl.on{background:color-mix(in srgb,var(--s-yellow) 22%,transparent);border-radius:4px}
.exec .codebox pre{min-height:8.5rem;max-height:18rem;overflow:auto}
@media (max-width:860px){.exec{grid-template-columns:minmax(0,1fr)}}

/* about */
.readme{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:70ch;display:flex;flex-direction:column;gap:12px}
.readme h1{font-family:var(--font-mono);font-size:1.3rem;font-weight:800}
.readme h1::before{content:"# ";color:var(--muted)}
.readme p{color:var(--muted)}


/* authors */
.auth{max-width:70ch;margin-top:18px}
.auth h2{font-family:var(--font-mono);font-size:1.1rem;font-weight:800;margin-bottom:12px}
.auth h2::before{content:"// ";color:var(--s-pink)}
.auth-lead{color:var(--muted);margin-bottom:14px}
.acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.acard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 18px 22px;display:flex;gap:14px;align-items:flex-start}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--c1),var(--c2))}
.av{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.2rem;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 16px -6px var(--c1)}
.acard b{display:block;font-family:var(--font-display);font-size:1.02rem;line-height:1.25}
.aim{margin-top:18px;position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px 18px 26px}
.aim::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#FF3D81,#FFB300,#00D68F,#00B8FF,#8A3FD1)}
.aim h3{font-family:var(--font-mono);font-size:1.05rem;font-weight:800;margin-bottom:8px}
.aim h3::after{content:":"}
.aim p{color:var(--fg);line-height:1.55}
.acard .ad{margin-top:8px;font-size:.88rem;line-height:1.45}
.acard span.r{display:inline-block;line-height:1.35;margin-top:6px;font-family:var(--font-mono);font-size:.74rem;padding:3px 10px;border-radius:12px;color:#fff;background:linear-gradient(90deg,var(--c1),var(--c2))}


/* shimmer */
@keyframes flow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes sweep{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(320%) skewX(-20deg)}}
.logo>span,.wm{background:linear-gradient(90deg,#FF3D81,#FFB300,#00D68F,#00B8FF,#8A3FD1,#FF3D81);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:flow 7s linear infinite}
.logo>span b,.logo>span i,.wm .a,.wm .b,.wm .c2{color:inherit;-webkit-text-fill-color:transparent}
header.top{border-image:linear-gradient(90deg,#FF3D81,#FFB300,#00D68F,#00B8FF,#8A3FD1) 1;border-bottom:2px solid;background-clip:padding-box}
.acard::before{background:linear-gradient(180deg,var(--c1),var(--c2),var(--c1));background-size:100% 300%;animation:flow 6s linear infinite;animation-name:flowv}
@keyframes flowv{0%{background-position:0 0}100%{background-position:0 300%}}
.acard::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 5s ease-in-out infinite;pointer-events:none}
.av{background-size:200% 200%;animation:flow 6s ease infinite}

/* text shimmer */
@keyframes flow2{0%{background-position:0% 50%}100%{background-position:300% 50%}}
:root{--sh:linear-gradient(90deg,#E8247A,#F57C00,#1FA85A,#0A8FD6,#7B3FE4,#E8247A)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sh:linear-gradient(90deg,#FF6FA5,#FFB74D,#69F0AE,#4FC3F7,#B388FF,#FF6FA5)}}
:root[data-theme="dark"]{--sh:linear-gradient(90deg,#FF6FA5,#FFB74D,#69F0AE,#4FC3F7,#B388FF,#FF6FA5)}
.view h1,.view h2,.view h3,.view .cm,.view .lead,.sv-head p,.ng,.nv,.readme p,.auth-lead,.tile-top b,.path,.view label,.view th,.view summary{background:var(--sh);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:flow2 8s linear infinite}
.view h1 b,.view h1 i,.view h1 span,.view h2 span,.view h3 span,.path em{-webkit-text-fill-color:transparent;color:transparent}

/* auth + reader */
.signin{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:inherit;font-size:.82rem;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signin.out{background:var(--accent);color:var(--on-accent);border-color:transparent}
.signin:hover{filter:brightness(1.08)}
@media (max-width:560px){.signin .sn{display:none}.signin{padding:0 9px}.seg button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.seg button{padding:6px 8px}.fl{width:18px;height:12px}}
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,12,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.dlg{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;width:min(420px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.dlg h2{font-family:var(--font-display);font-size:1.3rem;margin-bottom:12px}
.atabs{display:flex;gap:6px;margin-bottom:14px;background:var(--soft);padding:4px;border-radius:10px}
.atabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:8px;border-radius:7px;cursor:pointer}
.atabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.dlg label{display:block;font-size:.82rem;color:var(--muted);margin-top:10px}
.fld{display:block;width:100%;padding:10px 12px;margin-top:4px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;font:inherit}
.fld:focus{outline:2px solid var(--accent);outline-offset:1px}
.aerr{color:var(--bad);min-height:1.3em;font-size:.85rem;margin-top:10px}
.ahint{color:var(--muted);font-size:.78rem;margin-top:10px}
.pbtn{display:inline-block;width:100%;margin-top:12px;padding:11px 14px;border:0;border-radius:9px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;cursor:pointer}
.pbtn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.xbtn{float:right;border:0;background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;line-height:1}
.reader{position:fixed;left:0;right:0;top:0;bottom:26px;z-index:55;background:var(--bg);display:flex;flex-direction:column}
.rbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.rbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar a,.rbar button{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--fg);padding:6px 11px;border-radius:8px;text-decoration:none;cursor:pointer;white-space:nowrap}
.rnote{padding:6px 14px;font-size:.78rem;color:var(--muted);background:var(--soft)}
.rwrap{flex:1;position:relative;background:#fff}
.rwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.rload{position:absolute;inset:0;display:grid;place-items:center;color:#666;font-family:var(--font-mono)}
.bktitle{font-size:1.5rem;margin:6px 0 12px}
.bkbody{max-width:74ch;margin:16px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.bkbody h3{font-family:var(--font-display);font-size:1.25rem;margin-bottom:12px}
.bkbody p{line-height:1.75;font-size:1.02rem;margin-bottom:12px}
.bkcode{background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:14px 16px;overflow:auto;font-family:var(--font-mono);font-size:.88rem;line-height:1.55;margin:14px 0 4px}
.bknav{display:flex;justify-content:space-between;gap:10px;max-width:74ch}
.bact{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rdbtn{border:0;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;font-size:.85rem;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}

/* status bar */
footer.status{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--accent);color:var(--on-accent);font-family:var(--font-mono);font-size:.72rem;padding-bottom:env(safe-area-inset-bottom,0px)}
.st{display:flex;align-items:center;gap:18px;height:26px;max-width:1240px;margin-inline:auto;white-space:nowrap;overflow:hidden}
.st .mid{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.st .mid{display:none}.st span:last-child{margin-left:auto}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

.acode{font-family:var(--font-mono);font-size:1.6rem;letter-spacing:.5em;text-align:center;padding-left:.5em}
.ainfo{font-size:.9rem;color:var(--muted);margin:0 0 12px;overflow-wrap:anywhere}.ainfo b{color:var(--fg)}
.ainfo.test{border:1px dashed var(--s-orange);border-radius:8px;padding:8px 10px;color:var(--s-orange)}
.dlg .pbtn[disabled]{opacity:.55;cursor:not-allowed}

.pt{overflow-x:auto;padding-bottom:6px}
.ptg{display:grid;grid-template-columns:repeat(18,minmax(40px,1fr));grid-template-rows:repeat(7,auto) 12px auto auto;gap:3px;min-width:780px}
.ptc{border:1px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));border-radius:6px;padding:3px 0;display:flex;flex-direction:column;align-items:center;line-height:1.15;font-family:var(--font-mono);color:var(--fg)}
.ptc i{font-style:normal;font-size:.6rem;color:var(--muted)}.ptc b{font-size:.95rem}
.ptc:hover{background:color-mix(in srgb,var(--c) 32%,var(--surface))}
.ptc[aria-pressed="true"]{background:var(--c);color:var(--on-accent)}.ptc[aria-pressed="true"] i{color:inherit}
.ptleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:.8rem;color:var(--muted)}
.ptl{display:inline-flex;align-items:center;gap:6px}.ptl i{width:12px;height:12px;border-radius:3px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 35%,var(--surface))}
.elbio{border:1px solid var(--line);border-left:4px solid var(--c);background:var(--surface);border-radius:10px;padding:16px 18px;margin-top:14px}
.elbio h3{font-size:1.25rem;margin-bottom:8px}

.dlg{max-height:92vh;overflow-y:auto}
.avm{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:14px;line-height:1;vertical-align:middle;flex:none}
.avm.big{width:84px;height:84px;font-size:46px;box-shadow:0 0 0 3px var(--line)}
.avcur{display:flex;justify-content:center;margin:4px 0 12px}
.avlab{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.avb{aspect-ratio:1;border-radius:50%;border:2px solid transparent;font-size:1.35rem;line-height:1;padding:0}
.avb[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
textarea.fld{resize:vertical;font-family:inherit}

.stats{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.stats h3{font-size:1.05rem;margin-bottom:8px}
.stlv{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-mono)}.stlv b{font-size:1.2rem;color:var(--accent)}.stlv span{font-size:.8rem;color:var(--muted)}
.xpbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 4px}.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stats small{color:var(--muted);font-size:.78rem}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stg div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.stg b{display:block;font-family:var(--font-mono);font-size:1.15rem}.stg span{display:block;font-size:.68rem;color:var(--muted);line-height:1.25}
.stchips{display:flex;flex-wrap:wrap;gap:6px}.stchip{border:1px solid var(--c);color:var(--c);border-radius:99px;padding:2px 10px;font-size:.8rem}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.9rem;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}

.ov.full{padding:0;align-items:stretch;justify-content:stretch;background:var(--bg);backdrop-filter:none;overflow-y:auto}
.ov.full .dlg{position:relative;width:100%;max-height:none;min-height:100%;height:auto;overflow:visible;border:0;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
.ov.full .xbtn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));float:none;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.3);color:#fff;font-size:1.5rem}
.pfc{position:relative;overflow:hidden;color:#fff;padding:calc(44px + env(safe-area-inset-top,0px)) 20px 30px}
.pfc::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% -10%,rgba(255,255,255,.3),transparent 55%);pointer-events:none}
.pfin{position:relative;z-index:1;max-width:1100px;margin:0 auto;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.pfc .avm.big{width:116px;height:116px;font-size:64px;box-shadow:0 0 0 4px rgba(255,255,255,.75),0 10px 30px rgba(0,0,0,.3)}
.pft{min-width:0;flex:1 1 260px}

{id:'g2',s:'geo',ans:720,q:{ru:'Чему равна сумма углов выпуклого шестиугольника (в градусах)?',tg:'Суммаи кунҷҳои шашкунҷаи барҷаста чанд дараҷа аст?',en:'What is the sum of the interior angles of a convex hexagon, in degrees?'},sol:'(6 − 2) × 180° = 720°'},
{id:'p1',s:'phy',ans:250,q:{ru:'Автомобиль едет со скоростью 90 км/ч. Сколько метров он проедет за 10 с?',tg:'Мошин бо суръати 90 км/соат ҳаракат мекунад. Дар 10 сония чанд метр мегузарад?',en:'A car moves at 90 km/h. How many metres does it cover in 10 s?'},
 sol:{ru:'90 км/ч = 25 м/с; 25 × 10 = 250 м',tg:'90 км/соат = 25 м/с; 25 × 10 = 250 м',en:'90 km/h = 25 m/s; 25 × 10 = 250 m'}},
{id:'p2',s:'phy',ans:10,q:{ru:'Масса тела 4 кг, ускорение 2,5 м/с². Найдите силу в ньютонах.',tg:'Массаи ҷисм 4 кг, шитоб 2,5 м/с². Қувваро бо нютон ёбед.',en:'A body has mass 4 kg and acceleration 2.5 m/s². Find the force in newtons.'},sol:'F = m · a = 4 × 2.5 = 10 N'},
{id:'c1',s:'che',ans:18,q:{ru:'Чему равна молярная масса воды H₂O (г/моль)? Ar(H) = 1, Ar(O) = 16.',tg:'Массаи молярии оби H₂O чанд аст (г/мол)? Ar(H) = 1, Ar(O) = 16.',en:'What is the molar mass of water, H₂O, in g/mol? Ar(H) = 1, Ar(O) = 16.'},sol:'2 × 1 + 16 = 18'},
{id:'c2',s:'che',ans:2,q:{ru:'Сколько моль в 36 г воды? (M = 18 г/моль)',tg:'Дар 36 г об чанд мол ҳаст? (M = 18 г/мол)',en:'How many moles are in 36 g of water? (M = 18 g/mol)'},sol:'n = m / M = 36 / 18 = 2'},
{id:'b1',s:'bio',ans:23,q:{ru:'В соматической клетке человека 46 хромосом. Сколько хромосом в половой клетке?',tg:'Дар ҳуҷайраи соматикии одам 46 хромосома ҳаст. Дар ҳуҷайраи ҷинсӣ чандто аст?',en:'A human body cell has 46 chromosomes. How many are in a gamete?'},sol:'46 / 2 = 23'},
{id:'b2',s:'bio',ans:20,q:{ru:'В молекуле ДНК аденина 30%. Сколько процентов составляет гуанин?',tg:'Дар молекулаи ДНК аденин 30% аст. Гуанин чанд фоиз аст?',en:'In a DNA molecule, adenine makes up 30%. What percent is guanine?'},sol:'A = T = 30%, A + T = 60%; G = C = (100 − 60) / 2 = 20%'}
];

var BOOKS=[{"id": "cs", "pl": "gen", "lv": 1, "t": ["Основы информатики", "Асосҳои информатика", "Computer Science Basics"], "d": ["Информация, двоичная система, алгоритмы и устройство компьютера.", "Иттилоот, низоми дуӣ, алгоритмҳо ва сохти компютер.", "Information, binary numbers, algorithms and how a computer works."], "ch": [{"t": ["Что такое информация", "Иттилоот чист", "What is information"], "p": [["Информация — это сведения о мире, которые человек или устройство может получить, запомнить и передать. Текст, число, фото и звук — всё это информация.", "Наименьшая единица информации — бит. Он принимает всего два значения: 0 или 1. Восемь бит составляют один байт, а в одном байте можно записать, например, одну букву.", "Дальше единицы растут в 1024 раза: 1 килобайт (КБ) = 1024 байта, 1 мегабайт (МБ) = 1024 КБ, 1 гигабайт (ГБ) = 1024 МБ."], ["Иттилоот — ин маълумот дар бораи ҷаҳон аст, ки инсон ё дастгоҳ онро гирифта, нигоҳ дошта ва интиқол дода метавонад. Матн, рақам, акс ва садо — ҳамааш иттилоот аст.", "Хурдтарин воҳиди иттилоот — бит аст. Он танҳо ду қимат дорад: 0 ё 1. Ҳашт бит як байтро ташкил медиҳад ва дар як байт, масалан, як ҳарфро сабт кардан мумкин аст.", "Воҳидҳои калонтар ҳар бор 1024 маротиба зиёд мешаванд: 1 килобайт (КБ) = 1024 байт, 1 мегабайт (МБ) = 1024 КБ, 1 гигабайт (ГБ) = 1024 МБ."], ["Information is knowledge about the world that a person or a device can receive, store and pass on. Text, numbers, photos and sound are all information.", "The smallest unit of information is the bit. It has only two values: 0 or 1. Eight bits make one byte, and one byte can hold, for example, one letter.", "Larger units grow by 1024 times each: 1 kilobyte (KB) = 1024 bytes, 1 megabyte (MB) = 1024 KB, 1 gigabyte (GB) = 1024 MB."]], "c": ""}, {"t": ["Двоичная система счисления", "Низоми ададии дуӣ", "The binary number system"], "p": [["Компьютер хранит всё с помощью нулей и единиц, поэтому он использует двоичную систему. В ней всего две цифры, а каждая позиция числа означает степень двойки: 1, 2, 4, 8, 16…", "Чтобы перевести 1101 в десятичную систему, сложим степени двойки там, где стоит единица: 8 + 4 + 1 = 13. Чтобы перевести 13 в двоичную, делим число на 2 и выписываем остатки с конца: 13 → 1101.", "Проверить себя можно в Python."], ["Компютер ҳама чизро бо ёрии сифр ва як нигоҳ медорад, барои ҳамин низоми дуиро истифода мебарад. Дар он танҳо ду рақам ҳаст ва ҳар мавқеи адад дараҷаи дувро ифода мекунад: 1, 2, 4, 8, 16…", "Барои аз 1101 ба низоми даҳӣ гузаштан, дараҷаҳои дувро дар ҷойҳое ҷамъ мекунем, ки дар он як истодааст: 8 + 4 + 1 = 13. Барои 13-ро ба низоми дуӣ гузарондан, ададро ба 2 тақсим мекунем ва бақияҳоро аз охир менависем: 13 → 1101.", "Худро дар Python санҷида метавонед."], ["A computer stores everything as zeros and ones, so it uses the binary system. It has only two digits, and each position in a number stands for a power of two: 1, 2, 4, 8, 16…", "To convert 1101 to decimal, add the powers of two where there is a one: 8 + 4 + 1 = 13. To convert 13 to binary, divide by 2 repeatedly and write the remainders from last to first: 13 → 1101.", "You can check yourself in Python."]], "c": "n = 13\nprint(bin(n))          # 0b1101\nprint(int(\"1101\", 2))  # 13"}, {"t": ["Алгоритм", "Алгоритм", "Algorithms"], "p": [["Алгоритм — это точная последовательность шагов, которая приводит к результату. Хороший алгоритм понятен, состоит из конечного числа шагов и для одних и тех же данных всегда даёт один и тот же ответ.", "Алгоритм можно записать словами, нарисовать блок-схемой или написать программой. Например, чтобы найти наибольшее число в списке, запомним первое число как максимум и по очереди сравним с ним остальные."], ["Алгоритм — ин пайдарпайии дақиқи қадамҳост, ки ба натиҷа мебарад. Алгоритми хуб фаҳмо аст, аз шумораи ниҳоии қадамҳо иборат аст ва барои маълумотҳои якхела ҳамеша як ҷавоб медиҳад.", "Алгоритмро бо калимаҳо навиштан, бо блок-схема кашидан ё ҳамчун барнома навиштан мумкин аст. Масалан, барои ёфтани калонтарин адад дар рӯйхат, аввалин ададро ҳамчун максимум ба ёд мегирем ва боқимондаҳоро бо навбат бо он муқоиса мекунем."], ["An algorithm is an exact sequence of steps that leads to a result. A good algorithm is clear, has a finite number of steps and always gives the same answer for the same data.", "An algorithm can be written in words, drawn as a flowchart or coded as a program. For example, to find the largest number in a list, remember the first number as the maximum and compare the others with it one by one."]], "c": "a = [4, 9, 2, 7]\nm = a[0]\nfor x in a:\n    if x > m:\n        m = x\nprint(m)  # 9"}, {"t": ["Как устроен компьютер", "Сохти компютер", "How a computer works"], "p": [["Главная часть компьютера — процессор: он выполняет команды. Оперативная память временно хранит данные, с которыми работает программа, а жёсткий диск или SSD хранит файлы постоянно.", "Для ввода служат клавиатура и мышь, для вывода — экран и колонки. Всем этим управляет операционная система, например Windows, Linux или Android: она запускает программы и распределяет ресурсы между ними."], ["Қисми асосии компютер — протсессор аст: он фармонҳоро иҷро мекунад. Хотираи оперативӣ маълумотеро, ки барнома бо он кор мекунад, муваққатан нигоҳ медорад ва диски сахт ё SSD файлҳоро доимӣ нигоҳ медорад.", "Барои ворид кардан клавиатура ва муш хидмат мекунанд, барои баровардан — экран ва баландгӯякҳо. Ҳамаи инро системаи амалиётӣ идора мекунад, масалан Windows, Linux ё Android: он барномаҳоро оғоз мекунад ва захираҳоро байни онҳо тақсим менамояд."], ["The main part of a computer is the processor: it executes commands. RAM temporarily holds the data a program works with, while a hard disk or SSD stores files permanently.", "The keyboard and mouse are for input, the screen and speakers for output. All of this is managed by the operating system, such as Windows, Linux or Android: it starts programs and shares resources between them."]], "c": ""}]}, {"id": "py", "pl": "py", "lv": 1, "t": ["Python для начинающих", "Python барои навомӯзон", "Python for Beginners"], "d": ["Первые шаги: вывод, переменные, условия, циклы, функции и списки.", "Қадамҳои аввал: баровардан, тағйирёбандаҳо, шартҳо, даврҳо, функсияҳо ва рӯйхатҳо.", "First steps: output, variables, conditions, loops, functions and lists."], "ch": [{"t": ["Первая программа", "Барномаи аввал", "Your first program"], "p": [["Python — простой язык, с которого удобно начинать. Программа состоит из команд, которые выполняются сверху вниз. Команда print выводит текст на экран.", "Всё, что стоит после знака #, — комментарий: Python его игнорирует, а человеку он помогает понять код."], ["Python — забони осон аст, ки аз он оғоз кардан қулай аст. Барнома аз фармонҳо иборат аст, ки аз боло ба поён иҷро мешаванд. Фармони print матнро дар экран мебарорад.", "Ҳар чизе, ки пас аз аломати # меояд, шарҳ аст: Python онро сарфи назар мекунад, вале барои одам фаҳмидани кодро осон мекунад."], ["Python is a simple language that is easy to start with. A program is made of commands that run from top to bottom. The print command shows text on the screen.", "Anything after the # sign is a comment: Python ignores it, but it helps people understand the code."]], "c": "# my first program\nprint(\"Hello, world!\")"}, {"t": ["Переменные и типы данных", "Тағйирёбандаҳо ва навъҳои маълумот", "Variables and data types"], "p": [["Переменная — это имя, под которым хранится значение. Основные типы: int — целые числа, float — дробные, str — строки, bool — True или False.", "Функция input читает строку, которую ввёл пользователь. Чтобы получить число, оборачиваем её в int()."], ["Тағйирёбанда — номест, ки зери он қимат нигоҳ дошта мешавад. Навъҳои асосӣ: int — ададҳои бутун, float — ададҳои касрӣ, str — сатрҳо, bool — True ё False.", "Функсияи input сатрро мехонад, ки корбар ворид кардааст. Барои гирифтани адад, онро ба int() печонда мегирем."], ["A variable is a name under which a value is stored. The main types are int for whole numbers, float for fractions, str for strings and bool for True or False.", "The input function reads a line typed by the user. To get a number, wrap it in int()."]], "c": "name = input()\nage = int(input())\nprint(name, \"is\", age, \"years old\")\nprint(age + 1)"}, {"t": ["Условия и циклы", "Шартҳо ва даврҳо", "Conditions and loops"], "p": [["Условие if выбирает, какой код выполнить. Если условие неверно, срабатывает ветка else. Отступы в Python обязательны: они показывают, какие строки относятся к условию.", "Цикл for повторяет действие заданное число раз, а цикл while — пока условие истинно. Ниже программа определяет чётность числа и считает сумму от 1 до n."], ["Шарти if интихоб мекунад, кадом код иҷро шавад. Агар шарт нодуруст бошад, шохаи else кор мекунад. Фосилаҳо (отступ) дар Python ҳатмист: онҳо нишон медиҳанд, ки кадом сатрҳо ба шарт тааллуқ доранд.", "Давраи for амалро шумораи додашуда такрор мекунад, давраи while — то даме ки шарт дуруст аст. Дар поён барнома тоқ ё ҷуфт будани ададро муайян мекунад ва ҷамъи аз 1 то n-ро ҳисоб менамояд."], ["The if statement chooses which code to run. If the condition is false, the else branch runs. Indentation is required in Python: it shows which lines belong to the condition.", "A for loop repeats an action a set number of times, and a while loop repeats it while a condition is true. The program below checks whether a number is even and finds the sum from 1 to n."]], "c": "n = int(input())\nif n % 2 == 0:\n    print(\"even\")\nelse:\n    print(\"odd\")\n\ns = 0\nfor i in range(1, n + 1):\n    s += i\nprint(s)"}, {"t": ["Функции и списки", "Функсияҳо ва рӯйхатҳо", "Functions and lists"], "p": [["Функция — это именованный кусок кода, который можно вызывать много раз. Её создают командой def, а результат возвращают через return.", "Список хранит несколько значений в одной переменной. Метод append добавляет элемент в конец, а len возвращает число элементов."], ["Функсия — порчаи номдори код аст, ки онро борҳо даъват кардан мумкин аст. Онро бо фармони def месозанд ва натиҷаро бо return бармегардонанд.", "Рӯйхат якчанд қиматро дар як тағйирёбанда нигоҳ медорад. Методи append унсурро ба охир илова мекунад ва len шумораи унсурҳоро бармегардонад."], ["A function is a named piece of code that you can call many times. You create it with def and give back a result with return.", "A list stores several values in one variable. The append method adds an item to the end, and len returns the number of items."]], "c": "def square(x):\n    return x * x\n\nnums = [1, 2, 3]\nnums.append(4)\nprint(len(nums))   # 4\nfor v in nums:\n    print(square(v))"}]}, {"id": "olymp", "pl": "gen", "lv": 2, "t": ["Алгоритмы для олимпиад", "Алгоритмҳо барои олимпиадаҳо", "Algorithms for Olympiads"], "d": ["Как читать условия, оценивать сложность, искать и считать суммы быстро.", "Чӣ тавр шартҳоро хондан, мураккабиро баҳо додан, ҷустуҷӯ ва ҷамъро зуд ҳисоб кардан.", "How to read problems, estimate complexity, search and sum quickly."], "ch": [{"t": ["Как читать условие", "Шартро чӣ тавр бояд хонд", "How to read a problem"], "p": [["В олимпиадной задаче всегда есть четыре части: легенда, формат входных данных, формат выходных данных и ограничения. Сначала найдите, что именно нужно вывести.", "Обязательно разберите примеры и придумайте свой маленький тест. Особенно внимательно смотрите на ограничения: по ним видно, какой алгоритм успеет сработать за отведённое время."], ["Дар масъалаи олимпиадавӣ ҳамеша чаҳор қисм мавҷуд аст: ҳикоя, формати маълумоти воридотӣ, формати маълумоти хориҷӣ ва маҳдудиятҳо. Аввал ёбед, ки айнан чиро бояд баровард.", "Мисолҳоро ҳатман таҳлил кунед ва тести хурди худатонро ихтироъ намоед. Ба маҳдудиятҳо махсусан диққат диҳед: аз онҳо маълум мешавад, ки кадом алгоритм дар вақти додашуда ҷавоб медиҳад."], ["An olympiad problem always has four parts: the story, the input format, the output format and the constraints. First find out exactly what you must print.", "Always work through the examples and invent a small test of your own. Pay special attention to the constraints: they show which algorithm will finish in the given time."]], "c": ""}, {"t": ["Сложность алгоритма", "Мураккабии алгоритм", "Algorithm complexity"], "p": [["Сложность показывает, как растёт время работы при увеличении данных. Запись O(n) значит, что время растёт пропорционально n, а O(n²) — что при увеличении n вдвое время вырастет примерно в четыре раза.", "Простое правило: за одну секунду программа успевает выполнить порядка 10⁸ простых операций. Если n = 100000, то алгоритм O(n²) (10¹⁰ операций) не успеет, а O(n log n) успеет."], ["Мураккабӣ нишон медиҳад, ки бо зиёд шудани маълумот вақти кор чӣ тавр меафзояд. Навишти O(n) маънои онро дорад, ки вақт мутаносиби n меафзояд, O(n²) бошад — ки бо ду баробар шудани n вақт тахминан чор маротиба зиёд мешавад.", "Қоидаи оддӣ: дар як сония барнома тақрибан 10⁸ амали оддиро иҷро карда метавонад. Агар n = 100000 бошад, алгоритми O(n²) (10¹⁰ амал) намерасад, вале O(n log n) мерасад."], ["Complexity shows how running time grows as the data grows. O(n) means the time grows in proportion to n, and O(n²) means that doubling n makes the time about four times longer.", "A simple rule: in one second a program can do about 10⁸ simple operations. If n = 100000, an O(n²) algorithm (10¹⁰ operations) is too slow, but O(n log n) is fast enough."]], "c": ""}, {"t": ["Сортировка и бинарный поиск", "Мураттабкунӣ ва ҷустуҷӯи дуӣ", "Sorting and binary search"], "p": [["Отсортированные данные легче обрабатывать. В Python список сортируют функцией sorted, и она работает за O(n log n).", "В отсортированном списке нужный элемент ищут бинарным поиском: берут середину, сравнивают с искомым числом и отбрасывают половину списка. Так поиск занимает всего около log n шагов."], ["Маълумоти мураттабшуда барои коркард осонтар аст. Дар Python рӯйхатро бо функсияи sorted мураттаб мекунанд ва он дар O(n log n) кор мекунад.", "Дар рӯйхати мураттабшуда унсури лозимиро бо ҷустуҷӯи дуӣ меёбанд: мобайнро мегиранд, бо адади ҷустуҷӯшаванда муқоиса мекунанд ва нисфи рӯйхатро ҳазф менамоянд. Ҷустуҷӯ ҳамин тавр тақрибан log n қадам мегирад."], ["Sorted data is easier to work with. In Python a list is sorted with the sorted function, which runs in O(n log n).", "In a sorted list you find an item with binary search: take the middle, compare it with the target and throw away half of the list. This way the search takes only about log n steps."]], "c": "def binary_search(a, x):\n    lo, hi = 0, len(a) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if a[mid] == x:\n            return mid\n        if a[mid] < x:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n\na = sorted([7, 2, 9, 4, 1])\nprint(binary_search(a, 7))  # 3"}, {"t": ["Префиксные суммы", "Ҷамъҳои префиксӣ", "Prefix sums"], "p": [["Допустим, нужно много раз быстро узнавать сумму элементов на отрезке массива. Считать сумму каждый раз слишком долго, поэтому один раз строим массив префиксных сумм.", "В нём pref[i] — сумма первых i элементов. Тогда сумма элементов с индекса l по r равна pref[r + 1] − pref[l], то есть любой запрос выполняется за одну операцию."], ["Фарз мекунем, ки борҳо ҷамъи унсурҳоро дар порчаи массив зуд донистан лозим аст. Ҳар дафъа ҷамъро ҳисоб кардан хеле дароз мекашад, барои ҳамин як маротиба массиви ҷамъҳои префиксиро месозем.", "Дар он pref[i] — ҷамъи i унсури аввал аст. Он гоҳ ҷамъи унсурҳо аз индекси l то r ба pref[r + 1] − pref[l] баробар аст, яъне ҳар як дархост бо як амал иҷро мешавад."], ["Suppose you must quickly find the sum of items on a segment of an array many times. Adding them up each time is too slow, so we build an array of prefix sums once.", "In it, pref[i] is the sum of the first i items. Then the sum of items from index l to r equals pref[r + 1] − pref[l], so every query takes a single operation."]], "c": "a = [3, 1, 4, 1, 5]\npref = [0]\nfor v in a:\n    pref.append(pref[-1] + v)\n\nl, r = 1, 3                  # indexes from 0\nprint(pref[r + 1] - pref[l])  # 6"}]}];

/* syntax highlighting */
function hl(code,id){
  var kw={};KW[id].split(' ').forEach(function(w){kw[w]=1});
  var cm=id==='py'?'#.*':'\\/\\/.*';
  var re=new RegExp('('+cm+')|("(?:[^"\\\\]|\\\\.)*")|(#include\\s*<[^>]+>)|(\\b\\d+\\b)|([A-Za-z_]\\w*)','g');
  var out='',last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    var t=m[0],cls='';
    if(m[1])cls='c';else if(m[2])cls='s';else if(m[3])cls='p';else if(m[4])cls='n';
    else if(kw[t])cls='k';
    else if(code.charAt(re.lastIndex)==='(')cls='f';
    else if(/^[A-Z]/.test(t))cls='t';
    out+=cls?'<span class="'+cls+'">'+esc(t)+'</span>':esc(t);
    last=re.lastIndex;
  }
  return out+esc(code.slice(last));
}

var PTCOL={alkali:'var(--s-red)',alkaline:'var(--s-orange)',trans:'var(--s-blue)',post:'var(--s-cyan)',metalloid:'var(--s-yellow)',nonmetal:'var(--s-green)',halogen:'var(--s-pink)',noble:'var(--s-violet)',lanth:'var(--accent)',actin:'var(--muted)'};
function ptPos(z){
  if(z===1)return[1,1];if(z===2)return[1,18];
  if(z<=4)return[2,z-2];if(z<=10)return[2,z+8];
  if(z<=12)return[3,z-10];if(z<=18)return[3,z];
  if(z<=36)return[4,z-18];if(z<=54)return[5,z-36];
  if(z<=56)return[6,z-54];if(z<=71)return[9,z-54];
  if(z<=86)return[6,z-68];
  if(z<=88)return[7,z-86];if(z<=103)return[10,z-86];
  return[7,z-100];
}
function ptCat(z){
  var S=function(a){return a.indexOf(z)>=0};
  if(S([2,10,18,36,54,86,118]))return'noble';
  if(S([9,17,35,53,85,117]))return'halogen';
  if(S([3,11,19,37,55,87]))return'alkali';
  if(S([4,12,20,38,56,88]))return'alkaline';
  if(S([5,14,32,33,51,52]))return'metalloid';
  if(S([1,6,7,8,15,16,34]))return'nonmetal';
  if(z>=57&&z<=71)return'lanth';if(z>=89&&z<=103)return'actin';
  if(S([13,31,49,50,81,82,83,84,113,114,115,116]))return'post';
  return'trans';
}
function ptBio(z){
  var e=PT[z-1],x=PTX[lang]||PTX.ru,cat=ptCat(z),p=ptPos(z),row=p[0]>8?7:(p[0]===9?6:p[0]);
  var st=[1,2,7,8,9,10,17,18,36,54,86,118].indexOf(z)>=0?'g':([35,80].indexOf(z)>=0?'l':'s');
  var grp=(cat==='lanth'||cat==='actin')?0:p[1];
  var nm=lang==='en'?e.en:e.ru;
  return '<h3>'+esc(nm)+' <span style="color:var(--muted);font-family:var(--font-mono)">'+e.s+' · '+z+'</span></h3><p>'+esc(x.f(e,nm,x.cat[cat],x.st[st],row,grp))+'</p>';
}
function ptView(){
  var x=PTX[lang]||PTX.ru;
  var cells=PT.map(function(e){var p=ptPos(e.z);
    return '<button type="button" class="ptc" data-el="'+e.z+'" aria-pressed="'+(curEl===e.z)+'" title="'+esc(lang==='en'?e.en:e.ru)+'" style="grid-row:'+p[0]+';grid-column:'+p[1]+';--c:'+PTCOL[ptCat(e.z)]+'"><i>'+e.z+'</i><b>'+e.s+'</b></button>';}).join('');
  var leg=Object.keys(x.cat).map(function(k){return '<span class="ptl" style="--c:'+PTCOL[k]+'"><i></i>'+esc(x.cat[k])+'</span>'}).join('');
  return '<h2 class="cm">'+esc(x.h)+'</h2><div class="ptleg">'+leg+'</div><div class="pt"><div class="ptg">'+cells+'</div></div>'+
    '<div class="elbio" id="elbio" style="--c:'+(curEl?PTCOL[ptCat(curEl)]:'var(--line)')+'">'+(curEl?ptBio(curEl):'<p>'+esc(x.hint)+'</p>')+'</div>';
}
function showEl(z){
  curEl=z;track('el',z);var b=document.getElementById('elbio');if(!b)return;
  b.style.setProperty('--c',PTCOL[ptCat(z)]);b.innerHTML=ptBio(z);
  var all=document.querySelectorAll('.ptc');for(var i=0;i<all.length;i++)all[i].setAttribute('aria-pressed',String(+all[i].getAttribute('data-el')===z));
  b.scrollIntoView({block:'nearest',behavior:'smooth'});
}

var TOPIC_INFO={
alg:{
ru:['Линейное уравнение имеет вид ax + b = 0. Чтобы его решить, переносим слагаемые и делим на коэффициент: x = −b / a. Проверка: подставьте найденное x обратно в уравнение.','Уравнение ax² + bx + c = 0 решают через дискриминант D = b² − 4ac. Если D > 0 — два корня, D = 0 — один, D < 0 — действительных корней нет.','Функция сопоставляет каждому x ровно одно значение y. График линейной функции y = kx + b — прямая: k задаёт наклон, b — точку пересечения с осью y.','Решение неравенства — множество значений x, при которых оно верно. При умножении или делении на отрицательное число знак неравенства меняется на противоположный.','В арифметической прогрессии каждый член больше предыдущего на разность d, в геометрической — умножается на знаменатель q. Для них есть формулы n-го члена и суммы.'],
tg:['Муодилаи хатӣ намуди ax + b = 0 дорад. Барои ҳал кардан ҷамъшавандаҳоро мегузаронем ва ба коэффитсиент тақсим мекунем: x = −b / a. Санҷиш: x-и ёфташударо ба муодила гузоред.','Муодилаи ax² + bx + c = 0 тавассути дискриминант D = b² − 4ac ҳал мешавад. Агар D > 0 — ду реша, D = 0 — як реша, D < 0 — решаи ҳақиқӣ нест.','Функсия ба ҳар як x танҳо як қимати y мегузорад. Графики функсияи хатии y = kx + b хати рост аст: k моилиро, b нуқтаи буриши меҳвари y-ро муайян мекунад.','Ҳалли нобаробарӣ маҷмӯи қиматҳои x аст, ки нобаробарӣ барои онҳо дуруст аст. Ҳангоми зарб ё тақсим ба адади манфӣ аломати нобаробарӣ ба муқобил иваз мешавад.','Дар прогрессияи арифметикӣ ҳар аъзо аз пешинааш ба фарқият d зиёд аст, дар прогрессияи геометрӣ ба махраҷ q зарб мешавад. Барои онҳо формулаҳои аъзои n-ум ва ҷамъ мавҷуданд.'],
en:['A linear equation has the form ax + b = 0. Move terms across and divide by the coefficient: x = −b / a. Check the answer by substituting x back into the equation.','ax² + bx + c = 0 is solved with the discriminant D = b² − 4ac. If D > 0 there are two roots, D = 0 one root, D < 0 no real roots.','A function assigns exactly one y to every x. The graph of y = kx + b is a straight line: k sets the slope and b is where it crosses the y-axis.','Solving an inequality means finding all x for which it is true. Multiplying or dividing by a negative number flips the inequality sign.','In an arithmetic sequence each term grows by a constant difference d; in a geometric sequence it is multiplied by a ratio q. Both have formulas for the n-th term and the sum.']},
geo:{
ru:['Сумма углов треугольника равна 180°. Треугольники бывают остроугольные, прямоугольные и тупоугольные; в прямоугольном работает теорема Пифагора a² + b² = c².','Окружность — множество точек, равноудалённых от центра. Длина окружности C = 2πr, диаметр вдвое больше радиуса, а вписанный угол вдвое меньше центрального, опирающегося на ту же дугу.','Площадь измеряется в квадратных единицах. Прямоугольник: S = a · b, треугольник: S = ½ · a · h, круг: S = πr², параллелограмм: S = a · h.','Вектор — направленный отрезок: у него есть длина и направление. Векторы можно складывать, вычитать и умножать на число; в координатах длина вектора (x; y) равна √(x² + y²).','Объём показывает, сколько места занимает тело. Куб: V = a³, параллелепипед: V = a · b · c, цилиндр: V = πr²h, шар: V = (4/3)πr³.'],
tg:['Ҷамъи кунҷҳои секунҷа ба 180° баробар аст. Секунҷаҳо тезкунҷа, росткунҷа ва кундкунҷа мешаванд; дар росткунҷа теоремаи Пифагор a² + b² = c² амал мекунад.','Давра маҷмӯи нуқтаҳоест, ки аз марказ яксон дур мебошанд. Дарозии давра C = 2πr, диаметр ду баробари радиус аст, кунҷи даруни давра нисфи кунҷи марказӣ мебошад, ки ба ҳамон камон такя мекунад.','Масоҳат бо воҳидҳои мураббаъ чен карда мешавад. Росткунҷа: S = a · b, секунҷа: S = ½ · a · h, давра: S = πr², параллелограмм: S = a · h.','Вектор — порчаи самтдор: он дарозӣ ва самт дорад. Векторҳоро ҷамъ, тарҳ ва ба адад зарб кардан мумкин; дар координатаҳо дарозии вектори (x; y) ба √(x² + y²) баробар аст.','Ҳаҷм нишон медиҳад, ки ҷисм чӣ қадар ҷой мегирад. Куб: V = a³, параллелепипед: V = a · b · c, силиндр: V = πr²h, кура: V = (4/3)πr³.'],
en:['The angles of a triangle add up to 180°. Triangles can be acute, right or obtuse; in a right triangle the Pythagorean theorem a² + b² = c² applies.','A circle is the set of points at the same distance from the centre. Its circumference is C = 2πr, the diameter is twice the radius, and an inscribed angle is half the central angle on the same arc.','Area is measured in square units. Rectangle: S = a · b, triangle: S = ½ · a · h, circle: S = πr², parallelogram: S = a · h.','A vector is a directed segment with a length and a direction. Vectors can be added, subtracted and multiplied by a number; in coordinates the length of (x; y) is √(x² + y²).','Volume shows how much space a solid takes. Cube: V = a³, box: V = a · b · c, cylinder: V = πr²h, sphere: V = (4/3)πr³.']},
phy:{
ru:['Механика изучает движение тел и силы. Три закона Ньютона связывают силу, массу и ускорение: если сила не действует, скорость тела не меняется, а при действии силы F = m · a.','Тепло — это энергия хаотичного движения частиц. Количество теплоты для нагрева тела Q = c · m · Δt; тепло переходит от более нагретого тела к менее нагретому.','Электрический ток — упорядоченное движение зарядов. Закон Ома: I = U / R. Мощность тока P = U · I, а сопротивление проводника растёт с его длиной.','Колебания повторяются во времени, волны переносят энергию. Частота ν = 1 / T измеряется в герцах, а скорость волны v = λ · ν, где λ — длина волны.','Оптика изучает свет. Свет распространяется прямолинейно, отражается (угол падения равен углу отражения) и преломляется; на этом работают линзы, очки и микроскопы.'],
tg:['Механика ҳаракати ҷисмҳо ва қувваҳоро меомӯзад. Се қонуни Нютон қувва, масса ва шитобро мепайвандад: агар қувва амал накунад, суръат тағйир намеёбад, бо амали қувва F = m · a.','Гармӣ энергияи ҳаракати бетартиби зарраҳост. Миқдори гармӣ барои гарм кардани ҷисм Q = c · m · Δt; гармӣ аз ҷисми гармтар ба ҷисми камгарм мегузарад.','Ҷараёни барқ ҳаракати мунтазами зарядҳост. Қонуни Ом: I = U / R. Қуввати ҷараён P = U · I, муқовимати наққол бо дарозиаш меафзояд.','Ларзишҳо бо мурури вақт такрор мешаванд, мавҷҳо энергияро интиқол медиҳанд. Басомад ν = 1 / T бо герс чен мешавад, суръати мавҷ v = λ · ν, ки λ дарозии мавҷ аст.','Оптика рӯшноиро меомӯзад. Рӯшноӣ рост паҳн мешавад, инъикос мешавад (кунҷи фуровардан ба кунҷи инъикос баробар аст) ва шикаста мешавад; линзаҳо, айнак ва микроскопҳо ба ҳамин асос кор мекунанд.'],
en:['Mechanics studies the motion of bodies and forces. Newton’s three laws link force, mass and acceleration: with no force the velocity stays constant, and with a force F = m · a.','Heat is the energy of random motion of particles. The heat needed to warm a body is Q = c · m · Δt; heat flows from the hotter body to the colder one.','Electric current is the ordered motion of charges. Ohm’s law: I = U / R. Power is P = U · I, and a conductor’s resistance grows with its length.','Oscillations repeat in time and waves carry energy. Frequency ν = 1 / T is measured in hertz, and wave speed is v = λ · ν, where λ is the wavelength.','Optics studies light. Light travels in straight lines, reflects (the angle of incidence equals the angle of reflection) and refracts; lenses, glasses and microscopes work this way.']},
che:{
ru:['Атом состоит из ядра (протоны и нейтроны) и электронов. Номер элемента в периодической таблице равен числу протонов; элементы в одном столбце похожи по свойствам.','Атомы соединяются химическими связями: ионной (передача электронов, как в NaCl), ковалентной (общие электронные пары, как в H₂O) и металлической.','В уравнении реакции число атомов каждого элемента слева и справа одинаково — это закон сохранения массы. Коэффициенты подбирают так, чтобы уравнять атомы.','Раствор — однородная смесь растворителя и растворённого вещества. Концентрацию выражают массовой долей ω = m(вещества) / m(раствора) или молярностью.','Органическая химия изучает соединения углерода: углеводороды, спирты, кислоты. Углерод образует длинные цепи, поэтому органических веществ очень много.'],
tg:['Атом аз ядро (протонҳо ва нейтронҳо) ва электронҳо иборат аст. Рақами элемент дар ҷадвали даврӣ ба шумораи протонҳо баробар аст; элементҳои як сутун хосиятҳои монанд доранд.','Атомҳо бо пайвастагиҳои химиявӣ мепайванданд: ионӣ (додани электронҳо, чун дар NaCl), ковалентӣ (ҷуфтҳои умумии электронӣ, чун дар H₂O) ва металлӣ.','Дар муодилаи реаксия шумораи атомҳои ҳар як элемент дар тарафи чап ва рост яксон аст — ин қонуни бақои масса мебошад. Коэффитсиентҳоро барои баробар кардани атомҳо интихоб мекунанд.','Маҳлул омехтаи якҷинсаи ҳалкунанда ва моддаи ҳалшуда аст. Консентратсияро бо ҳиссаи массавӣ ω = m(модда) / m(маҳлул) ё молярӣ ифода мекунанд.','Химияи органикӣ пайвастагиҳои карбонро меомӯзад: гидрокарбонҳо, спиртҳо, кислотаҳо. Карбон занҷирҳои дароз месозад, барои ҳамин моддаҳои органикӣ хеле зиёданд.'],
en:['An atom consists of a nucleus (protons and neutrons) and electrons. An element’s number in the periodic table equals its protons; elements in one column have similar properties.','Atoms join through chemical bonds: ionic (electrons transfer, as in NaCl), covalent (shared electron pairs, as in H₂O) and metallic.','In a reaction equation each element has the same number of atoms on both sides — the law of conservation of mass. Coefficients are chosen to balance the atoms.','A solution is a uniform mixture of a solvent and a dissolved substance. Concentration is given as mass fraction ω = m(substance) / m(solution) or as molarity.','Organic chemistry studies carbon compounds: hydrocarbons, alcohols, acids. Carbon forms long chains, which is why there are so many organic substances.']},
bio:{
ru:['Клетка — основная единица жизни. В клетках растений и животных есть ядро с ДНК, митохондрии (энергия) и мембрана; только у растений есть хлоропласты и клеточная стенка.','Генетика изучает наследственность. Признаки определяют гены в ДНК; от каждого родителя потомок получает по одному аллелю, а доминантный признак проявляется сильнее рецессивного.','Тело человека состоит из систем органов: кровеносной, дыхательной, пищеварительной, нервной и других. Вместе они поддерживают постоянство внутренней среды.','Эволюция — историческое развитие живой природы. По теории Дарвина её двигают изменчивость, наследственность и естественный отбор: выживают наиболее приспособленные.','Экология изучает связи организмов со средой. В экосистеме есть продуценты, консументы и редуценты; энергия передаётся по пищевым цепям, а на каждом звене теряется около 90 %.'],
tg:['Ҳуҷайра воҳиди асосии ҳаёт аст. Дар ҳуҷайраҳои набототу ҳайвонот ядро бо ДНК, митохондрияҳо (энергия) ва мембрана ҳаст; хлоропластҳо ва девораи ҳуҷайравӣ танҳо дар наботот мебошанд.','Генетика ирсиятро меомӯзад. Аломатҳоро генҳои ДНК муайян мекунанд; насл аз ҳар падару модар як аллел мегирад, аломати доминантӣ аз рецессивӣ қавитар зоҳир мешавад.','Бадани одам аз низомҳои узвҳо иборат аст: гардиши хун, нафас, ҳозима, асаб ва дигарон. Онҳо якҷоя доимии муҳити дохилиро нигоҳ медоранд.','Эволютсия инкишофи таърихии табиати зинда аст. Тибқи назарияи Дарвин онро тағйирёбандагӣ, ирсият ва интихоби табиӣ пеш мебаранд: мутобиқтаринҳо зинда мемонанд.','Экология алоқаи организмҳоро бо муҳит меомӯзад. Дар экосистема продуцентҳо, консументҳо ва редуцентҳо ҳастанд; энергия аз рӯи занҷирҳои ғизоӣ мегузарад ва дар ҳар ҳалқа тақрибан 90 % гум мешавад.'],
en:['The cell is the basic unit of life. Plant and animal cells have a nucleus with DNA, mitochondria (energy) and a membrane; only plants have chloroplasts and a cell wall.','Genetics studies heredity. Traits are determined by genes in DNA; an offspring gets one allele from each parent, and a dominant trait shows over a recessive one.','The human body is made of organ systems: circulatory, respiratory, digestive, nervous and others. Together they keep the internal environment stable.','Evolution is the historical development of living nature. In Darwin’s theory it is driven by variation, heredity and natural selection: the best adapted survive.','Ecology studies how organisms relate to their environment. An ecosystem has producers, consumers and decomposers; energy moves along food chains and about 90 % is lost at each link.']}
};
var FACTS={
inf:{ru:['Первый в мире программист — Ада Лавлейс: в 1843 году она написала алгоритм для механической машины Бэббиджа.','Один символ в кодировке Unicode (UTF-8) может занимать до 4 байт — так в тексте помещаются и буквы, и эмодзи.'],tg:['Аввалин барномасози ҷаҳон — Ада Лавлейс: соли 1843 ӯ барои мошини механикии Бэббидж алгоритм навишт.','Як аломат дар рамзгузории Unicode (UTF-8) то 4 байт ҷой мегирад — барои ҳамин дар матн ҳам ҳарфҳо, ҳам эмоҷиҳо ҷо мешаванд.'],en:['The world’s first programmer is Ada Lovelace: in 1843 she wrote an algorithm for Babbage’s mechanical machine.','One character in Unicode (UTF-8) can take up to 4 bytes, which is how a text holds both letters and emoji.']},
alg:{ru:['Слово «алгебра» происходит от труда аль-Хорезми «аль-джебр» (IX век) — учёного из Средней Азии.','Квадратные уравнения умели решать ещё в Вавилоне около 4000 лет назад.'],tg:['Калимаи «алгебра» аз асари ал-Хоразмӣ «ал-ҷабр» (асри IX) — олими Осиёи Марказӣ — пайдо шудааст.','Муодилаҳои квадратиро ҳанӯз дар Бобил тақрибан 4000 сол пеш ҳал карда метавонистанд.'],en:['The word “algebra” comes from al-Khwarizmi’s book “al-jabr” (9th century), a scholar from Central Asia.','People solved quadratic equations in Babylon about 4,000 years ago.']},
geo:{ru:['Теорема Пифагора была известна вавилонянам и индийцам задолго до Пифагора.','Сумма углов треугольника равна 180° только на плоской поверхности; на сфере она больше.'],tg:['Теоремаи Пифагорро бобилиён ва ҳиндуҳо хеле пеш аз Пифагор медонистанд.','Ҷамъи кунҷҳои секунҷа танҳо дар сатҳи ҳамвор ба 180° баробар аст; дар кура аз ин зиёд мебошад.'],en:['The Pythagorean theorem was known to the Babylonians and Indians long before Pythagoras.','A triangle’s angles add up to 180° only on a flat surface; on a sphere the sum is larger.']},
phy:{ru:['Свет Солнца идёт до Земли около 8 минут 20 секунд.','Скорость света в вакууме — примерно 300 000 км/с: ничто не движется быстрее.'],tg:['Рӯшноии Офтоб то Замин тақрибан 8 дақиқа ва 20 сония мерасад.','Суръати рӯшноӣ дар хало тақрибан 300 000 км/с аст: ҳеҷ чиз аз он тезтар ҳаракат намекунад.'],en:['Sunlight takes about 8 minutes 20 seconds to reach the Earth.','The speed of light in a vacuum is about 300,000 km/s: nothing moves faster.']},
che:{ru:['Периодическую систему элементов Менделеев составил в 1869 году и предсказал свойства ещё не открытых элементов.','Вода — одно из немногих веществ, которое в твёрдом виде (лёд) легче, чем в жидком.'],tg:['Ҷадвали даврии элементҳоро Менделеев соли 1869 тартиб дод ва хосиятҳои элементҳои ҳанӯз кашфнашударо пешгӯӣ кард.','Об аз он моддаҳои камшумор аст, ки дар ҳолати сахт (ях) аз моеъ сабуктар мебошад.'],en:['Mendeleev compiled the periodic table in 1869 and predicted the properties of elements not yet discovered.','Water is one of the few substances that is lighter as a solid (ice) than as a liquid.']},
bio:{ru:['В теле взрослого человека около 30 триллионов клеток.','ДНК одной клетки, если её растянуть, имела бы длину около двух метров.'],tg:['Дар бадани одами калонсол тақрибан 30 триллион ҳуҷайра ҳаст.','ДНК-и як ҳуҷайра, агар дароз карда шавад, тақрибан ду метр дарозӣ дошта мебошад.'],en:['An adult human body has about 30 trillion cells.','The DNA of a single cell, stretched out, would be about two metres long.']}
};

function viewSubject(id){

/* calculator */
function calcEval(src){
  var s=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.').replace(/π/g,'pi').replace(/√/g,'sqrt');
  var tok=(s.match(/\d+\.?\d*|\.\d+|sqrt|pi|[-+*\/^()]|\s+|./g)||[]).filter(function(t){return !/^\s+$/.test(t)});
  var i=0;
  function peek(){return tok[i]}
  function next(){return tok[i++]}
  function expr(){var v=term();while(peek()==='+'||peek()==='-'){var o=next(),r=term();v=o==='+'?v+r:v-r;}return v;}
  function term(){var v=unary();while(peek()==='*'||peek()==='/'){var o=next(),r=unary();v=o==='*'?v*r:v/r;}return v;}
  function unary(){if(peek()==='-'){next();return -unary();}if(peek()==='+'){next();return unary();}return pow();}
  function pow(){var b=atom();if(peek()==='^'){next();return Math.pow(b,unary());}return b;}
  function atom(){
    var t=next();if(t===undefined)throw new Error('x');
    if(t==='('){var v=expr();if(next()!==')')throw new Error('x');return v;}
    if(t==='pi')return Math.PI;
    if(t==='sqrt')return Math.sqrt(atom());
    if(/^[\d.]/.test(t)){var n=parseFloat(t);if(isNaN(n))throw new Error('x');return n;}
    throw new Error('x');
  }
  if(!tok.length)throw new Error('x');
  var v=expr();
  if(i<tok.length||!isFinite(v))throw new Error('x');
  return v;
}
function fmtNum(v){return String(Number(v.toPrecision(12)));}
function updateCalc(){
  var out=$('#calc-out'),inp=$('#calc-in');
  if(!out)return;
  if(inp&&inp.value!==calcExpr)inp.value=calcExpr;
  if(!calcExpr.trim()){out.textContent='0';return;}
  try{out.textContent='= '+fmtNum(calcEval(calcExpr));}catch(e){out.textContent='…';}
}
function calcEquals(){
  var out=$('#calc-out');
  try{var r=fmtNum(calcEval(calcExpr));calcHist.unshift(calcExpr+' = '+r);calcHist=calcHist.slice(0,8);calcExpr=r;renderHist();updateCalc();}
  catch(e){if(out)out.textContent=ui('err');}
}

function calcKey(k){
  if(k==='C')calcExpr='';
  else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);
  else if(k==='=')return calcEquals();
  else if(k==='x²')calcExpr+='^2';
  else if(k==='√')calcExpr+='√(';
  else calcExpr+=k;
  updateCalc();
}

var EXW=6,EXH=5;

var CMD={f:{fn:'forward'},l:{fn:'turnLeft'},r:{fn:'turnRight'}};
function isWall(x,y){return LV[exLevel].walls.some(function(w){return w[0]===x&&w[1]===y});}
function exReset(){var s=LV[exLevel].start;exSt={x:s[0],y:s[1],d:s[2]};exActive=-1;}
function clearExec(){exRunning=false;if(exTimer){clearTimeout(exTimer);exTimer=null;}}
function exGridHtml(){
  var L=LV[exLevel],out='';
  for(var y=0;y<EXH;y++)for(var x=0;x<EXW;x++){
    var cls='cell';if(isWall(x,y))cls+=' wall';if(x===L.goal[0]&&y===L.goal[1])cls+=' goal';
    var inner=(exSt.x===x&&exSt.y===y)?'<svg class="bot" viewBox="0 0 24 24" style="transform:rotate('+(exSt.d*90)+'deg)"><path d="M4 3l17 9-17 9 4-9z" fill="currentColor"/></svg>':'';

}

function exCmd(c){
  if(c==='run')return exRun();
  clearExec();exReset();exSet('','');
  var p=progs[exLevel];
  if(c==='undo')p.pop();else if(c==='clear')progs[exLevel]=[];else p.push(c);
  refreshExec();
}
function exRun(){
  var p=progs[exLevel];clearExec();exReset();exSet('','');
  if(!p.length){exSet(ui('ex_empty'),'bad');refreshExec();return;}
  var i=0;exRunning=true;refreshExec();
  function step(){
    if(!exRunning)return;
    if(i>=p.length){
      exRunning=false;exActive=-1;var g=LV[exLevel].goal;
      track('exT');
      if(exSt.x===g[0]&&exSt.y===g[1]){track('ex',exLevel);exSet(ui('ex_ok').replace('{n}',p.length),'ok');}else exSet(ui('ex_miss'),'bad');
      refreshExec();return;
    }
    var c=p[i];exActive=i;
    if(c==='l')exSt.d=(exSt.d+3)%4;
    else if(c==='r')exSt.d=(exSt.d+1)%4;
    else{
      var nx=exSt.x+[1,0,-1,0][exSt.d],ny=exSt.y+[0,1,0,-1][exSt.d];
      if(nx<0||ny<0||nx>=EXW||ny>=EXH||isWall(nx,ny)){exRunning=false;exSet(ui('ex_wall'),'bad');refreshExec();return;}
      exSt.x=nx;exSt.y=ny;
    }
    i++;refreshExec();exTimer=setTimeout(step,420);
  }
  exTimer=setTimeout(step,200);
}

function refreshUsersBox(){

  var c=document.getElementById('ucount');if(c)c.textContent=r.all;var o=document.getElementById('uonline');if(o)o.textContent=r.on;
}
function loadUsers(){
  if(!AUTH_API)return;
  var tok=getToken();if(!tok||!sessionLogin())return;
  api('users',{session:tok}).then(function(r){
    if(!r.ok){
      if(r.error==='auth'){SRV.expired=true;setSession(null);setToken('');SRV.list=null;renderAuth();if(view==='users')render();return;}
      SRV.err=true;refreshUsersBox();return;
    }
    SRV.list=r.users;SRV.admin=!!(r.me&&r.me.admin);SRV.persistent=r.persistent;SRV.at=Date.now();SRV.err=false;refreshUsersBox();
  }).catch(function(){if(!SRV.list)SRV.err=true;refreshUsersBox();});

}

      return head(ui('t_users'),ui('users_note'),'USERS','cyan')+'<div class="readme"><p>'+esc(ui(_m))+'</p><button type="button" class="btn" data-users-login>'+esc(ui(_li?'users_relogin_btn':'users_login'))+'</button></div>';

function render(){
  var v=view,h;
  if(v==='home')h=viewHome();

  else if(v==='books')h=viewBooks();
  else if(v==='problems')h=viewProblems();
  else if(v==='languages')h=viewLangs();
  else if(v==='calculator')h=viewCalc();
  else if(v==='users')h=viewUsers();
  else if(v==='quizzes')h=viewQuiz();
  else h=viewHome();
  $('#view').innerHTML=h;
  renderChrome();
  renderAuth();
  if(subj(v))track('s',v);
  if(v==='books'&&readBook>=0){track('ch',readBook+'_'+readCh);streakHit();}
  if(v==='books')renderBookList();
  if(v==='problems')renderProblemList();
  if(v==='languages')renderLangList();
  if(v==='calculator'){renderHist();updateCalc();}
  if(v==='quizzes'){exReset();refreshExec();}
  if(v==='users')loadUsers();
}
function route(){
  var h=location.hash.slice(1);
  if(VIEWS.indexOf(h)<0)h='home';

}

function sendCode(){
  var p=regPending;

}
function resendCode(){
  if(!regPending)return;authErr('');

    if(!r.ok)return authErr(errKey(r.error));
    startResendTimer(60);
  }).catch(function(){authErr('e_net')});
}
function submitAuth(){
  if(authMode==='code')return submitCode();
  var reg=authMode==='register',email=(document.getElementById('a-login').value||'').trim().toLowerCase(),pw=document.getElementById('a-pass').value||'';
  var EMAIL=/^[^\s@]+@gmail\.com$/;
  if(reg){
    var name=(document.getElementById('a-name').value||'').trim(),pw2=document.getElementById('a-pass2').value||'',country=(document.getElementById('a-country').value||'');
    if(!name||!email||!pw||!pw2)return authErr('e_fill');
    if(name.length<2)return authErr('e_name');
    if(!country)return authErr('e_country');
    if(!EMAIL.test(email))return authErr('e_email');
    if(pw.length<6)return authErr('e_pass');
    if(pw!==pw2)return authErr('e_match');
    if(!AUTH_API&&Object.prototype.hasOwnProperty.call(getUsers(),email))return authErr('e_exists');
    authErr('');busy(true);
    if(!AUTH_API){
      pwHash(email,pw).then(function(hh){
        var us=getUsers();
        if(Object.prototype.hasOwnProperty.call(us,email)){busy(false);return authErr('e_exists');}
        us[email]={name:name,hash:hh,created:Date.now()};
        if(!putUsers(us)){busy(false);return authErr('e_net');}
        busy(false);finishLogin(email,name);
      }).catch(function(){busy(false);authErr('e_net')});
      return;
    }
    pwHash(email,pw).then(function(hh){
      regPending={name:name,email:email,hash:hh,country:country};
      return sendCode();
    }).then(function(r){
      busy(false);
      if(!r.ok){regPending=null;return authErr(errKey(r.error));}
      openAuth('code');
    }).catch(function(){busy(false);authErr('e_net')});
  }else{
    if(!email||!pw)return authErr('e_fill');
    authErr('');busy(true);
    if(AUTH_API){
      pwHash(email,pw).then(function(hh){return api('login',{email:email,hash:hh})}).then(function(r){
        busy(false);if(!r.ok)return authErr(errKey(r.error==='bad_login'?'bad_login':r.error));
        finishLogin(email,r.name,r);
      }).catch(function(){busy(false);authErr('e_net')});
    }else{
      var users=getUsers(),u=Object.prototype.hasOwnProperty.call(users,email)?users[email]:null;
      if(!u){busy(false);return authErr('e_bad');}
      (u.salt?sha(u.salt+pw):pwHash(email,pw)).then(function(hh){busy(false);if(hh!==u.hash)return authErr('e_bad');finishLogin(email,u.name);});
    }
  }
}
function submitCode(){
  var p=regPending;if(!p)return openAuth('register');
  var code=(document.getElementById('a-code').value||'').replace(/\D/g,'');
  if(code.length!==6)return authErr('e_code');
  authErr('');busy(true);
  if(AUTH_API){
    api('verify',{email:p.email,code:code,name:p.name,hash:p.hash,country:p.country}).then(function(r){
      busy(false);if(!r.ok)return authErr(errKey(r.error));
      finishLogin(p.email,r.name||p.name,r);
    }).catch(function(){busy(false);authErr('e_net')});
  }else{busy(false);authErr('e_nomail');}
}

function bgAnim(sb){

  var r=bgRand(11+AVN.indexOf(sb)*97),h='',i,k;
  function P(a,b){return a+r()*(b-a);}

  function dur(a,b){return 'animation-duration:'+N(a,b)+'s;animation-delay:-'+N(0,b)+'s;';}

      h+='<span class="bg-d" style="left:'+N(i*5.5,i*5.5+3)+'%;font-size:'+Math.round(P(11,16))+'px;'+dur(5,12)+'">'+d+'</span>';}

  }else if(sb==='geo'){
    var sh=['tri','sq','cir','hex','ring','sqr'];

/* ---------- number theory ---------- */
function aiNT(t){
  var ints=(t.match(/\d+/g)||[]).map(Number).filter(function(x){return x<=1e12;});
  var m;
  if((m=/(\d+)\s*!/.exec(t)||/(?:факториал[а-яё]*|factorial)\s*(?:от|of)?\s*(\d+)/.exec(t))&&typeof BigInt!=='undefined'){
    var n=+m[1];if(n>100)return aiT('Слишком большое число (до 100).','Рақам хеле калон аст (то 100).','Number too large (up to 100).');
    var f=1n;for(var i=2;i<=n;i++)f*=BigInt(i);return n+'! = **'+f.toString()+'**';
  }
  if(/(?:^|[^а-яё])(нод|нок)(?![а-яё])|\bgcd\b|\blcm\b|наибольш[а-яё]* общ[а-яё]* делител|наименьш[а-яё]* общ[а-яё]* кратн|бузургтарин бахшёбандаи умумӣ/.test(t)&&ints.length>=2){
    var g=ints[0],l=ints[0];
    for(var k=1;k<ints.length;k++){g=aiGcd(g,ints[k]);l=l/aiGcd(l,ints[k])*ints[k];}
    var isL=/нок|lcm|наименьш/.test(t)&&!/нод|gcd|наибольш/.test(t);
    return (isL?aiT('НОК','ХКУ','LCM'):aiT('НОД','БУБ','GCD'))+'('+ints.join(', ')+') = **'+(isL?l:g)+'**'+(isL?'':'\n'+aiT('НОК','ХКУ','LCM')+' = '+l);
  }
  if(ints.length>=1&&/разлож[а-яё]* на (?:простые )?множител|factori[sz]e|prime factors|ба зарбкунандаҳои оддӣ/.test(t)){
    var x=ints[0],orig=x;if(x<2)return null;var fs={},p=2;
    while(p*p<=x){while(x%p===0){fs[p]=(fs[p]||0)+1;x/=p;}p++;}
    if(x>1)fs[x]=(fs[x]||0)+1;
    return orig+' = **'+Object.keys(fs).map(function(q){return fs[q]>1?q+'^'+fs[q]:q;}).join(' · ')+'**';
  }
  if(ints.length>=1&&/прост[а-яё]* ли|простое число|является ли.*простым|is\s+\d+\s+(?:a\s+)?prime|prime number|оддӣ аст|содда/.test(t)){
    var y=ints[0];if(y<2)return y+' '+aiT('не является простым числом.','содда нест.','is not prime.');
    for(var d=2;d*d<=y;d++)if(y%d===0)return y+' = '+d+' · '+(y/d)+' → **'+aiT('составное число (не простое)','мураккаб (содда нест)','composite (not prime)')+'**';
    return y+' → **'+aiT('простое число','рақами содда','prime')+'** ('+aiT('нет делителей до √'+y,'тақсимкунандаҳо то √'+y+' нест','no divisors up to √'+y)+')';
  }
  return null;
}

/* ---------- arithmetic ---------- */
function aiArith(t){
  var s=t.replace(/(?:квадратный )?корень (?:из )?|sqrt\s*/g,'√').replace(/\bpi\b|\bпи\b/g,'π');
  var ms=s.match(/(?:-\s*)?[\d√π(][\d\s+\-*\/^().√π]*/g);if(!ms)return null;
  var best='';ms.forEach(function(x){x=x.trim();if(x.length>best.length)best=x;});
  if(!/[+\-*\/^√π]/.test(best))return null;
  best=best.replace(/[+\-*\/^\s.]+$/,'');
  if(!/[+\-*\/^√π]/.test(best))return null;
  var open=(best.match(/\(/g)||[]).length,cl=(best.match(/\)/g)||[]).length;
  while(cl<open){best+=')';cl++;}
  try{
    var v=calcEval(best);
    return best.replace(/\s+/g,'').replace(/([+\-*\/])/g,' $1 ').trim().replace(/\*/g,'×').replace(/\//g,'÷').replace(/\s+/g,' ').replace(/\(\s+/g,'(')+' = **'+aiF(v)+'**'+(!Number.isInteger(v)&&aiF(v).length>=11?aiT('\n(округлено до 10 значащих цифр)','\n(то 10 рақами муҳим мудаввар шуд)','\n(rounded to 10 significant digits)'):'');
  }catch(e){return null;}
}

/* ---------- site knowledge ---------- */
function aiKnow(t){
  if(typeof FORMULAS==='undefined'||typeof SUBJECTS==='undefined')return null;
  var langs=['ru','tg','en'],wantF=/формул|formula|фурмул/.test(t);
  var sub=null;
  SUBJECTS.forEach(function(s){
    langs.forEach(function(l){
      var nm=(s.name[l]||'').toLowerCase();
      if(nm.length>=4&&t.indexOf(nm.slice(0,Math.max(4,nm.length-2)))>-1)sub=sub||s;
    });
  });
  if(sub&&wantF&&FORMULAS[sub.id]){
    return '**'+aiT('Формулы','Формулаҳо','Formulas')+' — '+sub.name[aiL]+':**\n'+FORMULAS[sub.id].map(function(it){return '• '+it.l[aiL]+': '+it.f;}).join('\n');
  }
  var hits=[],bs=0;
  Object.keys(FORMULAS).forEach(function(id){FORMULAS[id].forEach(function(it){
    var sc=0;
    langs.forEach(function(l){(it.l[l]||'').toLowerCase().split(/[\s,.()\-–—\/]+/).forEach(function(w){
      if(w.length<3||['закон','закона','закони','формул','формула','law','the','что','как','для','при','and'].indexOf(w)>-1)return;
      var st=w.slice(0,w.length>=7?w.length-2:w.length);
      if(w.length>=5?t.indexOf(st)>-1:new RegExp('(?:^|[^а-яёa-z])'+st.replace(/[^а-яёa-z0-9]/g,'')).test(t))sc++;});});
    if(sc>bs){bs=sc;hits=[it];}else if(sc===bs&&sc>0)hits.push(it);
  });});
  if(hits.length===1)return '**'+hits[0].l[aiL]+':** '+hits[0].f;
  if(hits.length>1)return hits.map(function(it){return '• **'+it.l[aiL]+':** '+it.f;}).join('\n');
  if(sub)return '**'+sub.name[aiL]+'** — '+sub.desc[aiL]+'\n'+aiT('Могу показать формулы этого предмета: напишите «формулы '+sub.name.ru.toLowerCase()+'».','Формулаҳои ин фанро нишон дода метавонам.','I can show this subject\'s formulas: ask for "formulas".');
  return null;
}

function stCalc(){
  var days=stDays(),set={};days.forEach(function(d){set[d]=1});

  var sorted=days.slice().sort(),best=0,run=0,prev=null;
  sorted.forEach(function(k){var p=k.split('-'),t=new Date(+p[0],+p[1]-1,+p[2]).getTime();run=(prev!==null&&Math.round((t-prev)/864e5)===1)?run+1:1;prev=t;if(run>best)best=run;});

  aiPanel.classList.toggle('open',o);aiBtn.setAttribute('aria-expanded',String(o));
  if(o){setTimeout(function(){var i=document.getElementById('ai-in');if(i)i.focus();},30);}
}
function aiAsk(q){
  q=String(q||'').trim();if(!q)return;
  aiAsked=true;aiMsgs.push({r:'u',t:q});var ty={r:'a',typing:1};aiMsgs.push(ty);
  if(aiMsgs.length>60)aiMsgs.splice(1,aiMsgs.length-60);
  aiChips();aiDraw();
  setTimeout(function(){
    var a;aiLastQ=q;try{a=aiSolve(q,aiDetect(q));}catch(e){a=aiFallback();}
    var ix=aiMsgs.indexOf(ty);if(ix>-1)aiMsgs.splice(ix,1,{r:'a',t:a});aiDraw();
  },260);
}
aiBtn.addEventListener('click',function(){aiSetOpen(!aiPanel.classList.contains('open'));});
document.getElementById('ai-x').addEventListener('click',function(){aiSetOpen(false);aiBtn.focus();});
document.getElementById('ai-clear').addEventListener('click',function(){aiMsgs=[{r:'a',hello:1}];aiAsked=false;aiChips();aiDraw();});
document.getElementById('ai-form').addEventListener('submit',function(e){e.preventDefault();var i=document.getElementById('ai-in');var q=i.value;i.value='';aiAsk(q);});
document.getElementById('ai-chips').addEventListener('click',function(e){var b=e.target.closest('button');if(b&&b.hasAttribute('data-aiq'))aiAsk(b.getAttribute('data-aiq'));});
aiPanel.addEventListener('keydown',function(e){if(e.key==='Escape'){aiSetOpen(false);aiBtn.focus();}});
var aiOrigRender=render;
render=function(){aiOrigRender.apply(this,arguments);aiLang();};
aiLang();

window.addEventListener('hashchange',route);
route();
handleMagic();
(function(){var _u=curUserObj();if(_u&&!_u.main)setTimeout(function(){openAuth('setup')},500)})();
})();
</script>
