    return '<button type="button" class="ptc" data-el="'+e.z+'" aria-pressed="'+(curEl===e.z)+'" title="'+esc(lang==='en'?e.en:e.ru)+'" style="grid-row:'+p[0]+';grid-column:'+p[1]+';--c:'+PTCOL[ptCat(e.z)]+'"><i>'+e.z+'</i><b>'+e.s+'</b></button>';}).join('');
  var leg=Object.keys(x.cat).map(function(k){return '<span class="ptl" style="--c:'+PTCOL[k]+'"><i></i>'+esc(x.cat[k])+'</span>'}).join('');
  return '<h2 class="cm">'+esc(x.h)+'</h2><div class="ptleg">'+leg+'</div><div class="pt"><div class="ptg">'+cells+'</div></div>'+
    '<div class="elbio" id="elbio" style="--c:'+(curEl?PTCOL[ptCat(curEl)]:'var(--line)')+'">'+(curEl?ptBio(curEl):'<p>'+esc(x.hint)+'</p>')+'</div>';
}
function showEl(z){
  curEl=z;track('el',z);var b=document.getElementById('elbio');if(!b)return;
  b.style.setProperty('--c',PTCOL[ptCat(z)]);b.innerHTML=ptBio(z);
  var all=document.querySelectorAll('.ptc');for(var i=0;i<all.length;i++)all[i].setAttribute('aria-pressed',String(+all[i].getAttribute('data-el')===z));
  b.scrollIntoView({block:'nearest',behavior:'smooth'});
}
var TOPIC_INFO={"inf": [["Компьютер — устройство для хранения и обработки информации. Главные части: процессор выполняет команды, оперативная память временно хранит данные работающих программ, накопитель (SSD или жёсткий диск) хранит файлы постоянно, а монитор показывает результат.\nВсе части соединяет материнская плата. Процессор измеряют по числу ядер и частоте в гигагерцах, память и накопитель — в байтах: 1 КБ = 1024 байта, 1 МБ = 1024 КБ, 1 ГБ = 1024 МБ.", "Компютер — дастгоҳест барои нигоҳ доштан ва коркарди маълумот. Қисмҳои асосӣ: протсессор фармонҳоро иҷро мекунад, хотираи оперативӣ маълумоти барномаҳои фаъолро муваққатан нигоҳ медорад, нигаҳдорандаи маълумот (SSD ё диски сахт) файлҳоро доимо нигоҳ медорад ва монитор натиҷаро нишон медиҳад.\nҲамаи қисмҳоро плотаи модарӣ мепайвандад. Протсессорро аз рӯи шумораи ядроҳо ва басомад бо гигагерс, хотира ва нигаҳдорандаро бо байт мепаймоянд: 1 КБ = 1024 байт, 1 МБ = 1024 КБ, 1 ГБ = 1024 МБ.", "A computer is a device that stores and processes information. Its main parts: the processor executes instructions, RAM temporarily holds the data of running programs, the storage drive (SSD or hard disk) keeps files permanently, and the display shows the result.\nThe motherboard connects all parts. A processor is described by its number of cores and its speed in gigahertz; memory and storage are measured in bytes: 1 KB = 1024 bytes, 1 MB = 1024 KB, 1 GB = 1024 MB."], ["Устройства ввода передают информацию в компьютер: клавиатура, мышь, сканер, микрофон, веб-камера. Устройства вывода показывают результат: монитор, принтер, колонки, наушники.\nНекоторые устройства работают в обе стороны, например сенсорный экран и флешка. Их подключают через порты (USB, HDMI) или по беспроводной связи (Bluetooth, Wi-Fi). Для работы многих устройств нужны драйверы — небольшие программы-посредники.", "Дастгоҳҳои воридкунӣ маълумотро ба компютер мефиристанд: клавиатура, муш, сканер, микрофон, веб-камера. Дастгоҳҳои баровардан натиҷаро нишон медиҳанд: монитор, принтер, баландгӯякҳо, гӯшмонакҳо.\nБаъзе дастгоҳҳо ду тарафа кор мекунанд, масалан экрани ламсӣ ва флешка. Онҳоро тавассути портҳо (USB, HDMI) ё бо алоқаи бесим (Bluetooth, Wi-Fi) мепайванданд. Барои кори бисёр дастгоҳҳо драйверҳо лозиманд — барномаҳои хурди миёнарав.", "Input devices send information to the computer: keyboard, mouse, scanner, microphone, webcam. Output devices show the result: monitor, printer, speakers, headphones.\nSome devices work both ways, for example a touchscreen or a flash drive. They connect through ports (USB, HDMI) or wirelessly (Bluetooth, Wi-Fi). Many devices need drivers — small programs that let the system talk to them."], ["Первыми помощниками в счёте были счёты и арифмометр. В XIX веке Чарльз Бэббидж придумал программируемую машину, а Ада Лавлейс написала для неё первую в истории программу. Первые электронные ЭВМ 1940-х годов работали на лампах (ENIAC) и занимали целые комнаты.\nТранзисторы, а затем микросхемы сделали компьютеры меньше и дешевле. В 1970-х появились микропроцессоры и персональные компьютеры, позже — смартфоны и интернет. Сегодня в одном чипе миллиарды транзисторов.", "Аввалин ёрдамчиҳо дар ҳисоб чӯбҳисоб ва арифмометр буданд. Дар асри XIX Чарлз Беббидж мошини барномавӣ ихтироъ кард ва Ада Лавлейс барои он аввалин барномаро навишт. Аввалин МЭҲ-ҳои электронии солҳои 1940 бо лампаҳо кор мекарданд (ENIAC) ва тамоми утоқҳоро ишғол менамуданд.\nТранзисторҳо ва баъд микросхемаҳо компютерҳоро хурдтар ва арзонтар карданд. Дар солҳои 1970 микропротсессорҳо ва компютерҳои шахсӣ пайдо шуданд, баъдтар — смартфонҳо ва интернет. Имрӯз дар як чип миллиардҳо транзистор ҳаст.", "The first helpers for counting were the abacus and the mechanical calculator. In the 19th century Charles Babbage designed a programmable machine, and Ada Lovelace wrote the first program for it. The first electronic computers of the 1940s used vacuum tubes (ENIAC) and filled whole rooms.\nTransistors, and later integrated circuits, made computers smaller and cheaper. Microprocessors and personal computers appeared in the 1970s, then smartphones and the internet. Today a single chip holds billions of transistors."], ["Интернет — объединение миллионов сетей. У каждого устройства есть IP-адрес, а удобные имена сайтов (например, example.com) превращает в адреса система DNS. Страницы хранятся на серверах, браузер запрашивает их по протоколу HTTP или HTTPS и показывает вам.\nБезопасность: используйте длинные уникальные пароли, никому не сообщайте коды из сообщений, проверяйте, что адрес начинается с https, и не открывайте подозрительные ссылки и вложения.", "Интернет — иттиҳоди миллионҳо шабака аст. Ҳар дастгоҳ IP-суроға дорад ва номҳои қулайи сайтҳоро (масалан, example.com) системаи DNS ба суроға табдил медиҳад. Саҳифаҳо дар серверҳо нигоҳ дошта мешаванд, браузер онҳоро тавассути протоколи HTTP ё HTTPS талаб мекунад ва ба шумо нишон медиҳад.\nБехатарӣ: рамзҳои дароз ва ягонаро истифода баред, рамзҳои паёмҳоро ба касе нагӯед, санҷед, ки суроға бо https оғоз мешавад ва истинодҳо ва замимаҳои шубҳанокро накушоед.", "The internet is a union of millions of networks. Every device has an IP address, and the DNS system turns friendly site names (such as example.com) into addresses. Pages are stored on servers; the browser requests them over HTTP or HTTPS and shows them to you.\nStaying safe: use long unique passwords, never share codes from messages, check that the address starts with https, and do not open suspicious links or attachments."], ["Система счисления — способ записи чисел. В десятичной десять цифр, в двоичной — две (0 и 1), в восьмеричной — восемь, в шестнадцатеричной — шестнадцать (0–9 и A–F). Компьютер использует двоичную, потому что её просто реализовать: есть ток или нет тока.\nПеревод в десятичную: умножайте каждую цифру на степень основания. Например, 101101₂ = 32 + 8 + 4 + 1 = 45. Обратно — делите число на 2 и записывайте остатки снизу вверх.", "Низоми ҳисоб — тарзи навиштани рақамҳо. Дар даҳӣ даҳ рақам аст, дар дуӣ — ду (0 ва 1), дар ҳаштӣ — ҳашт, дар шонздаҳӣ — шонздаҳ (0–9 ва A–F). Компютер низоми дуиро истифода мебарад, зеро татбиқи он осон аст: ё ҷараён ҳаст, ё нест.\nБаргардонидан ба даҳӣ: ҳар рақамро ба дараҷаи асос зарб кунед. Масалан, 101101₂ = 32 + 8 + 4 + 1 = 45. Баръакс — рақамро ба 2 тақсим карда, бақияҳоро аз поён ба боло нависед.", "A number system is a way of writing numbers. Decimal has ten digits, binary has two (0 and 1), octal has eight, hexadecimal has sixteen (0–9 and A–F). A computer uses binary because it is easy to build: there is current or there is none.\nTo convert to decimal, multiply each digit by a power of the base. For example, 101101₂ = 32 + 8 + 4 + 1 = 45. To go back, divide by 2 and write the remainders from bottom to top."], ["Алгоритм — точная последовательность шагов для решения задачи. Программа записывает алгоритм на языке программирования. Основные идеи: переменные хранят значения, условия (if) выбирают путь, циклы (for, while) повторяют действия, функции собирают код в удобные блоки.\nНачните с простой программы, которая выводит текст, затем научитесь считать, проверять условия и повторять действия. Пять языков с примерами смотрите в разделе «Языки программирования».", "Алгоритм — пайдарпайии дақиқи қадамҳо барои ҳал кардани масъала. Барнома алгоритмро бо забони барномасозӣ менависад. Ғояҳои асосӣ: тағйирёбандаҳо қиматҳоро нигоҳ медоранд, шартҳо (if) роҳро интихоб мекунанд, давриҳо (for, while) амалро такрор мекунанд, функсияҳо рамзро ба блокҳои қулай ҷамъ мекунанд.\nАз барномаи оддие оғоз кунед, ки матнро мебарорад, баъд ҳисоб кардан, санҷидани шартҳо ва такрор кардани амалро омӯзед. Панҷ забонро бо мисолҳо дар бахши «Забонҳои барномасозӣ» бинед.", "An algorithm is an exact sequence of steps that solves a task. A program writes an algorithm in a programming language. The main ideas: variables store values, conditions (if) choose a path, loops (for, while) repeat actions, and functions group code into handy blocks.\nStart with a simple program that prints text, then learn to calculate, check conditions and repeat actions. See five languages with examples in the “Programming languages” section."]], "alg": [["Линейное уравнение имеет вид ax + b = 0 (a ≠ 0). Чтобы решить его, переносят слагаемые с x в одну сторону, числа — в другую, меняя знак, и делят на коэффициент: x = −b / a.\nПример: 3x − 6 = 0 → 3x = 6 → x = 2. Проверьте ответ, подставив его в исходное уравнение. Если a = 0, решений либо нет, либо их бесконечно много.", "Муодилаи хатӣ намуди ax + b = 0 (a ≠ 0) дорад. Барои ҳал кардан, ҷамъшавандаҳои дорои x-ро ба як тараф, рақамҳоро ба тарафи дигар бо тағйири аломат мекӯчонанд ва ба коэффисиент тақсим мекунанд: x = −b / a.\nМисол: 3x − 6 = 0 → 3x = 6 → x = 2. Ҷавобро бо гузоштан ба муодилаи аввала санҷед. Агар a = 0 бошад, ё ҳал нест, ё беохир зиёд аст.", "A linear equation has the form ax + b = 0 (a ≠ 0). To solve it, move the terms with x to one side and the numbers to the other, changing the sign, then divide by the coefficient: x = −b / a.\nExample: 3x − 6 = 0 → 3x = 6 → x = 2. Check the answer by substituting it into the original equation. If a = 0, there is either no solution or infinitely many."], ["Квадратное уравнение: ax² + bx + c = 0 (a ≠ 0). Дискриминант D = b² − 4ac. Если D > 0, два корня x = (−b ± √D) / 2a; если D = 0, один корень x = −b / 2a; если D < 0, действительных корней нет.\nПример: x² − 5x + 6 = 0, D = 25 − 24 = 1, x = (5 ± 1) / 2, то есть 2 и 3. По теореме Виета сумма корней равна −b/a, а произведение равно c/a.", "Муодилаи квадратӣ: ax² + bx + c = 0 (a ≠ 0). Дискриминант D = b² − 4ac. Агар D > 0 бошад, ду реша x = (−b ± √D) / 2a; агар D = 0 бошад, як реша x = −b / 2a; агар D < 0 бошад, решаи ҳақиқӣ нест.\nМисол: x² − 5x + 6 = 0, D = 25 − 24 = 1, x = (5 ± 1) / 2, яъне 2 ва 3. Тибқи теоремаи Виет суммаи решаҳо −b/a ва ҳосили зарби онҳо c/a аст.", "A quadratic equation: ax² + bx + c = 0 (a ≠ 0). The discriminant is D = b² − 4ac. If D > 0 there are two roots x = (−b ± √D) / 2a; if D = 0 there is one root x = −b / 2a; if D < 0 there are no real roots.\nExample: x² − 5x + 6 = 0, D = 25 − 24 = 1, x = (5 ± 1) / 2, so 2 and 3. By Vieta’s theorem the sum of the roots is −b/a and the product is c/a."], ["Функция сопоставляет каждому значению x одно значение y. Линейная функция y = kx + b — прямая: k задаёт наклон, b — точку пересечения с осью y. Парабола y = ax² + bx + c имеет вершину в точке x = −b / 2a.\nЧтобы построить график, составьте таблицу значений, отметьте точки и соедините их линией. Область определения — допустимые x, область значений — получающиеся y.", "Функсия ба ҳар қимати x як қимати y муқобил мегузорад. Функсияи хатӣ y = kx + b — хати рост: k моилиро, b нуқтаи буриши меҳвари y-ро муайян мекунад. Параболаи y = ax² + bx + c қуллаашро дар нуқтаи x = −b / 2a дорад.\nБарои сохтани график ҷадвали қиматҳо созед, нуқтаҳоро қайд карда, бо хат пайваст кунед. Соҳаи муайянӣ — x-ҳои мумкин, соҳаи қиматҳо — y-ҳои ҳосилшаванда.", "A function assigns exactly one value y to each value x. A linear function y = kx + b is a straight line: k sets the slope and b is where it crosses the y-axis. The parabola y = ax² + bx + c has its vertex at x = −b / 2a.\nTo draw a graph, make a table of values, mark the points and join them with a line. The domain is the allowed x values, the range is the resulting y values."], ["Неравенство сравнивает выражения знаками <, >, ≤, ≥. Решают его почти как уравнение, но при умножении или делении на отрицательное число знак неравенства меняется на противоположный.\nПример: −2x < 6 → x > −3. Ответ записывают промежутком: (−3; +∞). Для квадратных неравенств находят корни и смотрят знак выражения на числовой оси.", "Нобаробарӣ ифодаҳоро бо аломатҳои <, >, ≤, ≥ муқоиса мекунад. Онро қариб мисли муодила ҳал мекунанд, аммо ҳангоми зарб ё тақсим ба адади манфӣ аломати нобаробарӣ баръакс мешавад.\nМисол: −2x < 6 → x > −3. Ҷавобро бо фосила менависанд: (−3; +∞). Барои нобаробарии квадратӣ решаҳоро ёфта, аломати ифодаро дар меҳвари ададӣ мебинанд.", "An inequality compares expressions with the signs <, >, ≤, ≥. It is solved almost like an equation, but when you multiply or divide by a negative number the sign of the inequality flips.\nExample: −2x < 6 → x > −3. The answer is written as an interval: (−3; +∞). For quadratic inequalities, find the roots and check the sign of the expression on the number line."], ["Арифметическая прогрессия: каждый член больше предыдущего на разность d. aₙ = a₁ + (n − 1)d, сумма Sₙ = (a₁ + aₙ)·n / 2.\nГеометрическая прогрессия: каждый член умножается на знаменатель q. bₙ = b₁·qⁿ⁻¹, сумма Sₙ = b₁(qⁿ − 1) / (q − 1). Пример: 2, 4, 8, 16 — геометрическая прогрессия с q = 2.", "Прогрессияи арифметикӣ: ҳар аъзо аз аъзои пешина ба фарқи d калон аст. aₙ = a₁ + (n − 1)d, сумма Sₙ = (a₁ + aₙ)·n / 2.\nПрогрессияи геометрӣ: ҳар аъзо ба махраҷи q зарб мешавад. bₙ = b₁·qⁿ⁻¹, сумма Sₙ = b₁(qⁿ − 1) / (q − 1). Мисол: 2, 4, 8, 16 — прогрессияи геометрӣ бо q = 2.", "In an arithmetic sequence each term is greater than the previous one by a common difference d. aₙ = a₁ + (n − 1)d, and the sum is Sₙ = (a₁ + aₙ)·n / 2.\nIn a geometric sequence each term is multiplied by a ratio q. bₙ = b₁·qⁿ⁻¹, and the sum is Sₙ = b₁(qⁿ − 1) / (q − 1). Example: 2, 4, 8, 16 is geometric with q = 2."]], "geo": [["Сумма углов треугольника равна 180°. Виды: остроугольный, прямоугольный, тупоугольный; а по сторонам — равносторонний, равнобедренный, разносторонний. Площадь S = ½·a·h.\nВ прямоугольном треугольнике работает теорема Пифагора: c² = a² + b². Пример: катеты 3 и 4 дают гипотенузу 5. Треугольники подобны, если их углы равны, тогда стороны пропорциональны.", "Суммаи кунҷҳои секунҷа ба 180° баробар аст. Намудҳо: тезкунҷа, росткунҷа, кундкунҷа; аз рӯи паҳлӯҳо — баробарпаҳлӯ, баробарпоя, гуногунпаҳлӯ. Масоҳат S = ½·a·h.\nДар секунҷаи росткунҷа теоремаи Пифагор амал мекунад: c² = a² + b². Мисол: катетҳои 3 ва 4 гипотенузаи 5-ро медиҳанд. Секунҷаҳо монанданд, агар кунҷҳояшон баробар бошанд, он гоҳ паҳлӯҳо мутаносибанд.", "The angles of a triangle add up to 180°. Types: acute, right, obtuse; and by sides — equilateral, isosceles, scalene. The area is S = ½·a·h.\nIn a right triangle the Pythagorean theorem holds: c² = a² + b². Example: legs 3 and 4 give a hypotenuse of 5. Triangles are similar if their angles are equal, and then their sides are proportional."], ["Окружность — все точки на одинаковом расстоянии r (радиус) от центра. Диаметр d = 2r, длина окружности C = 2πr, площадь круга S = πr².\nХорда соединяет две точки окружности, а касательная перпендикулярна радиусу в точке касания. Вписанный угол равен половине центрального угла, опирающегося на ту же дугу.", "Давра — ҳамаи нуқтаҳое, ки аз марказ дар масофаи якхелаи r (радиус) ҷойгиранд. Диаметр d = 2r, дарозии давра C = 2πr, масоҳати доира S = πr².\nВатар ду нуқтаи давраро мепайвандад, тамос бошад, ба радиус дар нуқтаи тамос перпендикуляр аст. Кунҷи дарунсохт ба нисфи кунҷи марказие баробар аст, ки ба ҳамон камон такя мекунад.", "A circle is all points at the same distance r (the radius) from the centre. Diameter d = 2r, circumference C = 2πr, area of the disc S = πr².\nA chord joins two points of the circle, and a tangent is perpendicular to the radius at the point of contact. An inscribed angle equals half the central angle that subtends the same arc."], ["Прямоугольник: S = ab. Параллелограмм: S = a·h. Треугольник: S = ½·a·h. Трапеция: S = (a + b) / 2 · h. Круг: S = πr².\nПлощадь измеряют в квадратных единицах (см², м²). Сложную фигуру разбивают на простые, считают их площади и складывают.", "Росткунҷа: S = ab. Параллелограмм: S = a·h. Секунҷа: S = ½·a·h. Трапесия: S = (a + b) / 2 · h. Доира: S = πr².\nМасоҳатро бо воҳидҳои мураббаъ (см², м²) мепаймоянд. Шакли мураккабро ба шаклҳои оддӣ ҷудо карда, масоҳатҳояшонро ҳисоб мекунанд ва ҷамъ мебанданд.", "Rectangle: S = ab. Parallelogram: S = a·h. Triangle: S = ½·a·h. Trapezoid: S = (a + b) / 2 · h. Circle: S = πr².\nArea is measured in square units (cm², m²). Split a complex figure into simple ones, find their areas and add them up."], ["Вектор — отрезок с направлением: у него есть длина и направление. В координатах a = (x; y), длина |a| = √(x² + y²). Векторы складывают покоординатно.\nСкалярное произведение a·b = x₁x₂ + y₁y₂ = |a|·|b|·cos φ. Если оно равно нулю, векторы перпендикулярны.", "Вектор — порчаест, ки самт дорад: дарозӣ ва самт дорад. Дар координатаҳо a = (x; y), дарозӣ |a| = √(x² + y²). Векторҳоро координатавӣ ҷамъ мекунанд.\nЗарби скалярӣ a·b = x₁x₂ + y₁y₂ = |a|·|b|·cos φ. Агар он ба сифр баробар бошад, векторҳо перпендикуляранд.", "A vector is a segment with a direction: it has a length and a direction. In coordinates a = (x; y), the length is |a| = √(x² + y²). Vectors are added coordinate by coordinate.\nThe dot product is a·b = x₁x₂ + y₁y₂ = |a|·|b|·cos φ. If it equals zero, the vectors are perpendicular."], ["Куб: V = a³. Параллелепипед: V = abc. Призма и цилиндр: V = S·h, для цилиндра V = πr²h. Пирамида и конус: V = ⅓·S·h. Шар: V = 4/3·πr³.\nОбъём измеряют в кубических единицах (см³, м³); 1 л = 1000 см³. Площадь поверхности — сумма площадей всех граней.", "Куб: V = a³. Параллелепипед: V = abc. Призма ва силиндр: V = S·h, барои силиндр V = πr²h. Пирамида ва конус: V = ⅓·S·h. Курра: V = 4/3·πr³.\nҲаҷмро бо воҳидҳои куб (см³, м³) мепаймоянд; 1 л = 1000 см³. Масоҳати сатҳ — суммаи масоҳати ҳамаи рӯяҳост.", "Cube: V = a³. Cuboid: V = abc. Prism and cylinder: V = S·h, and for a cylinder V = πr²h. Pyramid and cone: V = ⅓·S·h. Sphere: V = 4/3·πr³.\nVolume is measured in cubic units (cm³, m³); 1 L = 1000 cm³. Surface area is the sum of the areas of all faces."]], "phy": [["Механика изучает движение. Скорость v = s / t, ускорение a = Δv / t. Второй закон Ньютона: F = m·a. Сила тяжести F = m·g, где g ≈ 9,8 м/с².\nИмпульс p = m·v сохраняется при взаимодействии тел. Работа A = F·s, мощность P = A / t, кинетическая энергия E = mv² / 2.", "Механика ҳаракатро меомӯзад. Суръат v = s / t, шитоб a = Δv / t. Қонуни дуюми Нютон: F = m·a. Қувваи вазнинӣ F = m·g, ки дар он g ≈ 9,8 м/с².\nИмпулс p = m·v ҳангоми таъсири мутақобилаи ҷисмҳо нигоҳ дошта мешавад. Кор A = F·s, иқтидор P = A / t, энергияи кинетикӣ E = mv² / 2.", "Mechanics studies motion. Speed v = s / t, acceleration a = Δv / t. Newton’s second law: F = m·a. The force of gravity is F = m·g, where g ≈ 9.8 m/s².\nMomentum p = m·v is conserved when bodies interact. Work A = F·s, power P = A / t, kinetic energy E = mv² / 2."], ["Температура показывает среднюю энергию движения частиц. Количество теплоты Q = c·m·Δt, где c — удельная теплоёмкость. Плавление, кипение и испарение требуют энергии.\nТепло передаётся тремя способами: теплопроводностью, конвекцией и излучением. Энергия не исчезает, а переходит из одного вида в другой — это закон сохранения энергии.", "Ҳарорат энергияи миёнаи ҳаракати зарраҳоро нишон медиҳад. Миқдори гармӣ Q = c·m·Δt, ки дар он c — гармигунҷоиши хос. Гудозиш, ҷӯшиш ва бухоршавӣ энергия талаб мекунанд.\nГармӣ бо се роҳ интиқол меёбад: гармигузаронӣ, конвексия ва шуоъафканӣ. Энергия гум намешавад, балки аз як намуд ба намуди дигар мегузарад — ин қонуни бақои энергия аст.", "Temperature shows the average energy of particle motion. The amount of heat is Q = c·m·Δt, where c is specific heat capacity. Melting, boiling and evaporation need energy.\nHeat travels in three ways: conduction, convection and radiation. Energy is not lost but changes from one form to another — this is the law of conservation of energy."], ["Закон Ома: I = U / R (ток равен напряжению, делённому на сопротивление). Мощность P = U·I, работа тока A = U·I·t.\nПри последовательном соединении R = R₁ + R₂, при параллельном 1/R = 1/R₁ + 1/R₂. Соблюдайте безопасность: не трогайте оголённые провода и не включайте приборы мокрыми руками.", "Қонуни Ом: I = U / R (ҷараён ба шиддат тақсим бар муқовимат баробар аст). Иқтидор P = U·I, кори ҷараён A = U·I·t.\nДар пайвасти пайдарпай R = R₁ + R₂, дар пайвасти мувозӣ 1/R = 1/R₁ + 1/R₂. Бехатариро риоя кунед: ба симҳои луч даст нарасонед ва асбобҳоро бо дасти тар ба барқ напайвандед.", "Ohm’s law: I = U / R (current equals voltage divided by resistance). Power P = U·I, work of current A = U·I·t.\nIn series R = R₁ + R₂, in parallel 1/R = 1/R₁ + 1/R₂. Stay safe: never touch bare wires and never plug in devices with wet hands."], ["Колебание — повторяющееся движение, например качание маятника. Период T — время одного колебания, частота ν = 1 / T измеряется в герцах. Длина волны λ = v·T, скорость волны v = λ·ν.\nЗвук — продольная волна, которой нужна среда (воздух, вода). Свет — электромагнитная волна и может распространяться в пустоте.", "Ларзиш — ҳаракати такроршаванда, масалан ҷунбиши маятник. Давр T — вақти як ларзиш, басомад ν = 1 / T бо герс чен карда мешавад. Дарозии мавҷ λ = v·T, суръати мавҷ v = λ·ν.\nСадо — мавҷи тулӣ аст, ки муҳит (ҳаво, об) талаб мекунад. Рӯшноӣ мавҷи электромагнитӣ аст ва дар холигоҳ низ паҳн мешавад.", "An oscillation is a repeating motion, such as the swing of a pendulum. The period T is the time of one oscillation, and the frequency ν = 1 / T is measured in hertz. Wavelength λ = v·T, wave speed v = λ·ν.\nSound is a longitudinal wave that needs a medium (air, water). Light is an electromagnetic wave and can travel through a vacuum."], ["Свет в однородной среде идёт по прямой. Закон отражения: угол падения равен углу отражения. При переходе в другую среду луч преломляется.\nСобирающая линза даёт изображение по формуле 1/F = 1/d + 1/f, оптическая сила D = 1/F измеряется в диоптриях. Белый свет раскладывается в спектр — радугу.", "Рӯшноӣ дар муҳити яксон ба хати рост меравад. Қонуни инъикос: кунҷи афтиш ба кунҷи инъикос баробар аст. Ҳангоми гузариш ба муҳити дигар шуоъ шикаста мешавад.\nЛинзаи ҷамъкунанда тасвирро бо формулаи 1/F = 1/d + 1/f медиҳад, қувваи оптикӣ D = 1/F бо диоптрия чен карда мешавад. Рӯшноии сафед ба спектр — рангинкамон ҷудо мешавад.", "Light travels in a straight line in a uniform medium. Law of reflection: the angle of incidence equals the angle of reflection. When a ray enters another medium, it refracts.\nA converging lens forms an image by 1/F = 1/d + 1/f, and optical power D = 1/F is measured in dioptres. White light splits into a spectrum — a rainbow."]], "che": [["Атом состоит из ядра (протоны и нейтроны) и электронов вокруг него. Номер элемента в периодической таблице равен числу протонов. Атомы одного элемента с разным числом нейтронов называют изотопами.\nВ таблице Менделеева элементы расположены по возрастанию заряда ядра: в периоде свойства меняются от металлов к неметаллам, а в группе — схожи.", "Атом аз ядро (протонҳо ва нейтронҳо) ва электронҳои гирди он иборат аст. Рақами унсур дар ҷадвали даврӣ ба шумораи протонҳо баробар аст. Атомҳои як унсур бо шумораи гуногуни нейтронҳо изотоп номида мешаванд.\nДар ҷадвали Менделеев унсурҳо аз рӯи афзоиши заряди ядро ҷойгиранд: дар давр хосиятҳо аз металлҳо ба ғайриметаллҳо тағйир меёбанд, дар гурӯҳ — монанданд.", "An atom consists of a nucleus (protons and neutrons) and electrons around it. The atomic number in the periodic table equals the number of protons. Atoms of one element with different numbers of neutrons are called isotopes.\nIn the periodic table elements are arranged by increasing nuclear charge: across a period properties change from metals to non-metals, while down a group they are similar."], ["Атомы соединяются, чтобы получить устойчивую оболочку из электронов. Ионная связь — переход электрона от металла к неметаллу (NaCl). Ковалентная — общие электронные пары (H₂O, CO₂). Металлическая — свободные электроны в металлах.\nТип связи определяет свойства вещества: температуру плавления, растворимость, электропроводность.", "Атомҳо мепайванданд, то қабати устувори электронӣ ба даст оранд. Пайванди ионӣ — гузариши электрон аз металл ба ғайриметалл (NaCl). Ковалентӣ — ҷуфтҳои умумии электронӣ (H₂O, CO₂). Металлӣ — электронҳои озод дар металлҳо.\nНамуди пайванд хосиятҳои моддаро муайян мекунад: ҳарорати гудозиш, ҳалшавандагӣ, барқгузаронӣ.", "Atoms join to obtain a stable shell of electrons. An ionic bond is the transfer of an electron from a metal to a non-metal (NaCl). A covalent bond shares electron pairs (H₂O, CO₂). A metallic bond uses free electrons in metals.\nThe type of bond determines a substance’s properties: melting point, solubility, electrical conductivity."], ["В химической реакции одни вещества превращаются в другие. Уравнение нужно уравнять: число атомов каждого элемента до и после реакции одинаково. Пример: 2H₂ + O₂ → 2H₂O.\nТипы реакций: соединение, разложение, замещение, обмен. Масса веществ сохраняется — это закон сохранения массы. Признаки реакции: выделение газа, осадок, изменение цвета, тепло.", "Дар реаксияи химиявӣ як моддаҳо ба моддаҳои дигар табдил меёбанд. Муодиларо бояд баробар кард: шумораи атомҳои ҳар унсур пеш аз реаксия ва баъд аз он якхела аст. Мисол: 2H₂ + O₂ → 2H₂O.\nНамудҳои реаксия: пайвастшавӣ, таҷзия, ҷойивазкунӣ, мубодила. Массаи моддаҳо нигоҳ дошта мешавад — ин қонуни бақои масса аст. Нишонаҳои реаксия: ҷудошавии газ, таҳшин, тағйири ранг, гармӣ.", "In a chemical reaction some substances turn into others. The equation must be balanced: the number of atoms of each element is the same before and after. Example: 2H₂ + O₂ → 2H₂O.\nTypes of reactions: combination, decomposition, substitution, exchange. Mass is conserved — the law of conservation of mass. Signs of a reaction: gas, precipitate, colour change, heat."], ["Раствор — однородная смесь растворителя и растворённого вещества. Массовая доля ω = m(вещества) / m(раствора) · 100%. Пример: 20 г соли в 180 г воды дают 200 г раствора, ω = 10%.\nКислоты, щёлочи и соли в воде распадаются на ионы. Кислотность измеряют показателем pH: меньше 7 — кислая среда, 7 — нейтральная, больше 7 — щелочная.", "Маҳлул — омехтаи яксони ҳалкунанда ва моддаи ҳалшуда. Ҳиссаи массавӣ ω = m(модда) / m(маҳлул) · 100%. Мисол: 20 г намак дар 180 г об 200 г маҳлул медиҳад, ω = 10%.\nКислотаҳо, шилтаҳо ва намакҳо дар об ба ионҳо ҷудо мешаванд. Кислотагиро бо нишондиҳандаи pH мепаймоянд: аз 7 кам — муҳити туруш, 7 — бетараф, аз 7 зиёд — шилтагӣ.", "A solution is a uniform mixture of a solvent and a dissolved substance. Mass fraction ω = m(substance) / m(solution) · 100%. Example: 20 g of salt in 180 g of water makes 200 g of solution, ω = 10%.\nAcids, alkalis and salts break into ions in water. Acidity is measured by pH: below 7 is acidic, 7 is neutral, above 7 is alkaline."], ["Органическая химия изучает соединения углерода. Углерод образует цепи и кольца, поэтому таких веществ очень много. Простейшие из них — углеводороды: метан CH₄, этан C₂H₆.\nВажные классы: спирты, кислоты, жиры, белки, углеводы. Многие органические вещества горят, а при полном горении образуют CO₂ и воду.", "Химияи органикӣ пайвастагиҳои карбонро меомӯзад. Карбон занҷирҳо ва ҳалқаҳо месозад, бинобар ин чунин моддаҳо бисёранд. Оддитарини онҳо — карбогидрогенҳо: метан CH₄, этан C₂H₆.\nСинфҳои муҳим: спиртҳо, кислотаҳо, равғанҳо, сафедаҳо, карбогидратҳо. Бисёр моддаҳои органикӣ месузанд ва ҳангоми сӯзиши пурра CO₂ ва об ҳосил мекунанд.", "Organic chemistry studies carbon compounds. Carbon forms chains and rings, so there are very many such substances. The simplest are hydrocarbons: methane CH₄, ethane C₂H₆.\nImportant classes: alcohols, acids, fats, proteins, carbohydrates. Many organic substances burn, and complete combustion gives CO₂ and water."]], "bio": [["Клетка — основная единица жизни. Бактерии — клетки без ядра, а у растений, животных и грибов ядро есть. Ядро хранит ДНК, митохондрии дают энергию, рибосомы строят белки, мембрана отделяет клетку от среды.\nУ растений есть клеточная стенка и хлоропласты для фотосинтеза: на свету углекислый газ и вода превращаются в глюкозу и кислород. Клетки делятся — так организм растёт.", "Ҳуҷайра — воҳиди асосии ҳаёт. Бактерияҳо ҳуҷайраҳои бе ядро ҳастанд, дар растаниҳо, ҳайвонот ва занбӯруғҳо ядро ҳаст. Ядро ДНК-ро нигоҳ медорад, митохондрияҳо энергия медиҳанд, рибосомаҳо сафедаҳо месозанд, мембрана ҳуҷайраро аз муҳит ҷудо мекунад.\nРастаниҳо девори ҳуҷайравӣ ва хлоропластҳо барои фотосинтез доранд: дар рӯшноӣ гази карбон ва об ба глюкоза ва оксиген табдил меёбанд. Ҳуҷайраҳо тақсим мешаванд — ҷисм ҳамин тавр калон мешавад.", "The cell is the basic unit of life. Bacteria are cells without a nucleus, while plants, animals and fungi have one. The nucleus stores DNA, mitochondria supply energy, ribosomes build proteins, and the membrane separates the cell from its surroundings.\nPlants also have a cell wall and chloroplasts for photosynthesis: in light, carbon dioxide and water become glucose and oxygen. Cells divide, and that is how an organism grows."], ["Гены записаны в ДНК и определяют признаки. Каждый ребёнок получает набор хромосом от обоих родителей. Аллели бывают доминантными (A) и рецессивными (a).\nЗаконы Менделя: при скрещивании Aa × Aa получается 25% AA, 50% Aa и 25% aa; рецессивный признак проявляется только у aa. Мутации — случайные изменения ДНК.", "Генҳо дар ДНК сабт шудаанд ва аломатҳоро муайян мекунанд. Ҳар кӯдак маҷмӯи хромосомаҳоро аз ҳарду падару модар мегирад. Аллелҳо доминантӣ (A) ва ресессивӣ (a) мешаванд.\nҚонунҳои Мендел: ҳангоми чатишдиҳии Aa × Aa 25% AA, 50% Aa ва 25% aa ҳосил мешавад; аломати ресессивӣ танҳо дар aa падид меояд. Мутатсияҳо — тағйироти тасодуфии ДНК.", "Genes are written in DNA and determine traits. Each child gets a set of chromosomes from both parents. Alleles can be dominant (A) or recessive (a).\nMendel’s laws: crossing Aa × Aa gives 25% AA, 50% Aa and 25% aa; a recessive trait shows only in aa. Mutations are random changes in DNA."], ["Организм человека состоит из систем органов: пищеварительной, дыхательной, кровеносной, нервной, опорно-двигательной и других. Сердце гонит кровь по сосудам, лёгкие обмениваются газами с воздухом.\nЗдоровье поддерживают сон, движение, разнообразное питание и гигиена. Иммунная система защищает от инфекций, а прививки её тренируют.", "Ҷисми инсон аз системаҳои узвҳо иборат аст: ҳозима, нафас, гардиши хун, асаб, ҳаракат ва дигарҳо. Дил хунро тавассути рагҳо меронад, шуш бо ҳаво газ мубодила мекунад.\nСаломатиро хоб, ҳаракат, ғизои гуногун ва тозагӣ нигоҳ медоранд. Системаи масуният аз сироятҳо ҳимоя мекунад ва ваксинаҳо онро омӯзонида мешавад.", "The human body consists of organ systems: digestive, respiratory, circulatory, nervous, musculoskeletal and others. The heart pumps blood through vessels and the lungs exchange gases with the air.\nHealth is supported by sleep, movement, varied food and hygiene. The immune system protects against infections, and vaccines train it."], ["Эволюция — длительное изменение видов. Чарльз Дарвин объяснил её естественным отбором: особи с полезными признаками чаще выживают и оставляют потомство. Материал для отбора даёт изменчивость.\nДоказательства эволюции: ископаемые остатки, сходство строения (крыло птицы и рука человека), родство ДНК. Новые виды возникают, когда популяции долго живут в разных условиях.", "Эволютсия — тағйирёбии дарозмуддати намудҳо. Чарлз Дарвин онро бо интихоби табиӣ шарҳ дод: ҷонварони дорои аломатҳои муфид бештар зинда мемонанд ва насл мегузоранд. Масолеҳи интихобро тағйирпазирӣ медиҳад.\nИсботҳои эволютсия: боқимондаҳои истихроҷӣ, шабоҳати сохт (болҳои парранда ва дасти инсон), хешии ДНК. Намудҳои нав вақте пайдо мешаванд, ки популятсияҳо муддати дароз дар шароити гуногун зиндагӣ кунанд.", "Evolution is the long-term change of species. Charles Darwin explained it by natural selection: individuals with useful traits survive more often and leave offspring. Variation provides the material for selection.\nEvidence for evolution: fossils, similar structure (a bird’s wing and a human arm), and DNA kinship. New species appear when populations live for a long time in different conditions."], ["Экология изучает связи организмов со средой. Цепь питания: продуценты (растения) → консументы (травоядные, хищники) → редуценты (грибы, бактерии). Энергия по цепи теряется, поэтому хищников мало.\nЧеловек влияет на природу: загрязнение, вырубка лесов, изменение климата. Помогают экономия ресурсов, сортировка и переработка отходов, охрана природы.", "Экология алоқаи организмҳоро бо муҳит меомӯзад. Занҷири ғизо: продуссентҳо (растаниҳо) → консументҳо (алафхӯрон, даррандаҳо) → редуссентҳо (занбӯруғҳо, бактерияҳо). Энергия дар занҷир кам мешавад, бинобар ин даррандаҳо кам ҳастанд.\nИнсон ба табиат таъсир мекунад: ифлосшавӣ, буридани ҷангалҳо, тағйирёбии иқлим. Сарфаи захираҳо, ҷудо кардан ва коркарди партовҳо, ҳифзи табиат кӯмак мекунанд.", "Ecology studies how organisms relate to their environment. A food chain: producers (plants) → consumers (herbivores, predators) → decomposers (fungi, bacteria). Energy is lost along the chain, so predators are few.\nPeople affect nature: pollution, deforestation, climate change. Saving resources, sorting and recycling waste, and protecting nature all help."]]};
var TPT={ru:{open:'Читать',close:'Закрыть',prev:'← Назад',next:'Далее →',solve:'Решать задачи'},tg:{open:'Хондан',close:'Пӯшидан',prev:'← Қафо',next:'Пеш →',solve:'Ҳал кардани масъалаҳо'},en:{open:'Read',close:'Close',prev:'← Previous',next:'Next →',solve:'Solve problems'}};
function TP(){return TPT[lang]||TPT.ru}
function topicCount(id){return id==='inf'?INF_PARTS.length:subj(id).topics.ru.length}
function topicTitle(id,i){return id==='inf'?tr(INF_PARTS[i].t):tr(subj(id).topics)[i]}
function topicText(id,i){var a=TOPIC_INFO[id]&&TOPIC_INFO[id][i];if(!a)return '';return a[lang==='tg'?1:lang==='en'?2:0]||a[0]}
function firstSentence(t){var p=String(t).split('\n')[0],m=p.match(/^[^.!?]*[.!?]/),r=m?m[0]:p;return r.length>130?r.slice(0,127)+'…':r}
function closeTopic(){var o=document.getElementById('tpv');if(o){o.remove();document.body.style.overflow='';}}
function openTopic(id,i){
  closeTopic();var sb=subj(id),n=topicCount(id);i=Math.max(0,Math.min(n-1,i));
  var o=document.createElement('div');o.className='tpv';o.id='tpv';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  var paras=topicText(id,i).split('\n').map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
  o.innerHTML='<div class="tpd" style="--c:'+col(sb.c)+'"><div class="tph"><span class="tpc">'+esc(sb.code)+' · '+esc(tr(sb.name))+' · '+(i+1)+'/'+n+'</span><button type="button" class="tpx" data-tpclose aria-label="'+esc(TP().close)+'">✕</button></div><h2>'+esc(topicTitle(id,i))+'</h2><div class="tpb">'+paras+'</div><div class="tpn">'+(i>0?'<button type="button" class="rdbtn" data-topic="'+id+':'+(i-1)+'">'+esc(TP().prev)+'</button>':'<span></span>')+'<button type="button" class="btn" data-goprob="'+id+'">'+esc(TP().solve)+'</button>'+(i<n-1?'<button type="button" class="rdbtn" data-topic="'+id+':'+(i+1)+'">'+esc(TP().next)+'</button>':'<span></span>')+'</div></div>';
  document.body.appendChild(o);document.body.style.overflow='hidden';
  var x=o.querySelector('.tpx');if(x)x.focus();
}
document.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target.closest('[data-topic],[data-tpclose],#tpv'):null;if(!t)return;
  if(t.hasAttribute('data-topic')){var p=t.getAttribute('data-topic').split(':');openTopic(p[0],+p[1]);return;}
  if(t.hasAttribute('data-tpclose')||(t.id==='tpv'&&e.target===t&&!t.classList.contains('pfull'))){closeTopic();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeTopic();
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('tcard')){e.preventDefault();if(e.target.hasAttribute('data-topic')){var p=e.target.getAttribute('data-topic').split(':');openTopic(p[0],+p[1]);}else if(e.target.hasAttribute('data-formula')){var q=e.target.getAttribute('data-formula').split(':');openFormula(q[0],+q[1]);}}
});

var FORMULA_INFO={"inf": [["Бит — наименьшая единица информации (0 или 1). Байт состоит из 8 бит, а большие единицы получают умножением на 1024: килобайт, мегабайт, гигабайт.\nЧтобы перейти к меньшим единицам, умножайте (байты → биты: ×8, КБ → байты: ×1024). Чтобы перейти к большим — делите.\nСколько бит в 3 КБ? 3 · 1024 = 3072 байта; 3072 · 8 = 24 576 бит.", "Бит — хурдтарин воҳиди иттилоот (0 ё 1). Байт аз 8 бит иборат аст, воҳидҳои калонтарро бо зарб ба 1024 мегиранд: килобайт, мегабайт, гигабайт.\nБарои гузариш ба воҳидҳои хурдтар зарб кунед (байт → бит: ×8, КБ → байт: ×1024). Барои гузариш ба калонтар — тақсим кунед.\n3 КБ чанд бит аст? 3 · 1024 = 3072 байт; 3072 · 8 = 24 576 бит.", "A bit is the smallest unit of information (0 or 1). A byte is 8 bits, and larger units are got by multiplying by 1024: kilobyte, megabyte, gigabyte.\nTo go to smaller units, multiply (bytes → bits: ×8, KB → bytes: ×1024). To go to larger units, divide.\nHow many bits are in 3 KB? 3 · 1024 = 3072 bytes; 3072 · 8 = 24,576 bits."], ["В двоичной записи каждая цифра — коэффициент при степени двойки. Справа налево веса равны 1, 2, 4, 8, 16 и так далее.\nЗапишите под цифрами степени двойки, умножьте каждую цифру на её вес и сложите. Обратно: делите число на 2 и записывайте остатки снизу вверх.\n1101₂ = 1·8 + 1·4 + 0·2 + 1·1 = 13. Обратно: 13 : 2 = 6 (ост. 1), 6 : 2 = 3 (ост. 0), 3 : 2 = 1 (ост. 1), 1 : 2 = 0 (ост. 1) → снизу вверх 1101.", "Дар навишти дуӣ ҳар рақам коэффисиент назди дараҷаи дуст. Аз рост ба чап вазнҳо 1, 2, 4, 8, 16 ва ғайра мебошанд.\nДар зери рақамҳо дараҷаҳои дуро нависед, ҳар рақамро ба вазнаш зарб кунед ва ҷамъ бандед. Баръакс: рақамро ба 2 тақсим карда, бақияҳоро аз поён ба боло нависед.\n1101₂ = 1·8 + 1·4 + 0·2 + 1·1 = 13. Баръакс: 13 : 2 = 6 (бақия 1), 6 : 2 = 3 (бақия 0), 3 : 2 = 1 (бақия 1), 1 : 2 = 0 (бақия 1) → аз поён ба боло 1101.", "In binary each digit is a coefficient of a power of two. From right to left the weights are 1, 2, 4, 8, 16 and so on.\nWrite the powers of two under the digits, multiply each digit by its weight and add. To go back, divide by 2 and write the remainders from bottom to top.\n1101₂ = 1·8 + 1·4 + 0·2 + 1·1 = 13. Back: 13 : 2 = 6 (r 1), 6 : 2 = 3 (r 0), 3 : 2 = 1 (r 1), 1 : 2 = 0 (r 1) → bottom to top 1101."], ["И (AND) даёт 1 только тогда, когда оба значения равны 1. ИЛИ (OR) даёт 1, если хотя бы одно значение равно 1. Иначе результат 0.\nСоставьте таблицу истинности: переберите все комбинации 0 и 1 и применяйте правило. Скобки вычисляйте первыми, затем И, потом ИЛИ.\n1 AND 0 = 0; 1 OR 0 = 1; (1 AND 1) OR 0 = 1 OR 0 = 1.", "ВА (AND) танҳо вақте 1 медиҳад, ки ҳар ду қимат 1 бошанд. ЁХУД (OR) 1 медиҳад, агар ақаллан як қимат 1 бошад. Дар ҳолати дигар натиҷа 0 аст.\nҶадвали ростиро созед: ҳамаи омезишҳои 0 ва 1-ро аз назар гузаронед ва қоидаро татбиқ кунед. Аввал қавсҳо, баъд ВА, баъд ЁХУД ҳисоб карда мешавад.\n1 AND 0 = 0; 1 OR 0 = 1; (1 AND 1) OR 0 = 1 OR 0 = 1.", "AND gives 1 only when both values are 1. OR gives 1 if at least one value is 1. Otherwise the result is 0.\nBuild a truth table: try all combinations of 0 and 1 and apply the rule. Evaluate brackets first, then AND, then OR.\n1 AND 0 = 0; 1 OR 0 = 1; (1 AND 1) OR 0 = 1 OR 0 = 1."], ["I — объём информации, K — количество символов, i — число бит на один символ.\nОпределите K и i, перемножьте их. При необходимости переведите: бит ÷ 8 = байт, байт ÷ 1024 = килобайт.\nТекст из 2048 символов, каждый по 8 бит: I = 2048 · 8 = 16 384 бит = 2048 байт = 2 КБ.", "I — ҳаҷми иттилоот, K — шумораи аломатҳо, i — шумораи битҳо барои як аломат.\nK ва i-ро муайян карда, зарб кунед. Агар лозим бошад, табдил диҳед: бит ÷ 8 = байт, байт ÷ 1024 = килобайт.\nМатни 2048 аломат, ҳар кадом 8 бит: I = 2048 · 8 = 16 384 бит = 2048 байт = 2 КБ.", "I is the data volume, K is the number of characters, i is the number of bits per character.\nFind K and i and multiply them. Convert if needed: bits ÷ 8 = bytes, bytes ÷ 1024 = kilobytes.\nA text of 2048 characters of 8 bits each: I = 2048 · 8 = 16,384 bits = 2048 bytes = 2 KB."]], "alg": [["a, b, c — коэффициенты уравнения ax² + bx + c = 0, D — дискриминант. Он показывает, сколько у уравнения корней.\n1) Выпишите a, b, c. 2) Найдите D = b² − 4ac. 3) Если D > 0, два корня; D = 0 — один; D < 0 — корней нет. 4) Подставьте в формулу x = (−b ± √D) / 2a.\n2x² − 3x − 2 = 0: a = 2, b = −3, c = −2. D = 9 + 16 = 25, √D = 5. x₁ = (3 + 5) / 4 = 2, x₂ = (3 − 5) / 4 = −0,5.", "a, b, c — коэффисиентҳои муодилаи ax² + bx + c = 0, D — дискриминант. Он нишон медиҳад, ки муодила чанд реша дорад.\n1) a, b, c-ро нависед. 2) D = b² − 4ac-ро ёбед. 3) Агар D > 0 бошад, ду реша; D = 0 — як реша; D < 0 — реша нест. 4) Ба формулаи x = (−b ± √D) / 2a гузоред.\n2x² − 3x − 2 = 0: a = 2, b = −3, c = −2. D = 9 + 16 = 25, √D = 5. x₁ = (3 + 5) / 4 = 2, x₂ = (3 − 5) / 4 = −0,5.", "a, b, c are the coefficients of ax² + bx + c = 0, and D is the discriminant. It tells how many roots the equation has.\n1) Write down a, b, c. 2) Find D = b² − 4ac. 3) If D > 0 there are two roots; D = 0 one; D < 0 none. 4) Substitute into x = (−b ± √D) / 2a.\n2x² − 3x − 2 = 0: a = 2, b = −3, c = −2. D = 9 + 16 = 25, √D = 5. x₁ = (3 + 5) / 4 = 2, x₂ = (3 − 5) / 4 = −0.5."], ["Разность квадратов двух выражений равна произведению их разности и суммы. Формула помогает раскладывать на множители и считать устно.\nНайдите в выражении два квадрата (4, 9, 16, 25, x², y²…), определите a и b, подставьте в (a − b)(a + b).\nx² − 49 = x² − 7² = (x − 7)(x + 7). Устно: 51² − 49² = (51 − 49)(51 + 49) = 2 · 100 = 200.", "Фарқи квадратҳои ду ифода ба ҳосили зарби фарқ ва суммаи онҳо баробар аст. Формула ба зарбшавандаҳо ҷудо кардан ва ҳисоби шифоҳӣ кӯмак мекунад.\nДар ифода ду квадрат ёбед (4, 9, 16, 25, x², y²…), a ва b-ро муайян карда, ба (a − b)(a + b) гузоред.\nx² − 49 = x² − 7² = (x − 7)(x + 7). Шифоҳӣ: 51² − 49² = (51 − 49)(51 + 49) = 2 · 100 = 200.", "The difference of squares of two expressions equals the product of their difference and sum. It helps to factorise and to calculate in your head.\nFind two squares in the expression (4, 9, 16, 25, x², y²…), identify a and b, and substitute into (a − b)(a + b).\nx² − 49 = x² − 7² = (x − 7)(x + 7). Mentally: 51² − 49² = (51 − 49)(51 + 49) = 2 · 100 = 200."], ["aₙ — n-й член прогрессии, a₁ — первый член, d — разность (на сколько растёт каждый следующий), n — номер члена.\nНайдите d = a₂ − a₁, затем подставьте a₁, d и n в формулу. Сумма первых n членов: Sₙ = (a₁ + aₙ) · n / 2.\nПоследовательность 3, 7, 11, … : d = 4. a₁₀ = 3 + 9 · 4 = 39. Сумма десяти членов: S₁₀ = (3 + 39) · 10 / 2 = 210.", "aₙ — аъзои n-уми прогрессия, a₁ — аъзои аввал, d — фарқ (ҳар аъзои навбатӣ чӣ қадар меафзояд), n — рақами аъзо.\nd = a₂ − a₁-ро ёбед, баъд a₁, d ва n-ро ба формула гузоред. Суммаи n аъзои аввал: Sₙ = (a₁ + aₙ) · n / 2.\nПайдарпайии 3, 7, 11, … : d = 4. a₁₀ = 3 + 9 · 4 = 39. Суммаи даҳ аъзо: S₁₀ = (3 + 39) · 10 / 2 = 210.", "aₙ is the n-th term, a₁ the first term, d the common difference (how much each next term grows), n the position.\nFind d = a₂ − a₁, then put a₁, d and n into the formula. The sum of the first n terms is Sₙ = (a₁ + aₙ) · n / 2.\nSequence 3, 7, 11, … : d = 4. a₁₀ = 3 + 9 · 4 = 39. Sum of ten terms: S₁₀ = (3 + 39) · 10 / 2 = 210."], ["Для уравнения ax² + bx + c = 0 сумма корней равна −b/a, а их произведение равно c/a. Так можно подобрать корни без дискриминанта.\nЕсли a = 1, подберите два числа, у которых нужная сумма и нужное произведение. Затем сделайте проверку подстановкой.\nx² − 7x + 12 = 0: сумма 7, произведение 12 → корни 3 и 4. Проверка: 3² − 7·3 + 12 = 9 − 21 + 12 = 0.", "Барои муодилаи ax² + bx + c = 0 суммаи решаҳо ба −b/a ва ҳосили зарбашон ба c/a баробар аст. Ҳамин тавр решаҳоро бе дискриминант ёфтан мумкин аст.\nАгар a = 1 бошад, ду ададеро ёбед, ки суммаи лозимӣ ва ҳосили зарби лозимӣ доранд. Баъд бо гузоштан санҷед.\nx² − 7x + 12 = 0: сумма 7, ҳосили зарб 12 → решаҳо 3 ва 4. Санҷиш: 3² − 7·3 + 12 = 9 − 21 + 12 = 0.", "For ax² + bx + c = 0 the sum of the roots is −b/a and their product is c/a. This lets you guess the roots without the discriminant.\nIf a = 1, find two numbers with the required sum and product. Then check by substitution.\nx² − 7x + 12 = 0: sum 7, product 12 → roots 3 and 4. Check: 3² − 7·3 + 12 = 9 − 21 + 12 = 0."]], "geo": [["В прямоугольном треугольнике квадрат гипотенузы c (стороны против прямого угла) равен сумме квадратов катетов a и b.\nОпределите, какая сторона гипотенуза. Подставьте известные стороны в a² + b² = c², найдите неизвестный квадрат и извлеките корень.\nКатеты 6 и 8: c² = 36 + 64 = 100, c = 10. Если c = 13, a = 5: b² = 169 − 25 = 144, b = 12.", "Дар секунҷаи росткунҷа квадрати гипотенуза c (паҳлӯи муқобили кунҷи рост) ба суммаи квадратҳои катетҳои a ва b баробар аст.\nМуайян кунед, ки кадом паҳлӯ гипотенуза аст. Паҳлӯҳои маълумро ба a² + b² = c² гузоред, квадрати номаълумро ёфта, реша гиред.\nКатетҳо 6 ва 8: c² = 36 + 64 = 100, c = 10. Агар c = 13, a = 5 бошад: b² = 169 − 25 = 144, b = 12.", "In a right triangle the square of the hypotenuse c (the side opposite the right angle) equals the sum of the squares of the legs a and b.\nDecide which side is the hypotenuse. Substitute the known sides into a² + b² = c², find the unknown square and take the square root.\nLegs 6 and 8: c² = 36 + 64 = 100, c = 10. If c = 13 and a = 5: b² = 169 − 25 = 144, b = 12."], ["r — радиус круга, π ≈ 3,14. S — площадь круга, C — длина окружности.\nЕсли дан диаметр, разделите его на 2 и получите радиус. Затем подставьте r в нужную формулу.\nr = 5 см: S = 3,14 · 25 = 78,5 см²; C = 2 · 3,14 · 5 = 31,4 см. Если диаметр 10 см, то r = 5 см — те же ответы.", "r — радиуси доира, π ≈ 3,14. S — масоҳати доира, C — дарозии давра.\nАгар диаметр дода шуда бошад, онро ба 2 тақсим карда, радиусро гиред. Баъд r-ро ба формулаи лозимӣ гузоред.\nr = 5 см: S = 3,14 · 25 = 78,5 см²; C = 2 · 3,14 · 5 = 31,4 см. Агар диаметр 10 см бошад, r = 5 см — ҷавобҳо ҳамон.", "r is the radius, π ≈ 3.14. S is the area of the circle and C is the circumference.\nIf the diameter is given, divide it by 2 to get the radius. Then substitute r into the formula you need.\nr = 5 cm: S = 3.14 · 25 = 78.5 cm²; C = 2 · 3.14 · 5 = 31.4 cm. If the diameter is 10 cm, then r = 5 cm — same answers."], ["a — сторона (основание) треугольника, h — высота, проведённая к этой стороне перпендикулярно. Площадь равна половине произведения основания на высоту.\nНайдите основание и высоту к нему, перемножьте и разделите на 2. Высота — это перпендикуляр, а не боковая сторона.\na = 10, h = 6: S = ½ · 10 · 6 = 30. Если S = 24 и a = 8, то h = 2S / a = 48 / 8 = 6.", "a — паҳлӯи (асоси) секунҷа, h — баландие, ки ба ин паҳлӯ перпендикуляр кашида шудааст. Масоҳат ба нисфи ҳосили зарби асос ва баландӣ баробар аст.\nАсос ва баландии ба он тааллуқдоштаро ёфта, зарб кунед ва ба 2 тақсим кунед. Баландӣ перпендикуляр аст, на паҳлӯи моил.\na = 10, h = 6: S = ½ · 10 · 6 = 30. Агар S = 24 ва a = 8 бошад, h = 2S / a = 48 / 8 = 6.", "a is a side (the base) of the triangle and h is the height drawn to that side at a right angle. The area is half of base times height.\nFind the base and the height to it, multiply and divide by 2. The height is the perpendicular, not a slanted side.\na = 10, h = 6: S = ½ · 10 · 6 = 30. If S = 24 and a = 8, then h = 2S / a = 48 / 8 = 6."], ["n — число сторон многоугольника. Формула даёт сумму всех его внутренних углов.\nПодставьте n, вычтите 2 и умножьте на 180°. Если многоугольник правильный, разделите сумму на n и получите один угол.\nШестиугольник, n = 6: (6 − 2) · 180° = 720°. У правильного шестиугольника каждый угол 720° / 6 = 120°.", "n — шумораи паҳлӯҳои бисёркунҷа. Формула суммаи ҳамаи кунҷҳои дохилии онро медиҳад.\nn-ро гузошта, 2-ро кам кунед ва ба 180° зарб намоед. Агар бисёркунҷа мунтазам бошад, суммаро ба n тақсим кунед ва як кунҷро гиред.\nШашкунҷа, n = 6: (6 − 2) · 180° = 720°. Дар шашкунҷаи мунтазам ҳар кунҷ 720° / 6 = 120°.", "n is the number of sides of the polygon. The formula gives the sum of all its interior angles.\nSubstitute n, subtract 2 and multiply by 180°. If the polygon is regular, divide the sum by n to get one angle.\nHexagon, n = 6: (6 − 2) · 180° = 720°. In a regular hexagon each angle is 720° / 6 = 120°."]], "phy": [["v — скорость, s — пройденный путь, t — время. Из формулы получаются ещё две: s = v · t и t = s / v.\nПриведите все величины к одним единицам (км/ч в м/с: разделите на 3,6), затем подставьте. Выразите нужную величину.\nМашина проехала 150 км за 3 ч: v = 150 / 3 = 50 км/ч ≈ 13,9 м/с. Сколько она проедет за 2 ч? s = 50 · 2 = 100 км.", "v — суръат, s — масофаи тайкардашуда, t — вақт. Аз формула боз ду формула ҳосил мешавад: s = v · t ва t = s / v.\nҲамаи миқдорҳоро ба як воҳид оред (км/соат ба м/с: ба 3,6 тақсим кунед), баъд гузоред. Миқдори лозимиро ифода кунед.\nМошин 150 км-ро дар 3 соат тай кард: v = 150 / 3 = 50 км/соат ≈ 13,9 м/с. Дар 2 соат чанд км мегузарад? s = 50 · 2 = 100 км.", "v is speed, s is distance travelled, t is time. Two more formulas follow: s = v · t and t = s / v.\nConvert everything to the same units (km/h to m/s: divide by 3.6), then substitute. Rearrange to get the quantity you need.\nA car drove 150 km in 3 h: v = 150 / 3 = 50 km/h ≈ 13.9 m/s. How far in 2 h? s = 50 · 2 = 100 km."], ["F — равнодействующая сила (в ньютонах), m — масса (в килограммах), a — ускорение (в м/с²). Чем больше сила, тем больше ускорение; чем больше масса, тем оно меньше.\nВыразите неизвестное: a = F / m, m = F / a. Проверьте, что масса в килограммах, а не в граммах.\nF = 20 Н, m = 4 кг: a = 20 / 4 = 5 м/с². Какая сила нужна, чтобы разогнать 3 кг с ускорением 2 м/с²? F = 3 · 2 = 6 Н.", "F — қувваи баробарта'сир (бо ньютон), m — масса (бо килограмм), a — шитоб (бо м/с²). Қувва чӣ қадар зиёд бошад, шитоб ҳамон қадар зиёд; масса чӣ қадар зиёд бошад, шитоб ҳамон қадар кам.\nМиқдори номаълумро ифода кунед: a = F / m, m = F / a. Санҷед, ки масса бо килограмм бошад, на бо грамм.\nF = 20 Н, m = 4 кг: a = 20 / 4 = 5 м/с². Барои 3 кг-ро бо шитоби 2 м/с² тез кардан кадом қувва лозим аст? F = 3 · 2 = 6 Н.", "F is the net force (in newtons), m is mass (in kilograms), a is acceleration (in m/s²). The larger the force, the larger the acceleration; the larger the mass, the smaller it is.\nRearrange for the unknown: a = F / m, m = F / a. Make sure mass is in kilograms, not grams.\nF = 20 N, m = 4 kg: a = 20 / 4 = 5 m/s². What force accelerates 3 kg at 2 m/s²? F = 3 · 2 = 6 N."], ["E — кинетическая энергия (в джоулях), m — масса (в килограммах), v — скорость (в м/с). Энергия растёт пропорционально квадрату скорости.\nСначала возведите скорость в квадрат, затем умножьте на массу и разделите на 2.\nm = 2 кг, v = 3 м/с: E = 2 · 9 / 2 = 9 Дж. Если скорость удвоить до 6 м/с, E = 2 · 36 / 2 = 36 Дж — в 4 раза больше.", "E — энергияи кинетикӣ (бо ҷоул), m — масса (бо килограмм), v — суръат (бо м/с). Энергия мутаносиби квадрати суръат меафзояд.\nАввал суръатро ба квадрат бардоред, баъд ба масса зарб кунед ва ба 2 тақсим кунед.\nm = 2 кг, v = 3 м/с: E = 2 · 9 / 2 = 9 Ҷ. Агар суръатро ду баробар карда ба 6 м/с расонем, E = 2 · 36 / 2 = 36 Ҷ — 4 маротиба зиёд.", "E is kinetic energy (in joules), m is mass (in kilograms), v is speed (in m/s). Energy grows with the square of the speed.\nFirst square the speed, then multiply by the mass and divide by 2.\nm = 2 kg, v = 3 m/s: E = 2 · 9 / 2 = 9 J. If the speed doubles to 6 m/s, E = 2 · 36 / 2 = 36 J — four times larger."], ["I — сила тока (в амперах), U — напряжение (в вольтах), R — сопротивление (в омах). Чем больше сопротивление, тем меньше ток.\nВыразите нужную величину: I = U / R, U = I · R, R = U / I. Подставьте числа и проверьте единицы.\nU = 12 В, R = 4 Ом: I = 12 / 4 = 3 А. Если I = 2 А и R = 6 Ом, то U = 2 · 6 = 12 В.", "I — қувваи ҷараён (бо ампер), U — шиддат (бо волт), R — муқовимат (бо ом). Муқовимат чӣ қадар зиёд бошад, ҷараён ҳамон қадар кам.\nМиқдори лозимиро ифода кунед: I = U / R, U = I · R, R = U / I. Рақамҳоро гузошта, воҳидҳоро санҷед.\nU = 12 В, R = 4 Ом: I = 12 / 4 = 3 А. Агар I = 2 А ва R = 6 Ом бошад, U = 2 · 6 = 12 В.", "I is current (in amperes), U is voltage (in volts), R is resistance (in ohms). The greater the resistance, the smaller the current.\nRearrange for the quantity you need: I = U / R, U = I · R, R = U / I. Substitute the numbers and check the units.\nU = 12 V, R = 4 Ω: I = 12 / 4 = 3 A. If I = 2 A and R = 6 Ω, then U = 2 · 6 = 12 V."]], "che": [["n — количество вещества (в молях), m — масса (в граммах), M — молярная масса (г/моль), её считают по таблице Менделеева.\nНайдите M как сумму атомных масс всех атомов в формуле, затем подставьте: n = m / M или m = n · M.\n36 г воды H₂O: M = 2 · 1 + 16 = 18 г/моль, n = 36 / 18 = 2 моль. Масса 0,5 моль воды: m = 0,5 · 18 = 9 г.", "n — миқдори модда (бо мол), m — масса (бо грамм), M — массаи молярӣ (г/мол), онро аз ҷадвали Менделеев ҳисоб мекунанд.\nM-ро ҳамчун суммаи массаҳои атомии ҳамаи атомҳои формула ёбед, баъд гузоред: n = m / M ё m = n · M.\n36 г оби H₂O: M = 2 · 1 + 16 = 18 г/мол, n = 36 / 18 = 2 мол. Массаи 0,5 мол об: m = 0,5 · 18 = 9 г.", "n is the amount of substance (in moles), m is mass (in grams), M is molar mass (g/mol), found from the periodic table.\nFind M as the sum of the atomic masses of all atoms in the formula, then substitute: n = m / M or m = n · M.\n36 g of water H₂O: M = 2 · 1 + 16 = 18 g/mol, n = 36 / 18 = 2 mol. Mass of 0.5 mol of water: m = 0.5 · 18 = 9 g."], ["Это уравнение реакции образования воды. Числа перед формулами — коэффициенты, они показывают, в каком соотношении реагируют вещества.\nУравняйте: число атомов каждого элемента слева и справа должно быть одинаковым. Дальше считайте по коэффициентам как по пропорции.\n2 моль H₂ + 1 моль O₂ → 2 моль H₂O. Из 4 моль H₂ получится 4 моль воды, это 4 · 18 = 72 г.", "Ин муодилаи реаксияи ҳосилшавии об аст. Рақамҳои пеш аз формулаҳо — коэффисиентҳоянд, онҳо нишон медиҳанд, ки моддаҳо бо кадом таносуб реаксия мекунанд.\nБаробар кунед: шумораи атомҳои ҳар унсур дар тарафи чап ва рост якхела бошад. Баъд аз рӯи коэффисиентҳо мисли таносуб ҳисоб кунед.\n2 мол H₂ + 1 мол O₂ → 2 мол H₂O. Аз 4 мол H₂ 4 мол об ҳосил мешавад, яъне 4 · 18 = 72 г.", "This is the equation for forming water. The numbers in front of formulas are coefficients; they show the ratio in which substances react.\nBalance it: the number of atoms of each element must be the same on both sides. Then calculate by the coefficients as a proportion.\n2 mol H₂ + 1 mol O₂ → 2 mol H₂O. From 4 mol of H₂ you get 4 mol of water, that is 4 · 18 = 72 g."], ["[H⁺] — концентрация ионов водорода в растворе (моль/л). pH показывает кислотность: меньше 7 — кислая среда, 7 — нейтральная, больше 7 — щелочная.\nЕсли [H⁺] записана как 10⁻ⁿ, то pH = n. В остальных случаях найдите десятичный логарифм и смените знак.\n[H⁺] = 10⁻³ моль/л → pH = 3 (кислая среда). [H⁺] = 10⁻⁹ моль/л → pH = 9 (щелочная среда).", "[H⁺] — консентратсияи ионҳои гидроген дар маҳлул (мол/л). pH кислотагиро нишон медиҳад: аз 7 кам — муҳити туруш, 7 — бетараф, аз 7 зиёд — шилтагӣ.\nАгар [H⁺] ҳамчун 10⁻ⁿ навишта шуда бошад, pH = n. Дар ҳолатҳои дигар логарифми даҳии онро ёфта, аломатро иваз кунед.\n[H⁺] = 10⁻³ мол/л → pH = 3 (муҳити туруш). [H⁺] = 10⁻⁹ мол/л → pH = 9 (муҳити шилтагӣ).", "[H⁺] is the concentration of hydrogen ions in the solution (mol/L). pH shows acidity: below 7 is acidic, 7 is neutral, above 7 is alkaline.\nIf [H⁺] is written as 10⁻ⁿ, then pH = n. Otherwise take the decimal logarithm and change the sign.\n[H⁺] = 10⁻³ mol/L → pH = 3 (acidic). [H⁺] = 10⁻⁹ mol/L → pH = 9 (alkaline)."], ["Это реакция обмена: образуется нерастворимое вещество AgCl — белый осадок (стрелка ↓). Такие реакции используют, чтобы узнать, есть ли в растворе хлорид-ионы.\nЗапишите ионы реагентов, найдите пару, которая даёт нерастворимое вещество (по таблице растворимости), и уравняйте реакцию.\nAg⁺ + Cl⁻ → AgCl↓. Из 58,5 г NaCl (это 1 моль) получится 1 моль AgCl, то есть 143,5 г осадка.", "Ин реаксияи мубодила аст: моддаи ҳалнашавандаи AgCl — таҳшини сафед ҳосил мешавад (тир ↓). Чунин реаксияҳоро барои муайян кардани мавҷудияти ионҳои хлорид дар маҳлул истифода мебаранд.\nИонҳои реагентҳоро нависед, ҷуфтеро ёбед, ки моддаи ҳалнашаванда медиҳад (аз рӯи ҷадвали ҳалшавандагӣ) ва реаксияро баробар кунед.\nAg⁺ + Cl⁻ → AgCl↓. Аз 58,5 г NaCl (ин 1 мол) 1 мол AgCl ҳосил мешавад, яъне 143,5 г таҳшин.", "This is an exchange reaction: the insoluble substance AgCl forms, a white precipitate (arrow ↓). Such reactions are used to find out whether a solution contains chloride ions.\nWrite the ions of the reactants, find the pair that gives an insoluble substance (using the solubility table), and balance the reaction.\nAg⁺ + Cl⁻ → AgCl↓. From 58.5 g of NaCl (that is 1 mol) you get 1 mol of AgCl, i.e. 143.5 g of precipitate."]], "bio": [["Это общее уравнение фотосинтеза: на свету зелёные растения превращают углекислый газ и воду в глюкозу и кислород. Идёт в хлоропластах с участием хлорофилла.\nСчитайте по коэффициентам: на 6 моль CO₂ приходится 1 моль глюкозы и 6 моль O₂. Массу находите через молярные массы (CO₂ — 44, O₂ — 32, глюкоза — 180 г/моль).\nСколько кислорода выделится при образовании 1 моль глюкозы? 6 моль O₂ = 6 · 32 = 192 г. А CO₂ потребуется 6 · 44 = 264 г.", "Ин муодилаи умумии фотосинтез аст: дар рӯшноӣ растаниҳои сабз гази карбон ва обро ба глюкоза ва оксиген табдил медиҳанд. Дар хлоропластҳо бо иштироки хлорофилл мегузарад.\nАз рӯи коэффисиентҳо ҳисоб кунед: ба 6 мол CO₂ 1 мол глюкоза ва 6 мол O₂ рост меояд. Массаро тавассути массаҳои молярӣ ёбед (CO₂ — 44, O₂ — 32, глюкоза — 180 г/мол).\nҲангоми ҳосилшавии 1 мол глюкоза чӣ қадар оксиген ҷудо мешавад? 6 мол O₂ = 6 · 32 = 192 г. CO₂ бошад 6 · 44 = 264 г лозим аст.", "This is the overall equation of photosynthesis: in light, green plants turn carbon dioxide and water into glucose and oxygen. It happens in chloroplasts with the help of chlorophyll.\nCalculate by the coefficients: 6 mol of CO₂ correspond to 1 mol of glucose and 6 mol of O₂. Get masses from molar masses (CO₂ 44, O₂ 32, glucose 180 g/mol).\nHow much oxygen is released when 1 mol of glucose forms? 6 mol O₂ = 6 · 32 = 192 g. CO₂ needed: 6 · 44 = 264 g."], ["В молекуле ДНК количество аденина (A) равно количеству тимина (T), а гуанина (G) — цитозину (C), потому что основания образуют пары A–T и G–C.\nНайдите парный нуклеотид по правилу. Остаток процентов делите поровну между G и C (или между A и T).\nЕсли A = 30%, то T = 30%. Тогда G + C = 100 − 60 = 40%, значит G = C = 20%.", "Дар молекулаи ДНК миқдори аденин (A) ба миқдори тимин (T) ва гуанин (G) ба цитозин (C) баробар аст, зеро асосҳо ҷуфтҳои A–T ва G–C месозанд.\nНуклеотиди ҷуфтро аз рӯи қоида ёбед. Фоизи бақиямондаро байни G ва C (ё байни A ва T) баробар тақсим кунед.\nАгар A = 30% бошад, T = 30%. Он гоҳ G + C = 100 − 60 = 40%, яъне G = C = 20%.", "In a DNA molecule the amount of adenine (A) equals thymine (T), and guanine (G) equals cytosine (C), because the bases form A–T and G–C pairs.\nFind the paired nucleotide by the rule. Split the remaining percent equally between G and C (or between A and T).\nIf A = 30%, then T = 30%. Then G + C = 100 − 60 = 40%, so G = C = 20%."], ["2n — диплоидный набор хромосом (в обычных клетках тела), n — гаплоидный набор (в половых клетках). У человека 2n = 46, поэтому в яйцеклетке и сперматозоиде по 23 хромосомы.\nЧтобы найти n, разделите 2n на 2. При оплодотворении n + n снова даёт 2n.\n2n = 46 → n = 23; при оплодотворении 23 + 23 = 46. У плодовой мушки 2n = 8, значит в гамете n = 4.", "2n — маҷмӯи диплоидии хромосомаҳо (дар ҳуҷайраҳои оддии бадан), n — маҷмӯи гаплоидӣ (дар ҳуҷайраҳои ҷинсӣ). Дар инсон 2n = 46, бинобар ин дар тухмҳуҷайра ва сперматозоид 23-тоӣ хромосома ҳаст.\nБарои ёфтани n, 2n-ро ба 2 тақсим кунед. Ҳангоми бордоршавӣ n + n боз 2n медиҳад.\n2n = 46 → n = 23; ҳангоми бордоршавӣ 23 + 23 = 46. Дар пашшаи мевагӣ 2n = 8, яъне дар гамета n = 4.", "2n is the diploid set of chromosomes (in ordinary body cells), n is the haploid set (in sex cells). In humans 2n = 46, so the egg and the sperm each have 23 chromosomes.\nTo find n, divide 2n by 2. At fertilisation n + n gives 2n again.\n2n = 46 → n = 23; at fertilisation 23 + 23 = 46. A fruit fly has 2n = 8, so a gamete has n = 4."], ["Это клеточное дыхание: клетка окисляет глюкозу кислородом, получает углекислый газ, воду и энергию в виде АТФ. Это реакция, обратная фотосинтезу.\nСчитайте по коэффициентам и молярным массам: глюкоза — 180 г/моль, O₂ — 32, CO₂ — 44, H₂O — 18.\nИз 1 моль глюкозы (180 г) расходуется 6 моль O₂ (192 г) и образуется 6 моль CO₂ (264 г) и 6 моль H₂O (108 г). Проверка массы: 180 + 192 = 372 = 264 + 108.", "Ин нафаскашии ҳуҷайравӣ аст: ҳуҷайра глюкозаро бо оксиген оксид мекунад, гази карбон, об ва энергия дар намуди АТФ мегирад. Ин реаксияи баръакси фотосинтез аст.\nАз рӯи коэффисиентҳо ва массаҳои молярӣ ҳисоб кунед: глюкоза — 180 г/мол, O₂ — 32, CO₂ — 44, H₂O — 18.\nАз 1 мол глюкоза (180 г) 6 мол O₂ (192 г) сарф мешавад ва 6 мол CO₂ (264 г) ва 6 мол H₂O (108 г) ҳосил мешавад. Санҷиши масса: 180 + 192 = 372 = 264 + 108.", "This is cellular respiration: the cell oxidises glucose with oxygen and gets carbon dioxide, water and energy as ATP. It is the reverse of photosynthesis.\nCalculate with the coefficients and molar masses: glucose 180 g/mol, O₂ 32, CO₂ 44, H₂O 18.\nFrom 1 mol of glucose (180 g), 6 mol of O₂ (192 g) are used and 6 mol of CO₂ (264 g) and 6 mol of H₂O (108 g) form. Mass check: 180 + 192 = 372 = 264 + 108."]]};

/* calculator */
function calcEval(src){
  var s=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.').replace(/π/g,'pi').replace(/√/g,'sqrt');
  var tok=(s.match(/\d+\.?\d*|\.\d+|sqrt|pi|[-+*\/^()]|\s+|./g)||[]).filter(function(t){return !/^\s+$/.test(t)});
  var i=0;
  function peek(){return tok[i]}
  function next(){return tok[i++]}
  function expr(){var v=term();while(peek()==='+'||peek()==='-'){var o=next(),r=term();v=o==='+'?v+r:v-r;}return v;}
  function term(){var v=unary();while(peek()==='*'||peek()==='/'){var o=next(),r=unary();v=o==='*'?v*r:v/r;}return v;}
  function unary(){if(peek()==='-'){next();return -unary();}if(peek()==='+'){next();return unary();}return pow();}
  function pow(){var b=atom();if(peek()==='^'){next();return Math.pow(b,unary());}return b;}
  function atom(){
    var t=next();if(t===undefined)throw new Error('x');
    if(t==='('){var v=expr();if(next()!==')')throw new Error('x');return v;}
    if(t==='pi')return Math.PI;
    if(t==='sqrt')return Math.sqrt(atom());
    if(/^[\d.]/.test(t)){var n=parseFloat(t);if(isNaN(n))throw new Error('x');return n;}
    throw new Error('x');
  }
  if(!tok.length)throw new Error('x');
  var v=expr();
  if(i<tok.length||!isFinite(v))throw new Error('x');
  return v;
}

  if(!calcExpr.trim()){out.textContent='0';return;}
  try{out.textContent='= '+fmtNum(calcEval(calcExpr));}catch(e){out.textContent='…';}
}

}

function calcKey(k){
  if(k==='C')calcExpr='';
  else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);
  else if(k==='=')return calcEquals();
  else if(k==='x²')calcExpr+='^2';
  else if(k==='√')calcExpr+='√(';
  else calcExpr+=k;
  updateCalc();
}

function exRun(){
  var p=progs[exLevel];clearExec();exReset();exSet('','');
  if(!p.length){exSet(ui('ex_empty'),'bad');refreshExec();return;}
  var i=0;exRunning=true;refreshExec();
  function step(){
    if(!exRunning)return;
    if(i>=p.length){
      exRunning=false;exActive=-1;var g=LV[exLevel].goal;
      track('exT');
      if(exSt.x===g[0]&&exSt.y===g[1]){track('ex',exLevel);exSet(ui('ex_ok').replace('{n}',p.length),'ok');}else exSet(ui('ex_miss'),'bad');
      refreshExec();return;
    }
    var c=p[i];exActive=i;
    if(c==='l')exSt.d=(exSt.d+3)%4;
    else if(c==='r')exSt.d=(exSt.d+1)%4;
    else{
      var nx=exSt.x+[1,0,-1,0][exSt.d],ny=exSt.y+[0,1,0,-1][exSt.d];

      exSt.x=nx;exSt.y=ny;

}

function streakPush(){var tk=tokGet();if(!AUTH_API||!tk||!sessionLogin())return;api('streak_save',{token:tk,days:stDays()}).then(function(){lbFetch()}).catch(function(){})}
function streakMerge(days){
  if(!Array.isArray(days))return;
  var o=stAll(),k=stKey(),a=Array.isArray(o[k])?o[k]:[],set={};
  a.concat(days).forEach(function(d){if(typeof d==='string')set[d]=1});
  var m=Object.keys(set).sort().slice(-400);
  if(m.length!==a.length){o[k]=m;try{localStorage.setItem('infasub-streak',JSON.stringify(o))}catch(e){}streakDraw();}
  if(m.length>days.length&&!SRV.streakPushed){SRV.streakPushed=true;streakPush();}
}
function stStatsJS(days){
  var set={};days.forEach(function(d){var p=d.split('-');set[Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5)]=1});
  var arr=Object.keys(set).map(Number).sort(function(a,b){return a-b}),best=0,run=0,prev=null;
  arr.forEach(function(n){run=(prev!==null&&n-prev===1)?run+1:1;prev=n;if(run>best)best=run});
  var d=new Date(),today=Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5),cur=0;
  if(arr.length){var last=arr[arr.length-1];if(last>=today-1){cur=1;var n=last;while(set[n-1]){cur++;n--}}}
  return {cur:cur,best:best,total:arr.length};
}

/* ---- olympiad ---- */
function olyAll(){try{return JSON.parse(localStorage.getItem('infasub-olymp')||'{}')||{}}catch(e){return {}}}
function olyPut(o){try{localStorage.setItem('infasub-olymp',JSON.stringify(o))}catch(e){}}
function olyMe(){return srvOn()?SRV.olymp:(olyAll()[sessionLogin()]||null)}
function olyRun(){try{var r=JSON.parse(localStorage.getItem('infasub-olyrun')||'null');return r&&r.login===sessionLogin()?r:null}catch(e){return null}}
function olyRunSet(r){try{if(r)localStorage.setItem('infasub-olyrun',JSON.stringify(r));else localStorage.removeItem('infasub-olyrun')}catch(e){}}
function olyProbs(sid){return PROBLEMS.filter(function(p){return p.s===sid})}
function olyPend(){try{return JSON.parse(localStorage.getItem('infasub-olypend')||'[]')||[]}catch(e){return []}}
function olyPendSet(a){try{localStorage.setItem('infasub-olypend',JSON.stringify(a))}catch(e){}}
function olyFlush(){
  if(!srvOn())return;var a=olyPend().filter(function(x){return x.login===sessionLogin()});if(!a.length)return;
  var x=a[0];api('olymp_submit',{token:tokGet(),subj:x.subj,score:x.score,secs:x.secs}).then(function(r){if(r&&r.ok){SRV.olymp=r.olymp;olyPendSet(olyPend().filter(function(y){return !(y.login===x.login&&y.subj===x.subj)}));lbFetch();if(view==='olymp')render();}}).catch(function(){});
}
function olyJoin(cls){
  if(srvOn()){api('olymp_join',{token:tokGet(),cls:cls}).then(function(r){if(r&&r.ok){SRV.olymp=r.olymp;render();lbFetch();}else toast(LT('e_net'))}).catch(function(){toast(LT('e_net'))});return;}
  var o=olyAll(),l=sessionLogin();o[l]=o[l]||{joined:Date.now(),cls:cls,res:{}};olyPut(o);render();
}
function olyStart(sid){
  var me=olyMe();if(!me||(me.res&&me.res[sid]))return;
  var r=olyRun();if(r&&r.subj!==sid){toast(LT('busy'));return;}
  if(!r)olyRunSet({login:sessionLogin(),subj:sid,start:Date.now(),vals:{}});
  olyReview=null;render();window.scrollTo(0,0);
}
function olyFinish(auto){
  var r=olyRun();if(!r)return;
  var ps=olyProbs(r.subj),score=0;
  ps.forEach(function(p){var v=parseFloat(String(r.vals[p.id]||'').replace(',','.'));if(!isNaN(v)&&Math.abs(v-p.ans)<1e-9)score++});
  var secs=Math.min(OLY_SEC,Math.max(score*4,1,Math.round((Date.now()-r.start)/1000)));
  olyRunSet(null);clearInterval(olyTimer);
  olyReview={subj:r.subj,vals:r.vals,score:score,secs:secs};
  if(srvOn()){
    api('olymp_submit',{token:tokGet(),subj:r.subj,score:score,secs:secs}).then(function(x){if(x&&x.ok){SRV.olymp=x.olymp;lbFetch();}else throw 0;render();}).catch(function(){var a=olyPend();a.push({login:sessionLogin(),subj:r.subj,score:score,secs:secs});olyPendSet(a);toast(LT('e_net'));render();});
  }else{var o=olyAll(),l=sessionLogin();o[l]=o[l]||{joined:Date.now(),cls:'',res:{}};o[l].res[r.subj]={score:score,secs:secs,t:Date.now()};olyPut(o);render();}
  if(auto)toast(LT('timeup'));
}
function olyTick(){
  clearInterval(olyTimer);var r=olyRun();if(!r)return;
  function t(){var left=OLY_SEC-Math.floor((Date.now()-r.start)/1000);if(left<=0){olyFinish(true);return}var el=document.getElementById('oly-timer');if(el){el.textContent=fmtMS(left);el.classList.toggle('low',left<=120)}}

}

}
function olyBoardHtml(){
  var me=lbMe(),f=LB.oSub,rows=olyRows().map(function(u){var r=f==='all'?{score:u.total,secs:u.secs,has:Object.keys(u.res||{}).length>0}:{score:(u.res[f]||{}).score||0,secs:(u.res[f]||{}).secs||0,has:!!u.res[f]};return {u:u,p:r.score,t:r.secs,has:r.has}}).filter(function(x){return x.has});

  var chips='<div class="chips lbtabs"><button type="button" class="tab" data-oboard="all" aria-pressed="'+(f==='all')+'">'+esc(LT('all'))+'</button>'+SUBJECTS.map(function(s){return '<button type="button" class="tab" data-oboard="'+s.id+'" aria-pressed="'+(f===s.id)+'" style="--c:'+col(s.c)+'"><i></i>'+esc(tr(s.name))+'</button>'}).join('')+'</div>';
  if(!rows.length)return chips+'<div class="readme"><p>'+esc(LT('empty_o'))+'</p></div>';
  var h=chips+'<div class="lbwrap"><table class="lbt"><thead><tr><th>#</th><th>'+esc(LT('who'))+'</th><th>'+esc(LT('cls'))+'</th><th>'+esc(LT('pts'))+'</th><th>'+esc(LT('time'))+'</th></tr></thead><tbody>';
  rows.forEach(function(x,i){h+='<tr'+(x.u.id===me?' class="me"':'')+'><td class="lbr">'+medal(i)+'</td><td>'+who(x.u,me)+'</td><td class="lbn">'+esc(x.u.cls||'—')+'</td><td class="lbn on">'+x.p+'</td><td class="lbn">'+fmtMS(x.t)+'</td></tr>'});
  return h+'</tbody></table></div>';
}
function olyReviewHtml(){
  var rv=olyReview,sb=subj(rv.subj),ps=olyProbs(rv.subj);
  var h='<div class="olyres" style="--c:'+col(sb.c)+'"><div class="olybig"><b>'+rv.score+'</b><span>'+esc(LT('of'))+' '+ps.length+' '+esc(LT('pts'))+'</span></div><p>'+esc(tr(sb.name))+' · '+esc(LT('time'))+': '+fmtMS(rv.secs)+'</p></div><div class="olyq">';
  ps.forEach(function(p,i){
    var v=parseFloat(String(rv.vals[p.id]||'').replace(',','.')),ok=!isNaN(v)&&Math.abs(v-p.ans)<1e-9,mine=String(rv.vals[p.id]||'').trim();
    h+='<article class="prob olyi '+(ok?'okc':'badc')+'"><div class="prob-q"><span class="pn">'+(i+1)+'</span><p>'+esc(tr(p.q))+'</p></div><p class="olya">'+(ok?'✓ ':'✗ ')+esc(LT('ans'))+': <b>'+esc(mine||LT('noans'))+'</b> · '+esc(LT('right'))+': <b>'+esc(ansFmt(p.ans))+'</b></p></article>';
  });
  return h+'</div><p><button type="button" class="btn" data-oly-back>'+esc(LT('back'))+'</button></p>';
}
function olyTestHtml(r){
  var sb=subj(r.subj),ps=olyProbs(r.subj);
  return '<div class="olybar" style="--c:'+col(sb.c)+'"><b>'+esc(tr(sb.name))+'</b><span>'+esc(LT('left'))+': <b id="oly-timer" class="oltm">'+fmtMS(OLY_SEC)+'</b></span><button type="button" class="btn" data-oly-finish>'+esc(LT('finish'))+'</button></div><div class="olyq">'+
    ps.map(function(p,i){return '<article class="prob olyi"><div class="prob-q"><span class="pn">'+(i+1)+'</span><p>'+esc(tr(p.q))+'</p></div><div class="prob-row"><input data-oid="'+p.id+'" inputmode="decimal" autocomplete="off" placeholder="'+esc(LT('ph'))+'" value="'+esc(r.vals[p.id]||'')+'"></div></article>'}).join('')+
    '</div><p><button type="button" class="btn" data-oly-finish>'+esc(LT('finish'))+'</button></p>';
}
function viewOlymp(){
  var h=head(ui('t_olymp'),LT('o_s'),'OLY','yellow'),me=olyMe(),run=olyRun();
  if(AUTH_API&&tokGet()&&!SRV.synced)return h+'<p class="lbnote">'+esc(at('loading'))+'</p>';
  if(olyReview&&olyReview.subj)return h+olyReviewHtml();
  if(me&&run)return h+olyTestHtml(run);
  h+='<div class="olyrules"><h3>'+esc(LT('rules_h'))+'</h3><p>'+esc(LT('rules'))+'</p></div>';
  if(!me){
    h+='<div class="olyjoin"><h3>'+esc(LT('join_h'))+'</h3><div class="olysubs">'+SUBJECTS.map(function(s){return '<span class="olychip" style="--c:'+col(s.c)+'"><i></i>'+esc(tr(s.name))+'</span>'}).join('')+'</div><label>'+esc(LT('cls'))+'<select class="fld" id="oly-cls">'+[5,6,7,8,9,10,11].map(function(n){return '<option value="'+n+'">'+n+'</option>'}).join('')+'<option value="—">'+esc(LT('other'))+'</option></select></label><button type="button" class="btn" data-oly-join>'+esc(LT('join'))+'</button></div>';
  }else{
    h+='<p class="olyok">✅ '+esc(LT('joined'))+(me.cls&&me.cls!=='—'?' · '+esc(LT('cls'))+' '+esc(me.cls):'')+'</p><h3 class="olysh">'+esc(LT('subjects'))+'</h3><div class="olygrid">'+
      SUBJECTS.map(function(s){
        var r=(me.res||{})[s.id],going=run&&run.subj===s.id,n=olyProbs(s.id).length;
        var st=r?'<b>'+r.score+'/'+n+'</b> · '+esc(LT('time'))+' '+fmtMS(r.secs):(going?esc(LT('going')):esc(LT('todo')));
        var bt=r?'':'<button type="button" class="btn" data-oly-start="'+s.id+'">'+esc(going?LT('cont'):LT('start'))+'</button>';
        return '<div class="olycard'+(r?' done':'')+'" style="--c:'+col(s.c)+'"><h4>'+esc(tr(s.name))+'</h4><p>'+st+'</p>'+bt+'</div>';
      }).join('')+'</div>';
  }
  return h+'<h3 class="olysh">'+esc(LT('board'))+'</h3><div id="olyboard">'+olyBoardHtml()+'</div>';
}
document.addEventListener('click',function(e){
  var t=e.target&&e.target.closest?e.target.closest('[data-oly-join],[data-oly-start],[data-oly-finish],[data-oly-back],[data-oboard],[data-lbtab]'):null;if(!t)return;
  if(t.hasAttribute('data-oly-join')){var c=document.getElementById('oly-cls');olyJoin(c?c.value:'');return;}
  if(t.hasAttribute('data-oly-start')){olyStart(t.getAttribute('data-oly-start'));return;}
  if(t.hasAttribute('data-oly-finish')){if(window.confirm(LT('confirm')))olyFinish(false);return;}
  if(t.hasAttribute('data-oly-back')){olyReview=null;render();window.scrollTo(0,0);return;}
  if(t.hasAttribute('data-oboard')){LB.oSub=t.getAttribute('data-oboard');var b=document.getElementById('olyboard');if(b)b.innerHTML=olyBoardHtml();return;}
  if(t.hasAttribute('data-lbtab')){LB.tab=t.getAttribute('data-lbtab');render();return;}
});
document.addEventListener('input',function(e){
  var el=e.target;if(!el||!el.getAttribute)return;var id=el.getAttribute('data-oid');if(!id)return;
  var r=olyRun();if(r){r.vals[id]=el.value;olyRunSet(r);}
});
setInterval(function(){if(view==='leaders'||view==='olymp')lbFetch()},30000);
function render(){
  var v=view,h;
  if(v!=='olymp')clearInterval(olyTimer);
  if(v!=='books')readPdf='';
  if(v==='home')h=viewHome();
  else if(subj(v))h=viewSubject(v);
  else if(v==='books')h=viewBooks();
  else if(v==='problems')h=viewProblems();
  else if(v==='languages')h=viewLangs();
  else if(v==='calculator')h=viewCalc();
  else if(v==='users')h=viewUsers();
  else if(v==='leaders')h=viewLeaders();
  else if(v==='olymp')h=viewOlymp();
  else if(v==='admin')h=viewAdmin();
  else if(v==='quizzes')h=viewQuiz();
  else h=viewHome();
  $('#view').innerHTML=h;
  renderChrome();
  renderAuth();
  if(subj(v))track('s',v);
  if(v==='books'&&readBook>=0){track('ch',readBook+'_'+readCh);streakHit();}
  if(v==='books')renderBookList();
  if(v==='problems')renderProblemList();
  if(v==='languages')renderLangList();
  if(v==='calculator'){renderHist();updateCalc();}
  if(v==='quizzes'){exReset();refreshExec();}
  if(v==='books'&&readPdf)pdfMobileInit();
  if(v==='admin'){if(ADM.users)admDraw();admFetch();}
  if(v==='leaders')lbFetch();
  if(v==='olymp'){lbFetch();olyTick();}
}
function route(){
  var h=location.hash.slice(1);
  if(VIEWS.indexOf(h)<0)h='home';
  clearExec();readBook=-1;view=h;render();window.scrollTo(0,0);
}

function loadSolved(){
  var k=solvedKey(),v=null;
  try{v=localStorage.getItem(k);if(v===null&&k!=='infasub-solved:'){var old=localStorage.getItem('infasub-solved');if(old){v=old;localStorage.setItem(k,old);}}}catch(e){}

}
function solvedSave(){try{localStorage.setItem(solvedKey(),JSON.stringify(solved))}catch(e){}progPush();}
function progPush(){var tk=tokGet();if(!AUTH_API||!tk||!sessionLogin())return;api('progress_save',{token:tk,solved:Object.keys(solved)}).catch(function(){})}
function progMerge(list){
  if(!Array.isArray(list))return;var add=0;
  list.forEach(function(id){if(typeof id==='string'&&!solved[id]){solved[id]=1;add++}});
  if(add){try{localStorage.setItem(solvedKey(),JSON.stringify(solved))}catch(e){}updateProgress();if(view==='problems')renderProblemList();}
  if(Object.keys(solved).length>list.length&&!SRV.progPushed){SRV.progPushed=true;progPush();}
}

function submitAuth(){
  if(authMode==='code')return submitCode();
  var reg=authMode==='register',email=(document.getElementById('a-login').value||'').trim().toLowerCase(),pw=document.getElementById('a-pass').value||'';
  var EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  if(reg){
    var name=(document.getElementById('a-name').value||'').trim(),pw2=document.getElementById('a-pass2').value||'',cty=(document.getElementById('a-country').value||'').trim();
    if(!name||!email||!pw||!pw2||!cty)return authErr('e_fill');
    pendCountry=cty.slice(0,40);
    if(name.length<2)return authErr('e_name');
    if(!EMAIL.test(email))return authErr('e_email');
    if(pw.length<6)return authErr('e_pass');
    if(pw!==pw2)return authErr('e_match');
    if(!AUTH_API&&Object.prototype.hasOwnProperty.call(getUsers(),email))return authErr('e_exists');
    authErr('');busy(true);
    if(!AUTH_API){
      pwHash(email,pw).then(function(hh){
        var us=getUsers();
        if(Object.prototype.hasOwnProperty.call(us,email)){busy(false);return authErr('e_exists');}
        us[email]={name:name,hash:hh,created:Date.now()};
        if(!putUsers(us)){busy(false);return authErr('e_net');}
        busy(false);finishLogin(email,name);
      }).catch(function(){busy(false);authErr('e_net')});
      return;
    }
    pwHash(email,pw).then(function(hh){
      regPending={name:name,email:email,hash:hh};
      return sendCode();
    }).then(function(r){
      busy(false);
      if(!r.ok){regPending=null;return authErr(errKey(r.error));}
      openAuth('code');
    }).catch(function(){busy(false);authErr('e_net')});
  }else{
    if(!email||!pw)return authErr('e_fill');
    authErr('');busy(true);
    if(AUTH_API){
      pwHash(email,pw).then(function(hh){return api('login',{email:email,hash:hh})}).then(function(r){
        busy(false);if(!r.ok)return authErr(errKey(r.error==='bad_login'?'bad_login':r.error));
        finishLogin(email,r.name);
      }).catch(function(){busy(false);authErr('e_net')});
    }else{
      var users=getUsers(),u=Object.prototype.hasOwnProperty.call(users,email)?users[email]:null;
      if(!u){busy(false);return authErr('e_bad');}
      (u.salt?sha(u.salt+pw):pwHash(email,pw)).then(function(hh){busy(false);if(hh!==u.hash)return authErr('e_bad');finishLogin(email,u.name);});
    }
  }
}
function submitCode(){
  var p=regPending;if(!p)return openAuth('register');
  var code=(document.getElementById('a-code').value||'').replace(/\D/g,'');
  if(code.length!==6)return authErr('e_code');
  authErr('');busy(true);
  if(AUTH_API){
    api('verify',{email:p.email,code:code,name:p.name,hash:p.hash}).then(function(r){
      busy(false);if(!r.ok)return authErr(errKey(r.error));
      finishLogin(p.email,r.name||p.name);
    }).catch(function(){busy(false);authErr('e_net')});
  }else{busy(false);authErr('e_nomail');}
}

/* ---------- informatics ---------- */
function aiBigFrom(str,base){var v=0n,B=BigInt(base);for(var i=0;i<str.length;i++)v=v*B+BigInt(parseInt(str.charAt(i),16));return v;}
var AIBASES=[[2,/двоичн|binary|дуӣ|дуи/],[8,/восьмеричн|octal|ҳаштӣ/],[10,/десятичн|decimal|даҳӣ|даҳи/],[16,/шестнадцатеричн|hexadecimal|\bhex\b|ҳексадесимал/]];
function aiBase(t,qn){
  if(typeof BigInt==='undefined')return null;
  var s=qn.replace(/[₀-₉]/g,function(d){return '_'+String(d.charCodeAt(0)-8320);}).replace(/_(\d)_(\d)/g,'_$1$2').replace(/_(\d)_(\d)/g,'_$1$2');

    if((m=/^0x([0-9a-fA-F]+)$/i.exec(w))){tok=m[1];tb=16;break;}

  if(!tok){
    if(!words.length)return null;
    var hex=words.some(function(w){return w.b===16;});
    for(var j=0;j<toks.length;j++){
      var w2=toks[j].replace(/[.)]+$/,'');
      if(/^\d+$/.test(w2)||(hex&&(/^[0-9a-f]+$/i.test(w2)&&(/\d/.test(w2)||/^[A-F]{2,}$/.test(w2))))){tok=w2;break;}
    }

  else if(words.length>=2){src=words[0].b;tgt=words[1].b;}
  else{

  if(tok.length>60)return null;
  if(!ok.test(tok))return aiT('Число '+tok+' содержит цифры, которых нет в системе с основанием '+src+'.','Рақами '+tok+' дар низоми '+src+' вуҷуд надорад.','The number '+tok+' has digits that do not exist in base '+src+'.');
  var val=aiBigFrom(tok,src),res=val.toString(tgt).toUpperCase();
  var L=[];
  if(tgt===10&&src===2&&tok.length<=24){
    var parts=[],pw=[];
    for(var k=0;k<tok.length;k++)if(tok.charAt(k)==='1'){var e=tok.length-1-k;parts.push(String(Math.pow(2,e)));pw.push('2^'+e);}
    L.push(aiT('Раскладываем по степеням двойки: ','Аз рӯи дараҷаҳои 2: ','Expand in powers of two: ')+pw.join(' + '));

function aiUnit(w){

/* ---------- number theory ---------- */
function aiNT(t){
  var ints=(t.match(/\d+/g)||[]).map(Number).filter(function(x){return x<=1e12;});
  var m;
  if((m=/(\d+)\s*!/.exec(t)||/(?:факториал[а-яё]*|factorial)\s*(?:от|of)?\s*(\d+)/.exec(t))&&typeof BigInt!=='undefined'){
    var n=+m[1];if(n>100)return aiT('Слишком большое число (до 100).','Рақам хеле калон аст (то 100).','Number too large (up to 100).');
    var f=1n;for(var i=2;i<=n;i++)f*=BigInt(i);return n+'! = **'+f.toString()+'**';
  }
  if(/(?:^|[^а-яё])(нод|нок)(?![а-яё])|\bgcd\b|\blcm\b|наибольш[а-яё]* общ[а-яё]* делител|наименьш[а-яё]* общ[а-яё]* кратн|бузургтарин бахшёбандаи умумӣ/.test(t)&&ints.length>=2){
    var g=ints[0],l=ints[0];
    for(var k=1;k<ints.length;k++){g=aiGcd(g,ints[k]);l=l/aiGcd(l,ints[k])*ints[k];}
    var isL=/нок|lcm|наименьш/.test(t)&&!/нод|gcd|наибольш/.test(t);
    return (isL?aiT('НОК','ХКУ','LCM'):aiT('НОД','БУБ','GCD'))+'('+ints.join(', ')+') = **'+(isL?l:g)+'**'+(isL?'':'\n'+aiT('НОК','ХКУ','LCM')+' = '+l);
  }
  if(ints.length>=1&&/разлож[а-яё]* на (?:простые )?множител|factori[sz]e|prime factors|ба зарбкунандаҳои оддӣ/.test(t)){
    var x=ints[0],orig=x;if(x<2)return null;var fs={},p=2;
    while(p*p<=x){while(x%p===0){fs[p]=(fs[p]||0)+1;x/=p;}p++;}
    if(x>1)fs[x]=(fs[x]||0)+1;
    return orig+' = **'+Object.keys(fs).map(function(q){return fs[q]>1?q+'^'+fs[q]:q;}).join(' · ')+'**';
  }
  if(ints.length>=1&&/прост[а-яё]* ли|простое число|является ли.*простым|is\s+\d+\s+(?:a\s+)?prime|prime number|оддӣ аст|содда/.test(t)){

  }
  return null;
}

function aiKnow(q){

    if(!hit)return;var sc=hit+th*1.5+(c.boost||0)*(hit?1:0);
    best.push({c:c,s:sc,hit:hit});
  });
  if(!best.length)return null;
  best.sort(function(a,b){return b.s-a.s});
  var need=qt.length>=3?2:1;if(best[0].hit<need)return null;
  var top=best[0].c,res=[],seen={};
  best.slice(0,6).forEach(function(b){if(res.length>=2||b.hit<need||b.s<best[0].s*0.6)return;var k=(b.c.title[L]||'')+'|'+(b.c.t[L]||'').slice(0,40);if(seen[k])return;seen[k]=1;res.push(b.c)});

  var out=[hd[L]];
  res.forEach(function(c){
    var txt=c.t[L]||c.t.ru||'';if(c.kind==='faq')out.push(txt);
    else out.push(c.src+' **'+(c.title[L]||c.title.ru)+'**\n'+txt);
  });
  if(res.some(function(c){return c.kind==='book'}))out.push(tail[L]);
  return out.join('\n\n');
}
