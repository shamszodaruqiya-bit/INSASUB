{id:'i3',s:'inf',ans:16,q:{"ru": "Сколько бит в 2 байтах?", "tg": "Дар 2 байт чанд бит ҳаст?", "en": "How many bits are in 2 bytes?"},sol:{"ru": "1 байт = 8 бит, поэтому 2 × 8 = 16 бит.", "tg": "1 байт = 8 бит, пас 2 × 8 = 16 бит.", "en": "1 byte = 8 bits, so 2 × 8 = 16 bits."}},
{id:'i4',s:'inf',ans:2048,q:{"ru": "Сколько байт в 2 Кбайт? (1 Кбайт = 1024 байта)", "tg": "Дар 2 Кбайт чанд байт ҳаст? (1 Кбайт = 1024 байт)", "en": "How many bytes are in 2 KB? (1 KB = 1024 bytes)"},sol:{"ru": "2 × 1024 = 2048 байт.", "tg": "2 × 1024 = 2048 байт.", "en": "2 × 1024 = 2048 bytes."}},
{id:'i5',s:'inf',ans:13,q:{"ru": "Переведите 1101₂ в десятичную систему.", "tg": "1101₂-ро ба низоми даҳӣ гузаронед.", "en": "Convert 1101₂ to decimal."},sol:{"ru": "1·8 + 1·4 + 0·2 + 1·1 = 8 + 4 + 0 + 1 = 13.", "tg": "1·8 + 1·4 + 0·2 + 1·1 = 8 + 4 + 0 + 1 = 13.", "en": "1·8 + 1·4 + 0·2 + 1·1 = 8 + 4 + 0 + 1 = 13."}},
{id:'i6',s:'inf',ans:11001,q:{"ru": "Запишите число 25 в двоичной системе (только цифры).", "tg": "Рақами 25-ро дар низоми дуӣ нависед (фақат рақамҳо).", "en": "Write the number 25 in binary (digits only)."},sol:{"ru": "25 = 16 + 8 + 1 → разряды 16, 8, 4, 2, 1 дают 1, 1, 0, 0, 1. Ответ: 11001.", "tg": "25 = 16 + 8 + 1 → разрядҳои 16, 8, 4, 2, 1 рақамҳои 1, 1, 0, 0, 1 медиҳанд. Ҷавоб: 11001.", "en": "25 = 16 + 8 + 1 → the places 16, 8, 4, 2, 1 give 1, 1, 0, 0, 1. Answer: 11001."}},
{id:'i7',s:'inf',ans:32,q:{"ru": "Сколько различных значений можно закодировать 5 битами?", "tg": "Бо 5 бит чандто қиматҳои гуногунро рамзгузорӣ кардан мумкин?", "en": "How many different values can be encoded with 5 bits?"},sol:{"ru": "Каждый бит удваивает число вариантов: 2⁵ = 32.", "tg": "Ҳар бит шумораи вариантҳоро дучанд мекунад: 2⁵ = 32.", "en": "Each bit doubles the number of options: 2⁵ = 32."}},
{id:'i8',s:'inf',ans:4,q:{"ru": "Сколько бит нужно, чтобы закодировать 16 различных символов?", "tg": "Барои рамзгузории 16 аломати гуногун чанд бит лозим аст?", "en": "How many bits are needed to encode 16 different symbols?"},sol:{"ru": "2⁴ = 16, значит нужно 4 бита.", "tg": "2⁴ = 16, яъне 4 бит лозим аст.", "en": "2⁴ = 16, so 4 bits are needed."}},
{id:'i9',s:'inf',ans:500,q:{"ru": "Текст содержит 500 символов, каждый символ занимает 8 бит. Сколько байт занимает текст?", "tg": "Матн 500 аломат дорад, ҳар аломат 8 бит ишғол мекунад. Матн чанд байт мегирад?", "en": "A text has 500 characters, each takes 8 bits. How many bytes does the text take?"},sol:{"ru": "I = 500 · 8 = 4000 бит; 4000 : 8 = 500 байт (1 символ = 1 байт).", "tg": "I = 500 · 8 = 4000 бит; 4000 : 8 = 500 байт (1 аломат = 1 байт).", "en": "I = 500 · 8 = 4000 bits; 4000 : 8 = 500 bytes (1 character = 1 byte)."}},
{id:'i10',s:'inf',ans:200,q:{"ru": "Изображение 10 × 10 пикселей, каждый пиксель кодируется 2 битами. Сколько бит занимает изображение?", "tg": "Тасвир 10 × 10 пиксел аст, ҳар пиксел бо 2 бит рамзгузорӣ мешавад. Тасвир чанд бит мегирад?", "en": "An image is 10 × 10 pixels, each pixel uses 2 bits. How many bits does the image take?"},sol:{"ru": "10 · 10 = 100 пикселей; 100 · 2 = 200 бит.", "tg": "10 · 10 = 100 пиксел; 100 · 2 = 200 бит.", "en": "10 · 10 = 100 pixels; 100 · 2 = 200 bits."}},
{id:'i11',s:'inf',ans:4,q:{"ru": "Файл весит 4 Мбайт. Скорость передачи 8 Мбит/с. За сколько секунд передастся файл?", "tg": "Ҳаҷми файл 4 Мбайт аст. Суръати интиқол 8 Мбит/с. Файл дар чанд сония интиқол мешавад?", "en": "A file is 4 MB. The transfer rate is 8 Mbit/s. How many seconds does the transfer take?"},sol:{"ru": "4 Мбайт = 4 · 8 = 32 Мбит; 32 : 8 = 4 секунды.", "tg": "4 Мбайт = 4 · 8 = 32 Мбит; 32 : 8 = 4 сония.", "en": "4 MB = 4 · 8 = 32 Mbit; 32 : 8 = 4 seconds."}},
{id:'i12',s:'inf',ans:31,q:{"ru": "Переведите 1F₁₆ в десятичную систему.", "tg": "1F₁₆-ро ба низоми даҳӣ гузаронед.", "en": "Convert 1F₁₆ to decimal."},sol:{"ru": "F = 15. 1·16 + 15 = 31.", "tg": "F = 15. 1·16 + 15 = 31.", "en": "F = 15. 1·16 + 15 = 31."}},
{id:'i13',s:'inf',ans:1,q:{"ru": "Чему равно значение выражения NOT(0) AND 1? (ответ 0 или 1)", "tg": "Қимати ифодаи NOT(0) AND 1 чӣ қадар аст? (ҷавоб 0 ё 1)", "en": "What is the value of NOT(0) AND 1? (answer 0 or 1)"},sol:{"ru": "NOT(0) = 1; 1 AND 1 = 1.", "tg": "NOT(0) = 1; 1 AND 1 = 1.", "en": "NOT(0) = 1; 1 AND 1 = 1."}},
{id:'i14',s:'inf',ans:1110,q:{"ru": "Сложите 1011₂ и 11₂. Запишите результат в двоичной системе.", "tg": "1011₂ ва 11₂-ро ҷамъ кунед. Натиҷаро дар низоми дуӣ нависед.", "en": "Add 1011₂ and 11₂. Write the result in binary."},sol:{"ru": "1011₂ = 11, 11₂ = 3; 11 + 3 = 14 = 8 + 4 + 2 → 1110₂.", "tg": "1011₂ = 11, 11₂ = 3; 11 + 3 = 14 = 8 + 4 + 2 → 1110₂.", "en": "1011₂ = 11, 11₂ = 3; 11 + 3 = 14 = 8 + 4 + 2 → 1110₂."}},
{id:'i15',s:'inf',ans:4,q:{"ru": "Сколько Кбайт в 4096 байтах?", "tg": "Дар 4096 байт чанд Кбайт ҳаст?", "en": "How many KB are in 4096 bytes?"},sol:{"ru": "4096 : 1024 = 4 Кбайт.", "tg": "4096 : 1024 = 4 Кбайт.", "en": "4096 : 1024 = 4 KB."}},
{id:'i16',s:'inf',ans:0.5,q:{"ru": "За сколько секунд передастся 1 Мбайт при скорости 2 Мбайт/с?", "tg": "1 Мбайт бо суръати 2 Мбайт/с дар чанд сония интиқол мешавад?", "en": "How many seconds does it take to transfer 1 MB at 2 MB/s?"},sol:{"ru": "t = 1 : 2 = 0,5 секунды.", "tg": "t = 1 : 2 = 0,5 сония.", "en": "t = 1 : 2 = 0.5 seconds."}},
{id:'i17',s:'inf',ans:48,q:{"ru": "x = 3. Повторить 4 раза: x = x · 2. Чему равен x в конце?", "tg": "x = 3. 4 маротиба такрор кунед: x = x · 2. Дар охир x чӣ қадар аст?", "en": "x = 3. Repeat 4 times: x = x · 2. What is x at the end?"},sol:{"ru": "3 → 6 → 12 → 24 → 48. Или 3 · 2⁴ = 48.", "tg": "3 → 6 → 12 → 24 → 48. Ё 3 · 2⁴ = 48.", "en": "3 → 6 → 12 → 24 → 48. Or 3 · 2⁴ = 48."}},
{id:'i18',s:'inf',ans:8,q:{"ru": "Сколько существует различных двоичных чисел длиной ровно 3 бита (с ведущими нулями)?", "tg": "Чандто рақами дуии гуногуни дарозиаш айнан 3 бит (бо сифрҳои пешбаранда) вуҷуд дорад?", "en": "How many different binary numbers of exactly 3 bits exist (with leading zeros)?"},sol:{"ru": "Каждый из 3 битов принимает 2 значения: 2³ = 8.", "tg": "Ҳар яке аз 3 бит 2 қимат мегирад: 2³ = 8.", "en": "Each of the 3 bits has 2 values: 2³ = 8."}},
{id:'i19',s:'inf',ans:15,q:{"ru": "s = 0. Для i от 1 до 5 выполнить s = s + i. Чему равно s?", "tg": "s = 0. Барои i аз 1 то 5 s = s + i иҷро шавад. s чӣ қадар аст?", "en": "s = 0. For i from 1 to 5 do s = s + i. What is s?"},sol:{"ru": "1 + 2 + 3 + 4 + 5 = 15.", "tg": "1 + 2 + 3 + 4 + 5 = 15.", "en": "1 + 2 + 3 + 4 + 5 = 15."}},
{id:'i20',s:'inf',ans:63,q:{"ru": "Переведите 77₈ в десятичную систему.", "tg": "77₈-ро ба низоми даҳӣ гузаронед.", "en": "Convert 77₈ to decimal."},sol:{"ru": "7·8 + 7 = 56 + 7 = 63.", "tg": "7·8 + 7 = 56 + 7 = 63.", "en": "7·8 + 7 = 56 + 7 = 63."}},
{id:'a3',s:'alg',ans:5,q:{"ru": "Решите уравнение 5x + 3 = 28. Чему равен x?", "tg": "Муодилаи 5x + 3 = 28-ро ҳал кунед. x чӣ қадар аст?", "en": "Solve 5x + 3 = 28. What is x?"},sol:{"ru": "5x = 28 − 3 = 25; x = 25 : 5 = 5.", "tg": "5x = 28 − 3 = 25; x = 25 : 5 = 5.", "en": "5x = 28 − 3 = 25; x = 25 : 5 = 5."}},
{id:'a4',s:'alg',ans:10,q:{"ru": "Найдите значение выражения 2x² − 3x + 1 при x = 3.", "tg": "Қимати ифодаи 2x² − 3x + 1-ро ҳангоми x = 3 ёбед.", "en": "Find the value of 2x² − 3x + 1 when x = 3."},sol:{"ru": "2·9 − 3·3 + 1 = 18 − 9 + 1 = 10.", "tg": "2·9 − 3·3 + 1 = 18 − 9 + 1 = 10.", "en": "2·9 − 3·3 + 1 = 18 − 9 + 1 = 10."}},
{id:'a5',s:'alg',ans:28,q:{"ru": "Решите уравнение x / 4 = 7.", "tg": "Муодилаи x / 4 = 7-ро ҳал кунед.", "en": "Solve x / 4 = 7."},sol:{"ru": "Умножим обе части на 4: x = 7 · 4 = 28.", "tg": "Ҳарду тарафро ба 4 зарб мекунем: x = 7 · 4 = 28.", "en": "Multiply both sides by 4: x = 7 · 4 = 28."}},
{id:'a6',s:'alg',ans:9,q:{"ru": "Найдите сумму корней уравнения x² − 9x + 14 = 0.", "tg": "Суммаи решаҳои муодилаи x² − 9x + 14 = 0-ро ёбед.", "en": "Find the sum of the roots of x² − 9x + 14 = 0."},sol:{"ru": "По теореме Виета сумма корней = −b/a = 9. (Корни 2 и 7: 2 + 7 = 9.)", "tg": "Тибқи теоремаи Виет суммаи решаҳо = −b/a = 9. (Решаҳо 2 ва 7: 2 + 7 = 9.)", "en": "By Vieta’s theorem the sum of the roots = −b/a = 9. (Roots 2 and 7: 2 + 7 = 9.)"}},
{id:'a7',s:'alg',ans:15,q:{"ru": "Найдите произведение корней уравнения x² − 8x + 15 = 0.", "tg": "Ҳосили зарби решаҳои муодилаи x² − 8x + 15 = 0-ро ёбед.", "en": "Find the product of the roots of x² − 8x + 15 = 0."},sol:{"ru": "По теореме Виета произведение корней = c/a = 15. (Корни 3 и 5.)", "tg": "Тибқи теоремаи Виет ҳосили зарби решаҳо = c/a = 15. (Решаҳо 3 ва 5.)", "en": "By Vieta’s theorem the product of the roots = c/a = 15. (Roots 3 and 5.)"}},
{id:'a8',s:'alg',ans:4,q:{"ru": "Найдите дискриминант уравнения 3x² − 4x + 1 = 0.", "tg": "Дискриминанти муодилаи 3x² − 4x + 1 = 0-ро ёбед.", "en": "Find the discriminant of 3x² − 4x + 1 = 0."},sol:{"ru": "D = b² − 4ac = 16 − 4·3·1 = 16 − 12 = 4.", "tg": "D = b² − 4ac = 16 − 4·3·1 = 16 − 12 = 4.", "en": "D = b² − 4ac = 16 − 4·3·1 = 16 − 12 = 4."}},
{id:'a9',s:'alg',ans:20,q:{"ru": "В арифметической прогрессии a₁ = 2, d = 3. Найдите a₇.", "tg": "Дар прогрессияи арифметикӣ a₁ = 2, d = 3. a₇-ро ёбед.", "en": "In an arithmetic sequence a₁ = 2, d = 3. Find a₇."},sol:{"ru": "a₇ = a₁ + 6d = 2 + 18 = 20.", "tg": "a₇ = a₁ + 6d = 2 + 18 = 20.", "en": "a₇ = a₁ + 6d = 2 + 18 = 20."}},
{id:'a10',s:'alg',ans:55,q:{"ru": "Найдите сумму чисел от 1 до 10.", "tg": "Суммаи рақамҳоро аз 1 то 10 ёбед.", "en": "Find the sum of the numbers from 1 to 10."},sol:{"ru": "S = (1 + 10) · 10 / 2 = 55.", "tg": "S = (1 + 10) · 10 / 2 = 55.", "en": "S = (1 + 10) · 10 / 2 = 55."}},
{id:'a11',s:'alg',ans:54,q:{"ru": "В геометрической прогрессии b₁ = 2, q = 3. Найдите b₄.", "tg": "Дар прогрессияи геометрӣ b₁ = 2, q = 3. b₄-ро ёбед.", "en": "In a geometric sequence b₁ = 2, q = 3. Find b₄."},sol:{"ru": "b₄ = b₁ · q³ = 2 · 27 = 54.", "tg": "b₄ = b₁ · q³ = 2 · 27 = 54.", "en": "b₄ = b₁ · q³ = 2 · 27 = 54."}},
{id:'a12',s:'alg',ans:5,q:{"ru": "Найдите наименьшее целое x, удовлетворяющее неравенству 2x − 3 > 5.", "tg": "Хурдтарин x-и бутунро ёбед, ки нобаробарии 2x − 3 > 5-ро қаноат мекунад.", "en": "Find the smallest integer x satisfying 2x − 3 > 5."},sol:{"ru": "2x > 8, x > 4. Наименьшее целое больше 4 — это 5.", "tg": "2x > 8, x > 4. Хурдтарин бутуни аз 4 калон — 5 аст.", "en": "2x > 8, x > 4. The smallest integer greater than 4 is 5."}},
{id:'a13',s:'alg',ans:7,q:{"ru": "Решите уравнение 3(x − 2) = 2x + 1.", "tg": "Муодилаи 3(x − 2) = 2x + 1-ро ҳал кунед.", "en": "Solve 3(x − 2) = 2x + 1."},sol:{"ru": "3x − 6 = 2x + 1; 3x − 2x = 1 + 6; x = 7.", "tg": "3x − 6 = 2x + 1; 3x − 2x = 1 + 6; x = 7.", "en": "3x − 6 = 2x + 1; 3x − 2x = 1 + 6; x = 7."}},
{id:'a14',s:'alg',ans:49,q:{"ru": "Найдите значение (a + b)² при a = 3, b = 4.", "tg": "Қимати (a + b)²-ро ҳангоми a = 3, b = 4 ёбед.", "en": "Find the value of (a + b)² when a = 3, b = 4."},sol:{"ru": "(3 + 4)² = 7² = 49.", "tg": "(3 + 4)² = 7² = 49.", "en": "(3 + 4)² = 7² = 49."}},
{id:'a15',s:'alg',ans:24,q:{"ru": "Найдите значение (x − 5)(x + 5) при x = 7.", "tg": "Қимати (x − 5)(x + 5)-ро ҳангоми x = 7 ёбед.", "en": "Find the value of (x − 5)(x + 5) when x = 7."},sol:{"ru": "Разность квадратов: x² − 25 = 49 − 25 = 24.", "tg": "Фарқи квадратҳо: x² − 25 = 49 − 25 = 24.", "en": "Difference of squares: x² − 25 = 49 − 25 = 24."}},
{id:'a16',s:'alg',ans:7,q:{"ru": "Функция y = 2x − 5. Найдите y при x = 6.", "tg": "Функсияи y = 2x − 5. y-ро ҳангоми x = 6 ёбед.", "en": "The function is y = 2x − 5. Find y when x = 6."},sol:{"ru": "y = 2·6 − 5 = 12 − 5 = 7.", "tg": "y = 2·6 − 5 = 12 − 5 = 7.", "en": "y = 2·6 − 5 = 12 − 5 = 7."}},
{id:'a17',s:'alg',ans:-2,q:{"ru": "При каком x функция y = 3x + 6 равна нулю?", "tg": "Ҳангоми кадом x функсияи y = 3x + 6 ба сифр баробар мешавад?", "en": "For which x does y = 3x + 6 equal zero?"},sol:{"ru": "3x + 6 = 0; 3x = −6; x = −2.", "tg": "3x + 6 = 0; 3x = −6; x = −2.", "en": "3x + 6 = 0; 3x = −6; x = −2."}},
{id:'a18',s:'alg',ans:3,q:{"ru": "Найдите абсциссу вершины параболы y = x² − 6x + 5.", "tg": "Абсциссаи қуллаи параболаи y = x² − 6x + 5-ро ёбед.", "en": "Find the x-coordinate of the vertex of y = x² − 6x + 5."},sol:{"ru": "x = −b / 2a = 6 / 2 = 3.", "tg": "x = −b / 2a = 6 / 2 = 3.", "en": "x = −b / 2a = 6 / 2 = 3."}},
{id:'a19',s:'alg',ans:81,q:{"ru": "Решите уравнение √x = 9.", "tg": "Муодилаи √x = 9-ро ҳал кунед.", "en": "Solve √x = 9."},sol:{"ru": "Возводим обе части в квадрат: x = 9² = 81.", "tg": "Ҳарду тарафро ба квадрат мебарорем: x = 9² = 81.", "en": "Square both sides: x = 9² = 81."}},
{id:'a20',s:'alg',ans:30,q:{"ru": "Найдите 20% от числа 150.", "tg": "20%-и адади 150-ро ёбед.", "en": "Find 20% of 150."},sol:{"ru": "150 · 20 / 100 = 150 · 0,2 = 30.", "tg": "150 · 20 / 100 = 150 · 0,2 = 30.", "en": "150 · 20 / 100 = 150 · 0.2 = 30."}},
{id:'g3',s:'geo',ans:35,q:{"ru": "Найдите площадь прямоугольника со сторонами 7 и 5.", "tg": "Масоҳати росткунҷаро бо паҳлӯҳои 7 ва 5 ёбед.", "en": "Find the area of a rectangle with sides 7 and 5."},sol:{"ru": "S = a · b = 7 · 5 = 35.", "tg": "S = a · b = 7 · 5 = 35.", "en": "S = a · b = 7 · 5 = 35."}},
{id:'g4',s:'geo',ans:36,q:{"ru": "Найдите периметр квадрата со стороной 9.", "tg": "Периметри квадрат бо паҳлӯи 9-ро ёбед.", "en": "Find the perimeter of a square with side 9."},sol:{"ru": "P = 4a = 4 · 9 = 36.", "tg": "P = 4a = 4 · 9 = 36.", "en": "P = 4a = 4 · 9 = 36."}},
{id:'g5',s:'geo',ans:30,q:{"ru": "Основание треугольника 12, высота к нему 5. Найдите площадь.", "tg": "Асоси секунҷа 12, баландӣ ба он 5. Масоҳатро ёбед.", "en": "A triangle has base 12 and height 5. Find its area."},sol:{"ru": "S = ½ · 12 · 5 = 30.", "tg": "S = ½ · 12 · 5 = 30.", "en": "S = ½ · 12 · 5 = 30."}},
{id:'g6',s:'geo',ans:70,q:{"ru": "Два угла треугольника равны 50° и 60°. Найдите третий угол (в градусах).", "tg": "Ду кунҷи секунҷа 50° ва 60° аст. Кунҷи сеюмро ёбед (бо дараҷа).", "en": "Two angles of a triangle are 50° and 60°. Find the third angle (in degrees)."},sol:{"ru": "180° − 50° − 60° = 70°.", "tg": "180° − 50° − 60° = 70°.", "en": "180° − 50° − 60° = 70°."}},
{id:'g7',s:'geo',ans:13,q:{"ru": "Катеты прямоугольного треугольника 5 и 12. Найдите гипотенузу.", "tg": "Катетҳои секунҷаи росткунҷа 5 ва 12 аст. Гипотенузаро ёбед.", "en": "The legs of a right triangle are 5 and 12. Find the hypotenuse."},sol:{"ru": "c² = 25 + 144 = 169; c = 13.", "tg": "c² = 25 + 144 = 169; c = 13.", "en": "c² = 25 + 144 = 169; c = 13."}},
{id:'g8',s:'geo',ans:28.26,q:{"ru": "Найдите площадь круга радиуса 3 (π = 3,14).", "tg": "Масоҳати доираи радиусаш 3-ро ёбед (π = 3,14).", "en": "Find the area of a circle of radius 3 (π = 3.14)."},sol:{"ru": "S = πr² = 3,14 · 9 = 28,26.", "tg": "S = πr² = 3,14 · 9 = 28,26.", "en": "S = πr² = 3.14 · 9 = 28.26."}},
{id:'g9',s:'geo',ans:62.8,q:{"ru": "Найдите длину окружности радиуса 10 (π = 3,14).", "tg": "Дарозии давраи радиусаш 10-ро ёбед (π = 3,14).", "en": "Find the circumference of a circle of radius 10 (π = 3.14)."},sol:{"ru": "C = 2πr = 2 · 3,14 · 10 = 62,8.", "tg": "C = 2πr = 2 · 3,14 · 10 = 62,8.", "en": "C = 2πr = 2 · 3.14 · 10 = 62.8."}},
{id:'g10',s:'geo',ans:64,q:{"ru": "Найдите объём куба с ребром 4.", "tg": "Ҳаҷми куби қабурғааш 4-ро ёбед.", "en": "Find the volume of a cube with edge 4."},sol:{"ru": "V = a³ = 4³ = 64.", "tg": "V = a³ = 4³ = 64.", "en": "V = a³ = 4³ = 64."}},
{id:'g11',s:'geo',ans:60,q:{"ru": "Найдите объём прямоугольного параллелепипеда с измерениями 3, 4 и 5.", "tg": "Ҳаҷми параллелепипеди росткунҷаро бо андозаҳои 3, 4 ва 5 ёбед.", "en": "Find the volume of a cuboid with dimensions 3, 4 and 5."},sol:{"ru": "V = 3 · 4 · 5 = 60.", "tg": "V = 3 · 4 · 5 = 60.", "en": "V = 3 · 4 · 5 = 60."}},
{id:'g12',s:'geo',ans:32,q:{"ru": "Основания трапеции 6 и 10, высота 4. Найдите площадь.", "tg": "Асосҳои трапесия 6 ва 10, баландӣ 4. Масоҳатро ёбед.", "en": "A trapezoid has bases 6 and 10 and height 4. Find its area."},sol:{"ru": "S = (6 + 10) / 2 · 4 = 8 · 4 = 32.", "tg": "S = (6 + 10) / 2 · 4 = 8 · 4 = 32.", "en": "S = (6 + 10) / 2 · 4 = 8 · 4 = 32."}},
{id:'g13',s:'geo',ans:540,q:{"ru": "Чему равна сумма углов выпуклого пятиугольника (в градусах)?", "tg": "Суммаи кунҷҳои панҷкунҷаи барҷаста чанд дараҷа аст?", "en": "What is the sum of the interior angles of a convex pentagon, in degrees?"},sol:{"ru": "(5 − 2) · 180° = 3 · 180° = 540°.", "tg": "(5 − 2) · 180° = 3 · 180° = 540°.", "en": "(5 − 2) · 180° = 3 · 180° = 540°."}},
{id:'g14',s:'geo',ans:14,q:{"ru": "Радиус круга 7. Чему равен его диаметр?", "tg": "Радиуси доира 7 аст. Диаметри он чанд аст?", "en": "The radius of a circle is 7. What is its diameter?"},sol:{"ru": "d = 2r = 14.", "tg": "d = 2r = 14.", "en": "d = 2r = 14."}},
{id:'g15',s:'geo',ans:70,q:{"ru": "В равнобедренном треугольнике угол при вершине 40°. Найдите угол при основании (в градусах).", "tg": "Дар секунҷаи баробарпаҳлӯ кунҷи қулла 40° аст. Кунҷи наздиасосро ёбед (бо дараҷа).", "en": "In an isosceles triangle the apex angle is 40°. Find a base angle (in degrees)."},sol:{"ru": "Углы при основании равны: (180° − 40°) / 2 = 70°.", "tg": "Кунҷҳои наздиасос баробаранд: (180° − 40°) / 2 = 70°.", "en": "The base angles are equal: (180° − 40°) / 2 = 70°."}},
{id:'g16',s:'geo',ans:36,q:{"ru": "Основание параллелограмма 9, высота 4. Найдите площадь.", "tg": "Асоси параллелограмм 9, баландӣ 4. Масоҳатро ёбед.", "en": "A parallelogram has base 9 and height 4. Find its area."},sol:{"ru": "S = a · h = 9 · 4 = 36.", "tg": "S = a · h = 9 · 4 = 36.", "en": "S = a · h = 9 · 4 = 36."}},
{id:'g17',s:'geo',ans:15,q:{"ru": "Катеты прямоугольного треугольника 9 и 12. Найдите гипотенузу.", "tg": "Катетҳои секунҷаи росткунҷа 9 ва 12 аст. Гипотенузаро ёбед.", "en": "The legs of a right triangle are 9 and 12. Find the hypotenuse."},sol:{"ru": "c² = 81 + 144 = 225; c = 15.", "tg": "c² = 81 + 144 = 225; c = 15.", "en": "c² = 81 + 144 = 225; c = 15."}},
{id:'g18',s:'geo',ans:62.8,q:{"ru": "Найдите объём цилиндра с радиусом 2 и высотой 5 (π = 3,14).", "tg": "Ҳаҷми силиндрро бо радиуси 2 ва баландии 5 ёбед (π = 3,14).", "en": "Find the volume of a cylinder with radius 2 and height 5 (π = 3.14)."},sol:{"ru": "V = πr²h = 3,14 · 4 · 5 = 62,8.", "tg": "V = πr²h = 3,14 · 4 · 5 = 62,8.", "en": "V = πr²h = 3.14 · 4 · 5 = 62.8."}},
{id:'g19',s:'geo',ans:5,q:{"ru": "Найдите длину вектора a = (3; 4).", "tg": "Дарозии вектори a = (3; 4)-ро ёбед.", "en": "Find the length of the vector a = (3; 4)."},sol:{"ru": "|a| = √(3² + 4²) = √25 = 5.", "tg": "|a| = √(3² + 4²) = √25 = 5.", "en": "|a| = √(3² + 4²) = √25 = 5."}},
{id:'g20',s:'geo',ans:5,q:{"ru": "Найдите скалярное произведение векторов (2; 3) и (4; −1).", "tg": "Зарби скалярии векторҳои (2; 3) ва (4; −1)-ро ёбед.", "en": "Find the dot product of the vectors (2; 3) and (4; −1)."},sol:{"ru": "2·4 + 3·(−1) = 8 − 3 = 5.", "tg": "2·4 + 3·(−1) = 8 − 3 = 5.", "en": "2·4 + 3·(−1) = 8 − 3 = 5."}},
{id:'p3',s:'phy',ans:60,q:{"ru": "Поезд прошёл 120 км за 2 часа. Найдите скорость (км/ч).", "tg": "Қатора 120 км-ро дар 2 соат тай кард. Суръатро ёбед (км/соат).", "en": "A train covered 120 km in 2 hours. Find its speed (km/h)."},sol:{"ru": "v = s / t = 120 / 2 = 60 км/ч.", "tg": "v = s / t = 120 / 2 = 60 км/соат.", "en": "v = s / t = 120 / 2 = 60 km/h."}},
{id:'p4',s:'phy',ans:50,q:{"ru": "Найдите силу тяжести, действующую на тело массой 5 кг (g = 10 м/с²). Ответ в ньютонах.", "tg": "Қувваи вазнинии ба ҷисми массааш 5 кг таъсиркунандаро ёбед (g = 10 м/с²). Ҷавоб бо ньютон.", "en": "Find the weight (force of gravity) of a 5 kg body (g = 10 m/s²). Answer in newtons."},sol:{"ru": "F = m · g = 5 · 10 = 50 Н.", "tg": "F = m · g = 5 · 10 = 50 Н.", "en": "F = m · g = 5 · 10 = 50 N."}},
{id:'p5',s:'phy',ans:4,q:{"ru": "Напряжение 24 В, сопротивление 6 Ом. Найдите силу тока (А).", "tg": "Шиддат 24 В, муқовимат 6 Ом. Қувваи ҷараёнро ёбед (А).", "en": "The voltage is 24 V and the resistance is 6 Ω. Find the current (A)."},sol:{"ru": "I = U / R = 24 / 6 = 4 А.", "tg": "I = U / R = 24 / 6 = 4 А.", "en": "I = U / R = 24 / 6 = 4 A."}},
{id:'p6',s:'phy',ans:60,q:{"ru": "Сила 15 Н перемещает тело на 4 м. Найдите работу (Дж).", "tg": "Қувваи 15 Н ҷисмро 4 м ҷойивазкунонӣ мекунад. Корро ёбед (Ҷ).", "en": "A force of 15 N moves a body 4 m. Find the work (J)."},sol:{"ru": "A = F · s = 15 · 4 = 60 Дж.", "tg": "A = F · s = 15 · 4 = 60 Ҷ.", "en": "A = F · s = 15 · 4 = 60 J."}},
{id:'p7',s:'phy',ans:30,q:{"ru": "Работа 600 Дж совершена за 20 с. Найдите мощность (Вт).", "tg": "Кори 600 Ҷ дар 20 сония иҷро шуд. Иқтидорро ёбед (Вт).", "en": "A work of 600 J is done in 20 s. Find the power (W)."},sol:{"ru": "P = A / t = 600 / 20 = 30 Вт.", "tg": "P = A / t = 600 / 20 = 30 Вт.", "en": "P = A / t = 600 / 20 = 30 W."}},
{id:'p8',s:'phy',ans:50,q:{"ru": "Масса тела 4 кг, скорость 5 м/с. Найдите кинетическую энергию (Дж).", "tg": "Массаи ҷисм 4 кг, суръат 5 м/с. Энергияи кинетикиро ёбед (Ҷ).", "en": "A body has mass 4 kg and speed 5 m/s. Find its kinetic energy (J)."},sol:{"ru": "E = m·v² / 2 = 4 · 25 / 2 = 50 Дж.", "tg": "E = m·v² / 2 = 4 · 25 / 2 = 50 Ҷ.", "en": "E = m·v² / 2 = 4 · 25 / 2 = 50 J."}},
{id:'p9',s:'phy',ans:84000,q:{"ru": "Сколько теплоты нужно, чтобы нагреть 2 кг воды на 10 °C? c = 4200 Дж/(кг·°C). Ответ в джоулях.", "tg": "Барои 2 кг обро 10 °C гарм кардан чӣ қадар гармӣ лозим аст? c = 4200 Ҷ/(кг·°C). Ҷавоб бо ҷоул.", "en": "How much heat is needed to warm 2 kg of water by 10 °C? c = 4200 J/(kg·°C). Answer in joules."},sol:{"ru": "Q = c · m · Δt = 4200 · 2 · 10 = 84 000 Дж.", "tg": "Q = c · m · Δt = 4200 · 2 · 10 = 84 000 Ҷ.", "en": "Q = c · m · Δt = 4200 · 2 · 10 = 84,000 J."}},
{id:'p10',s:'phy',ans:10,q:{"ru": "Два резистора 4 Ом и 6 Ом соединены последовательно. Найдите общее сопротивление (Ом).", "tg": "Ду резистори 4 Ом ва 6 Ом пайдарпай пайваст шудаанд. Муқовимати умумиро ёбед (Ом).", "en": "Two resistors of 4 Ω and 6 Ω are connected in series. Find the total resistance (Ω)."},sol:{"ru": "R = R₁ + R₂ = 4 + 6 = 10 Ом.", "tg": "R = R₁ + R₂ = 4 + 6 = 10 Ом.", "en": "R = R₁ + R₂ = 4 + 6 = 10 Ω."}},
{id:'p11',s:'phy',ans:2,q:{"ru": "Два резистора 6 Ом и 3 Ом соединены параллельно. Найдите общее сопротивление (Ом).", "tg": "Ду резистори 6 Ом ва 3 Ом мувозӣ пайваст шудаанд. Муқовимати умумиро ёбед (Ом).", "en": "Two resistors of 6 Ω and 3 Ω are connected in parallel. Find the total resistance (Ω)."},sol:{"ru": "1/R = 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2, значит R = 2 Ом.", "tg": "1/R = 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2, пас R = 2 Ом.", "en": "1/R = 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2, so R = 2 Ω."}},
{id:'p12',s:'phy',ans:50,q:{"ru": "Сила 200 Н действует на площадь 4 м². Найдите давление (Па).", "tg": "Қувваи 200 Н ба масоҳати 4 м² таъсир мекунад. Фишорро ёбед (Па).", "en": "A force of 200 N acts on an area of 4 m². Find the pressure (Pa)."},sol:{"ru": "p = F / S = 200 / 4 = 50 Па.", "tg": "p = F / S = 200 / 4 = 50 Па.", "en": "p = F / S = 200 / 4 = 50 Pa."}},
{id:'p13',s:'phy',ans:0.2,q:{"ru": "Частота колебаний 5 Гц. Найдите период (с).", "tg": "Басомади ларзиш 5 Гс. Даврро ёбед (с).", "en": "The oscillation frequency is 5 Hz. Find the period (s)."},sol:{"ru": "T = 1 / ν = 1 / 5 = 0,2 с.", "tg": "T = 1 / ν = 1 / 5 = 0,2 с.", "en": "T = 1 / ν = 1 / 5 = 0.2 s."}},
{id:'p14',s:'phy',ans:2,q:{"ru": "Скорость звука 340 м/с, частота 170 Гц. Найдите длину волны (м).", "tg": "Суръати садо 340 м/с, басомад 170 Гс. Дарозии мавҷро ёбед (м).", "en": "The speed of sound is 340 m/s and the frequency is 170 Hz. Find the wavelength (m)."},sol:{"ru": "λ = v / ν = 340 / 170 = 2 м.", "tg": "λ = v / ν = 340 / 170 = 2 м.", "en": "λ = v / ν = 340 / 170 = 2 m."}},
{id:'p15',s:'phy',ans:2,q:{"ru": "Масса тела 500 г, объём 250 см³. Найдите плотность (г/см³).", "tg": "Массаи ҷисм 500 г, ҳаҷм 250 см³. Зичиро ёбед (г/см³).", "en": "A body has mass 500 g and volume 250 cm³. Find its density (g/cm³)."},sol:{"ru": "ρ = m / V = 500 / 250 = 2 г/см³.", "tg": "ρ = m / V = 500 / 250 = 2 г/см³.", "en": "ρ = m / V = 500 / 250 = 2 g/cm³."}},
{id:'p16',s:'phy',ans:5,q:{"ru": "Тело разгоняется от 0 до 20 м/с за 4 с. Найдите ускорение (м/с²).", "tg": "Ҷисм аз 0 то 20 м/с дар 4 сония тез мешавад. Шитобро ёбед (м/с²).", "en": "A body speeds up from 0 to 20 m/s in 4 s. Find the acceleration (m/s²)."},sol:{"ru": "a = Δv / t = 20 / 4 = 5 м/с².", "tg": "a = Δv / t = 20 / 4 = 5 м/с².", "en": "a = Δv / t = 20 / 4 = 5 m/s²."}},
{id:'p17',s:'phy',ans:440,q:{"ru": "Напряжение 220 В, сила тока 2 А. Найдите мощность (Вт).", "tg": "Шиддат 220 В, қувваи ҷараён 2 А. Иқтидорро ёбед (Вт).", "en": "The voltage is 220 V and the current is 2 A. Find the power (W)."},sol:{"ru": "P = U · I = 220 · 2 = 440 Вт.", "tg": "P = U · I = 220 · 2 = 440 Вт.", "en": "P = U · I = 220 · 2 = 440 W."}},
{id:'p18',s:'phy',ans:150,q:{"ru": "Тело массой 3 кг поднято на высоту 5 м (g = 10 м/с²). Найдите потенциальную энергию (Дж).", "tg": "Ҷисми массааш 3 кг ба баландии 5 м бардошта шуд (g = 10 м/с²). Энергияи потенсиалиро ёбед (Ҷ).", "en": "A 3 kg body is lifted to a height of 5 m (g = 10 m/s²). Find its potential energy (J)."},sol:{"ru": "E = m · g · h = 3 · 10 · 5 = 150 Дж.", "tg": "E = m · g · h = 3 · 10 · 5 = 150 Ҷ.", "en": "E = m · g · h = 3 · 10 · 5 = 150 J."}},
{id:'p19',s:'phy',ans:14,q:{"ru": "Масса тела 2 кг, скорость 7 м/с. Найдите импульс (кг·м/с).", "tg": "Массаи ҷисм 2 кг, суръат 7 м/с. Импулсро ёбед (кг·м/с).", "en": "A body has mass 2 kg and speed 7 m/s. Find its momentum (kg·m/s)."},sol:{"ru": "p = m · v = 2 · 7 = 14 кг·м/с.", "tg": "p = m · v = 2 · 7 = 14 кг·м/с.", "en": "p = m · v = 2 · 7 = 14 kg·m/s."}},
{id:'p20',s:'phy',ans:60,q:{"ru": "Тело движется равномерно со скоростью 12 м/с. Какой путь оно пройдёт за 5 с (м)?", "tg": "Ҷисм якхела бо суръати 12 м/с ҳаракат мекунад. Дар 5 сония чӣ қадар роҳ мепаймояд (м)?", "en": "A body moves uniformly at 12 m/s. How far does it travel in 5 s (m)?"},sol:{"ru": "s = v · t = 12 · 5 = 60 м.", "tg": "s = v · t = 12 · 5 = 60 м.", "en": "s = v · t = 12 · 5 = 60 m."}},
{id:'c3',s:'che',ans:44,q:{"ru": "Найдите молярную массу CO₂ (г/моль). Ar(C) = 12, Ar(O) = 16.", "tg": "Массаи молярии CO₂-ро ёбед (г/мол). Ar(C) = 12, Ar(O) = 16.", "en": "Find the molar mass of CO₂ (g/mol). Ar(C) = 12, Ar(O) = 16."},sol:{"ru": "M = 12 + 2 · 16 = 44 г/моль.", "tg": "M = 12 + 2 · 16 = 44 г/мол.", "en": "M = 12 + 2 · 16 = 44 g/mol."}},
{id:'c4',s:'che',ans:58.5,q:{"ru": "Найдите молярную массу NaCl (г/моль). Ar(Na) = 23, Ar(Cl) = 35,5.", "tg": "Массаи молярии NaCl-ро ёбед (г/мол). Ar(Na) = 23, Ar(Cl) = 35,5.", "en": "Find the molar mass of NaCl (g/mol). Ar(Na) = 23, Ar(Cl) = 35.5."},sol:{"ru": "M = 23 + 35,5 = 58,5 г/моль.", "tg": "M = 23 + 35,5 = 58,5 г/мол.", "en": "M = 23 + 35.5 = 58.5 g/mol."}},
{id:'c5',s:'che',ans:2,q:{"ru": "Сколько моль содержится в 88 г CO₂? (M = 44 г/моль)", "tg": "Дар 88 г CO₂ чанд мол ҳаст? (M = 44 г/мол)", "en": "How many moles are in 88 g of CO₂? (M = 44 g/mol)"},sol:{"ru": "n = m / M = 88 / 44 = 2 моль.", "tg": "n = m / M = 88 / 44 = 2 мол.", "en": "n = m / M = 88 / 44 = 2 mol."}},
{id:'c6',s:'che',ans:54,q:{"ru": "Найдите массу 3 моль воды (г). M(H₂O) = 18 г/моль.", "tg": "Массаи 3 мол обро ёбед (г). M(H₂O) = 18 г/мол.", "en": "Find the mass of 3 mol of water (g). M(H₂O) = 18 g/mol."},sol:{"ru": "m = n · M = 3 · 18 = 54 г.", "tg": "m = n · M = 3 · 18 = 54 г.", "en": "m = n · M = 3 · 18 = 54 g."}},
{id:'c7',s:'che',ans:12,q:{"ru": "Сколько нейтронов в атоме ²³Na? (порядковый номер 11)", "tg": "Дар атоми ²³Na чандто нейтрон ҳаст? (рақами тартибӣ 11)", "en": "How many neutrons are in an atom of ²³Na? (atomic number 11)"},sol:{"ru": "Нейтроны = массовое число − число протонов = 23 − 11 = 12.", "tg": "Нейтронҳо = рақами массавӣ − шумораи протонҳо = 23 − 11 = 12.", "en": "Neutrons = mass number − protons = 23 − 11 = 12."}},
{id:'c8',s:'che',ans:10,q:{"ru": "В 180 г воды растворили 20 г соли. Найдите массовую долю соли (%).", "tg": "Дар 180 г об 20 г намак ҳал карданд. Ҳиссаи массавии намакро ёбед (%).", "en": "20 g of salt is dissolved in 180 g of water. Find the mass fraction of salt (%)."},sol:{"ru": "m(раствора) = 180 + 20 = 200 г; ω = 20 / 200 · 100% = 10%.", "tg": "m(маҳлул) = 180 + 20 = 200 г; ω = 20 / 200 · 100% = 10%.", "en": "m(solution) = 180 + 20 = 200 g; ω = 20 / 200 · 100% = 10%."}},
{id:'c9',s:'che',ans:18,q:{"ru": "Сколько электронов у иона Cl⁻? (порядковый номер хлора 17)", "tg": "Дар иони Cl⁻ чандто электрон ҳаст? (рақами тартибии хлор 17)", "en": "How many electrons does the Cl⁻ ion have? (atomic number of chlorine is 17)"},sol:{"ru": "У атома 17 электронов, анион получил ещё один: 17 + 1 = 18.", "tg": "Атом 17 электрон дорад, анион боз як электрон гирифт: 17 + 1 = 18.", "en": "The atom has 17 electrons and the anion gained one more: 17 + 1 = 18."}},
{id:'c10',s:'che',ans:4,q:{"ru": "Концентрация ионов водорода [H⁺] = 10⁻⁴ моль/л. Найдите pH.", "tg": "Консентратсияи ионҳои гидроген [H⁺] = 10⁻⁴ мол/л. pH-ро ёбед.", "en": "The hydrogen ion concentration is [H⁺] = 10⁻⁴ mol/L. Find the pH."},sol:{"ru": "pH = −lg[H⁺] = −lg 10⁻⁴ = 4.", "tg": "pH = −lg[H⁺] = −lg 10⁻⁴ = 4.", "en": "pH = −lg[H⁺] = −lg 10⁻⁴ = 4."}},
{id:'c11',s:'che',ans:64,q:{"ru": "Найдите массу 2 моль кислорода O₂ (г). M(O₂) = 32 г/моль.", "tg": "Массаи 2 мол оксиген O₂-ро ёбед (г). M(O₂) = 32 г/мол.", "en": "Find the mass of 2 mol of oxygen O₂ (g). M(O₂) = 32 g/mol."},sol:{"ru": "m = n · M = 2 · 32 = 64 г.", "tg": "m = n · M = 2 · 32 = 64 г.", "en": "m = n · M = 2 · 32 = 64 g."}},
{id:'c12',s:'che',ans:7,q:{"ru": "Сколько атомов всего содержится в одной молекуле H₂SO₄?", "tg": "Дар як молекулаи H₂SO₄ ҳамагӣ чандто атом ҳаст?", "en": "How many atoms are in one molecule of H₂SO₄ in total?"},sol:{"ru": "H₂ — 2 атома, S — 1, O₄ — 4 атома: 2 + 1 + 4 = 7.", "tg": "H₂ — 2 атом, S — 1, O₄ — 4 атом: 2 + 1 + 4 = 7.", "en": "H₂ — 2 atoms, S — 1, O₄ — 4 atoms: 2 + 1 + 4 = 7."}},
{id:'c13',s:'che',ans:3,q:{"ru": "По уравнению 2Mg + O₂ → 2MgO из 3 моль Mg получится сколько моль MgO?", "tg": "Мувофиқи муодилаи 2Mg + O₂ → 2MgO аз 3 мол Mg чанд мол MgO ҳосил мешавад?", "en": "By the equation 2Mg + O₂ → 2MgO, how many moles of MgO form from 3 mol of Mg?"},sol:{"ru": "Коэффициенты Mg и MgO равны (2 : 2), поэтому 3 моль Mg дают 3 моль MgO.", "tg": "Коэффисиентҳои Mg ва MgO баробаранд (2 : 2), бинобар ин 3 мол Mg 3 мол MgO медиҳад.", "en": "The coefficients of Mg and MgO are equal (2 : 2), so 3 mol of Mg gives 3 mol of MgO."}},
{id:'c14',s:'che',ans:44.8,q:{"ru": "Какой объём (л) занимают 2 моль газа при нормальных условиях? (Vm = 22,4 л/моль)", "tg": "2 мол газ дар шароити муқаррарӣ чанд литр ҳаҷм мегирад? (Vm = 22,4 л/мол)", "en": "What volume (L) do 2 mol of gas occupy at standard conditions? (Vm = 22.4 L/mol)"},sol:{"ru": "V = n · Vm = 2 · 22,4 = 44,8 л.", "tg": "V = n · Vm = 2 · 22,4 = 44,8 л.", "en": "V = n · Vm = 2 · 22.4 = 44.8 L."}},
{id:'c15',s:'che',ans:98,q:{"ru": "Найдите молярную массу H₂SO₄ (г/моль). Ar(H) = 1, Ar(S) = 32, Ar(O) = 16.", "tg": "Массаи молярии H₂SO₄-ро ёбед (г/мол). Ar(H) = 1, Ar(S) = 32, Ar(O) = 16.", "en": "Find the molar mass of H₂SO₄ (g/mol). Ar(H) = 1, Ar(S) = 32, Ar(O) = 16."},sol:{"ru": "M = 2 · 1 + 32 + 4 · 16 = 2 + 32 + 64 = 98 г/моль.", "tg": "M = 2 · 1 + 32 + 4 · 16 = 2 + 32 + 64 = 98 г/мол.", "en": "M = 2 · 1 + 32 + 4 · 16 = 2 + 32 + 64 = 98 g/mol."}},
{id:'c16',s:'che',ans:10,q:{"ru": "Сколько граммов соли нужно для 200 г раствора с массовой долей соли 5%?", "tg": "Барои 200 г маҳлул бо ҳиссаи массавии намак 5% чанд грамм намак лозим аст?", "en": "How many grams of salt are needed for 200 g of solution with a 5% salt mass fraction?"},sol:{"ru": "m(соли) = 200 · 5 / 100 = 10 г.", "tg": "m(намак) = 200 · 5 / 100 = 10 г.", "en": "m(salt) = 200 · 5 / 100 = 10 g."}},
{id:'c17',s:'che',ans:36,q:{"ru": "Сколько граммов воды образуется при сгорании 4 г водорода? 2H₂ + O₂ → 2H₂O (M(H₂) = 2, M(H₂O) = 18)", "tg": "Ҳангоми сӯхтани 4 г гидроген чанд грамм об ҳосил мешавад? 2H₂ + O₂ → 2H₂O (M(H₂) = 2, M(H₂O) = 18)", "en": "How many grams of water form when 4 g of hydrogen burn? 2H₂ + O₂ → 2H₂O (M(H₂) = 2, M(H₂O) = 18)"},sol:{"ru": "n(H₂) = 4 / 2 = 2 моль. По уравнению воды столько же: 2 моль. m = 2 · 18 = 36 г.", "tg": "n(H₂) = 4 / 2 = 2 мол. Мувофиқи муодила об ҳамон қадар: 2 мол. m = 2 · 18 = 36 г.", "en": "n(H₂) = 4 / 2 = 2 mol. By the equation water is the same: 2 mol. m = 2 · 18 = 36 g."}},
{id:'c18',s:'che',ans:7,q:{"ru": "Сколько электронов на внешнем уровне у атома хлора (элемент VII группы)?", "tg": "Дар сатҳи берунии атоми хлор (унсури гурӯҳи VII) чандто электрон ҳаст?", "en": "How many electrons are on the outer level of a chlorine atom (a group VII element)?"},sol:{"ru": "Номер группы совпадает с числом внешних электронов: 7.", "tg": "Рақами гурӯҳ бо шумораи электронҳои берунӣ мувофиқ аст: 7.", "en": "The group number equals the number of outer electrons: 7."}},
{id:'c19',s:'che',ans:25,q:{"ru": "Найдите массу 0,25 моль CaCO₃ (г). M(CaCO₃) = 100 г/моль.", "tg": "Массаи 0,25 мол CaCO₃-ро ёбед (г). M(CaCO₃) = 100 г/мол.", "en": "Find the mass of 0.25 mol of CaCO₃ (g). M(CaCO₃) = 100 g/mol."},sol:{"ru": "m = n · M = 0,25 · 100 = 25 г.", "tg": "m = n · M = 0,25 · 100 = 25 г.", "en": "m = n · M = 0.25 · 100 = 25 g."}},
{id:'c20',s:'che',ans:0.25,q:{"ru": "Сколько моль газа содержится в 5,6 л при нормальных условиях? (Vm = 22,4 л/моль)", "tg": "Дар 5,6 л газ дар шароити муқаррарӣ чанд мол ҳаст? (Vm = 22,4 л/мол)", "en": "How many moles of gas are in 5.6 L at standard conditions? (Vm = 22.4 L/mol)"},sol:{"ru": "n = V / Vm = 5,6 / 22,4 = 0,25 моль.", "tg": "n = V / Vm = 5,6 / 22,4 = 0,25 мол.", "en": "n = V / Vm = 5.6 / 22.4 = 0.25 mol."}},
{id:'b3',s:'bio',ans:30,q:{"ru": "В молекуле ДНК тимина 20%. Сколько процентов цитозина?", "tg": "Дар молекулаи ДНК тимин 20% аст. Цитозин чанд фоиз аст?", "en": "In a DNA molecule thymine is 20%. What percent is cytosine?"},sol:{"ru": "T = A = 20%, A + T = 40%; G = C = (100 − 40) / 2 = 30%.", "tg": "T = A = 20%, A + T = 40%; G = C = (100 − 40) / 2 = 30%.", "en": "T = A = 20%, A + T = 40%; G = C = (100 − 40) / 2 = 30%."}},
{id:'b4',s:'bio',ans:46,q:{"ru": "Сколько хромосом в оплодотворённой яйцеклетке (зиготе) человека?", "tg": "Дар тухмҳуҷайраи бордоршудаи (зигота) инсон чандто хромосома ҳаст?", "en": "How many chromosomes are in a human zygote?"},sol:{"ru": "Яйцеклетка (23) + сперматозоид (23) = 46.", "tg": "Тухмҳуҷайра (23) + сперматозоид (23) = 46.", "en": "Egg (23) + sperm (23) = 46."}},
{id:'b5',s:'bio',ans:4,q:{"ru": "Сколько аминокислот кодируют 12 нуклеотидов? (один триплет = 3 нуклеотида = 1 аминокислота)", "tg": "12 нуклеотид чандто аминокислотаро рамзгузорӣ мекунад? (як триплет = 3 нуклеотид = 1 аминокислота)", "en": "How many amino acids do 12 nucleotides code for? (one triplet = 3 nucleotides = 1 amino acid)"},sol:{"ru": "12 : 3 = 4 аминокислоты.", "tg": "12 : 3 = 4 аминокислота.", "en": "12 : 3 = 4 amino acids."}},
{id:'b6',s:'bio',ans:300,q:{"ru": "Белок состоит из 100 аминокислот. Сколько нуклеотидов в кодирующей его части гена?", "tg": "Сафеда аз 100 аминокислота иборат аст. Дар қисми генӣ, ки онро рамзгузорӣ мекунад, чандто нуклеотид ҳаст?", "en": "A protein has 100 amino acids. How many nucleotides are in the coding part of its gene?"},sol:{"ru": "Каждую аминокислоту кодирует триплет: 100 · 3 = 300 нуклеотидов.", "tg": "Ҳар аминокислотаро триплет рамзгузорӣ мекунад: 100 · 3 = 300 нуклеотид.", "en": "Each amino acid is coded by a triplet: 100 · 3 = 300 nucleotides."}},
{id:'b7',s:'bio',ans:75,q:{"ru": "Скрещивают двух гетерозигот Aa × Aa. Сколько процентов потомков проявят доминантный признак?", "tg": "Ду гетерозигота Aa × Aa-ро чатиш медиҳанд. Чанд фоизи насл аломати доминантӣ нишон медиҳад?", "en": "Two heterozygotes Aa × Aa are crossed. What percent of offspring show the dominant trait?"},sol:{"ru": "Потомки: 25% AA, 50% Aa, 25% aa. Доминантный признак у AA и Aa: 25 + 50 = 75%.", "tg": "Насл: 25% AA, 50% Aa, 25% aa. Аломати доминантӣ дар AA ва Aa: 25 + 50 = 75%.", "en": "Offspring: 25% AA, 50% Aa, 25% aa. The dominant trait shows in AA and Aa: 25 + 50 = 75%."}},
{id:'b8',s:'bio',ans:4,q:{"ru": "Сколько типов гамет образует организм с генотипом AaBb?", "tg": "Организм бо генотипи AaBb чанд намуди гамета ҳосил мекунад?", "en": "How many types of gametes does an organism with genotype AaBb form?"},sol:{"ru": "AB, Ab, aB, ab — всего 2 · 2 = 4 типа.", "tg": "AB, Ab, aB, ab — ҳамагӣ 2 · 2 = 4 намуд.", "en": "AB, Ab, aB, ab — in total 2 · 2 = 4 types."}},
{id:'b9',s:'bio',ans:18,q:{"ru": "Сколько моль кислорода выделится при фотосинтезе, если образовалось 3 моль глюкозы? 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂", "tg": "Агар ҳангоми фотосинтез 3 мол глюкоза ҳосил шуда бошад, чанд мол оксиген ҷудо мешавад? 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂", "en": "How many moles of oxygen are released in photosynthesis if 3 mol of glucose formed? 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂"},sol:{"ru": "На 1 моль глюкозы приходится 6 моль O₂: 3 · 6 = 18 моль.", "tg": "Ба 1 мол глюкоза 6 мол O₂ рост меояд: 3 · 6 = 18 мол.", "en": "For 1 mol of glucose there are 6 mol of O₂: 3 · 6 = 18 mol."}},
{id:'b10',s:'bio',ans:4,q:{"ru": "Сколько камер в сердце человека?", "tg": "Дар дили инсон чандто ҳуҷра ҳаст?", "en": "How many chambers does the human heart have?"},sol:{"ru": "Два предсердия и два желудочка: 2 + 2 = 4.", "tg": "Ду бонӯча ва ду меъдача: 2 + 2 = 4.", "en": "Two atria and two ventricles: 2 + 2 = 4."}},
{id:'b11',s:'bio',ans:23,q:{"ru": "Сколько пар хромосом у человека?", "tg": "Дар инсон чанд ҷуфти хромосома ҳаст?", "en": "How many pairs of chromosomes does a human have?"},sol:{"ru": "46 хромосом образуют 46 : 2 = 23 пары.", "tg": "46 хромосома 46 : 2 = 23 ҷуфт месозад.", "en": "46 chromosomes form 46 : 2 = 23 pairs."}},
{id:'b12',s:'bio',ans:10,q:{"ru": "При гликолизе одна молекула глюкозы даёт 2 АТФ. Сколько АТФ даст 5 молекул глюкозы?", "tg": "Ҳангоми гликолиз як молекулаи глюкоза 2 АТФ медиҳад. 5 молекулаи глюкоза чанд АТФ медиҳад?", "en": "In glycolysis one glucose molecule gives 2 ATP. How many ATP do 5 glucose molecules give?"},sol:{"ru": "5 · 2 = 10 АТФ.", "tg": "5 · 2 = 10 АТФ.", "en": "5 · 2 = 10 ATP."}},
{id:'b13',s:'bio',ans:100,q:{"ru": "Продуценты накопили 10 000 кДж энергии. По правилу 10% сколько энергии получит консумент второго порядка (кДж)?", "tg": "Продуссентҳо 10 000 кДж энергия ҷамъ карданд. Аз рӯи қоидаи 10% консументи тартиби дуюм чанд кДж энергия мегирад?", "en": "Producers stored 10,000 kJ of energy. By the 10% rule, how much energy does a second-order consumer get (kJ)?"},sol:{"ru": "Консумент 1-го порядка: 10 000 · 10% = 1000 кДж; 2-го порядка: 1000 · 10% = 100 кДж.", "tg": "Консументи тартиби 1: 10 000 · 10% = 1000 кДж; тартиби 2: 1000 · 10% = 100 кДж.", "en": "First-order consumer: 10,000 · 10% = 1000 kJ; second-order: 1000 · 10% = 100 kJ."}},
{id:'b14',s:'bio',ans:3.4,q:{"ru": "Расстояние между соседними нуклеотидами в ДНК 0,34 нм. Какова длина участка из 10 нуклеотидных пар (нм)?", "tg": "Масофа байни нуклеотидҳои ҳамсоя дар ДНК 0,34 нм аст. Дарозии қисме аз 10 ҷуфти нуклеотид чанд нм аст?", "en": "The distance between neighbouring nucleotides in DNA is 0.34 nm. What is the length of a stretch of 10 nucleotide pairs (nm)?"},sol:{"ru": "10 · 0,34 = 3,4 нм.", "tg": "10 · 0,34 = 3,4 нм.", "en": "10 · 0.34 = 3.4 nm."}},
{id:'b15',s:'bio',ans:32,q:{"ru": "Сколько зубов у взрослого человека?", "tg": "Дар шахси калонсол чандто дандон ҳаст?", "en": "How many teeth does an adult human have?"},sol:{"ru": "Верхняя и нижняя челюсти по 16 зубов: 16 + 16 = 32.", "tg": "Ҷоғи боло ва поён ҳар кадом 16 дандон: 16 + 16 = 32.", "en": "The upper and lower jaws have 16 teeth each: 16 + 16 = 32."}},
{id:'b16',s:'bio',ans:8,q:{"ru": "В соматической клетке 2n = 8. Сколько хромосом в каждой дочерней клетке после митоза?", "tg": "Дар ҳуҷайраи соматикӣ 2n = 8. Пас аз митоз дар ҳар ҳуҷайраи духтарӣ чандто хромосома ҳаст?", "en": "A somatic cell has 2n = 8. How many chromosomes are in each daughter cell after mitosis?"},sol:{"ru": "Митоз сохраняет набор хромосом: 8.", "tg": "Митоз маҷмӯи хромосомаҳоро нигоҳ медорад: 8.", "en": "Mitosis keeps the chromosome set: 8."}},
{id:'b17',s:'bio',ans:4,q:{"ru": "У организма 2n = 8. Сколько хромосом в его гамете?", "tg": "Дар организм 2n = 8. Дар гамета чандто хромосома ҳаст?", "en": "An organism has 2n = 8. How many chromosomes are in its gamete?"},sol:{"ru": "При мейозе набор уменьшается вдвое: 8 : 2 = 4.", "tg": "Ҳангоми мейоз маҷмӯъ ду баробар кам мешавад: 8 : 2 = 4.", "en": "In meiosis the set is halved: 8 : 2 = 4."}},
{id:'b18',s:'bio',ans:12,q:{"ru": "Сколько хроматид в 6 хромосомах, каждая из которых состоит из двух хроматид?", "tg": "Дар 6 хромосома, ки ҳар кадомаш аз ду хроматида иборат аст, чандто хроматида ҳаст?", "en": "How many chromatids are in 6 chromosomes, each made of two chromatids?"},sol:{"ru": "6 · 2 = 12 хроматид.", "tg": "6 · 2 = 12 хроматида.", "en": "6 · 2 = 12 chromatids."}},
{id:'b19',s:'bio',ans:50,q:{"ru": "Скрещивают Aa × aa. Сколько процентов потомков будет иметь генотип aa?", "tg": "Aa × aa-ро чатиш медиҳанд. Чанд фоизи насл генотипи aa хоҳад дошт?", "en": "Aa × aa are crossed. What percent of offspring will have genotype aa?"},sol:{"ru": "Гаметы: A, a и a, a. Потомки: Aa, Aa, aa, aa → aa составляют 2 из 4 = 50%.", "tg": "Гаметаҳо: A, a ва a, a. Насл: Aa, Aa, aa, aa → aa 2 аз 4 = 50%.", "en": "Gametes: A, a and a, a. Offspring: Aa, Aa, aa, aa → aa is 2 of 4 = 50%."}},
{id:'b20',s:'bio',ans:4900,q:{"ru": "Сердце бьётся 70 раз в минуту, ударный объём 70 мл. Найдите минутный объём крови (мл/мин).", "tg": "Дил дар як дақиқа 70 маротиба мезанад, ҳаҷми як задан 70 мл. Ҳаҷми дақиқавии хунро ёбед (мл/дақ).", "en": "The heart beats 70 times per minute with a stroke volume of 70 mL. Find the cardiac output (mL/min)."},sol:{"ru": "70 · 70 = 4900 мл/мин.", "tg": "70 · 70 = 4900 мл/дақ.", "en": "70 · 70 = 4900 mL/min."}}
];

var BOOKS=[{"id": "cs", "pl": "gen", "lv": 1, "t": ["Основы информатики", "Асосҳои информатика", "Computer Science Basics"], "d": ["Информация, двоичная система, алгоритмы и устройство компьютера.", "Иттилоот, низоми дуӣ, алгоритмҳо ва сохти компютер.", "Information, binary numbers, algorithms and how a computer works."], "ch": [{"t": ["Что такое информация", "Иттилоот чист", "What is information"], "p": [["Информация — это сведения о мире, которые человек или устройство может получить, запомнить и передать. Текст, число, фото и звук — всё это информация.", "Наименьшая единица информации — бит. Он принимает всего два значения: 0 или 1. Восемь бит составляют один байт, а в одном байте можно записать, например, одну букву.", "Дальше единицы растут в 1024 раза: 1 килобайт (КБ) = 1024 байта, 1 мегабайт (МБ) = 1024 КБ, 1 гигабайт (ГБ) = 1024 МБ."], ["Иттилоот — ин маълумот дар бораи ҷаҳон аст, ки инсон ё дастгоҳ онро гирифта, нигоҳ дошта ва интиқол дода метавонад. Матн, рақам, акс ва садо — ҳамааш иттилоот аст.", "Хурдтарин воҳиди иттилоот — бит аст. Он танҳо ду қимат дорад: 0 ё 1. Ҳашт бит як байтро ташкил медиҳад ва дар як байт, масалан, як ҳарфро сабт кардан мумкин аст.", "Воҳидҳои калонтар ҳар бор 1024 маротиба зиёд мешаванд: 1 килобайт (КБ) = 1024 байт, 1 мегабайт (МБ) = 1024 КБ, 1 гигабайт (ГБ) = 1024 МБ."], ["Information is knowledge about the world that a person or a device can receive, store and pass on. Text, numbers, photos and sound are all information.", "The smallest unit of information is the bit. It has only two values: 0 or 1. Eight bits make one byte, and one byte can hold, for example, one letter.", "Larger units grow by 1024 times each: 1 kilobyte (KB) = 1024 bytes, 1 megabyte (MB) = 1024 KB, 1 gigabyte (GB) = 1024 MB."]], "c": ""}, {"t": ["Двоичная система счисления", "Низоми ададии дуӣ", "The binary number system"], "p": [["Компьютер хранит всё с помощью нулей и единиц, поэтому он использует двоичную систему. В ней всего две цифры, а каждая позиция числа означает степень двойки: 1, 2, 4, 8, 16…", "Чтобы перевести 1101 в десятичную систему, сложим степени двойки там, где стоит единица: 8 + 4 + 1 = 13. Чтобы перевести 13 в двоичную, делим число на 2 и выписываем остатки с конца: 13 → 1101.", "Проверить себя можно в Python."], ["Компютер ҳама чизро бо ёрии сифр ва як нигоҳ медорад, барои ҳамин низоми дуиро истифода мебарад. Дар он танҳо ду рақам ҳаст ва ҳар мавқеи адад дараҷаи дувро ифода мекунад: 1, 2, 4, 8, 16…", "Барои аз 1101 ба низоми даҳӣ гузаштан, дараҷаҳои дувро дар ҷойҳое ҷамъ мекунем, ки дар он як истодааст: 8 + 4 + 1 = 13. Барои 13-ро ба низоми дуӣ гузарондан, ададро ба 2 тақсим мекунем ва бақияҳоро аз охир менависем: 13 → 1101.", "Худро дар Python санҷида метавонед."], ["A computer stores everything as zeros and ones, so it uses the binary system. It has only two digits, and each position in a number stands for a power of two: 1, 2, 4, 8, 16…", "To convert 1101 to decimal, add the powers of two where there is a one: 8 + 4 + 1 = 13. To convert 13 to binary, divide by 2 repeatedly and write the remainders from last to first: 13 → 1101.", "You can check yourself in Python."]], "c": "n = 13\nprint(bin(n))          # 0b1101\nprint(int(\"1101\", 2))  # 13"}, {"t": ["Алгоритм", "Алгоритм", "Algorithms"], "p": [["Алгоритм — это точная последовательность шагов, которая приводит к результату. Хороший алгоритм понятен, состоит из конечного числа шагов и для одних и тех же данных всегда даёт один и тот же ответ.", "Алгоритм можно записать словами, нарисовать блок-схемой или написать программой. Например, чтобы найти наибольшее число в списке, запомним первое число как максимум и по очереди сравним с ним остальные."], ["Алгоритм — ин пайдарпайии дақиқи қадамҳост, ки ба натиҷа мебарад. Алгоритми хуб фаҳмо аст, аз шумораи ниҳоии қадамҳо иборат аст ва барои маълумотҳои якхела ҳамеша як ҷавоб медиҳад.", "Алгоритмро бо калимаҳо навиштан, бо блок-схема кашидан ё ҳамчун барнома навиштан мумкин аст. Масалан, барои ёфтани калонтарин адад дар рӯйхат, аввалин ададро ҳамчун максимум ба ёд мегирем ва боқимондаҳоро бо навбат бо он муқоиса мекунем."], ["An algorithm is an exact sequence of steps that leads to a result. A good algorithm is clear, has a finite number of steps and always gives the same answer for the same data.", "An algorithm can be written in words, drawn as a flowchart or coded as a program. For example, to find the largest number in a list, remember the first number as the maximum and compare the others with it one by one."]], "c": "a = [4, 9, 2, 7]\nm = a[0]\nfor x in a:\n    if x > m:\n        m = x\nprint(m)  # 9"}, {"t": ["Как устроен компьютер", "Сохти компютер", "How a computer works"], "p": [["Главная часть компьютера — процессор: он выполняет команды. Оперативная память временно хранит данные, с которыми работает программа, а жёсткий диск или SSD хранит файлы постоянно.", "Для ввода служат клавиатура и мышь, для вывода — экран и колонки. Всем этим управляет операционная система, например Windows, Linux или Android: она запускает программы и распределяет ресурсы между ними."], ["Қисми асосии компютер — протсессор аст: он фармонҳоро иҷро мекунад. Хотираи оперативӣ маълумотеро, ки барнома бо он кор мекунад, муваққатан нигоҳ медорад ва диски сахт ё SSD файлҳоро доимӣ нигоҳ медорад.", "Барои ворид кардан клавиатура ва муш хидмат мекунанд, барои баровардан — экран ва баландгӯякҳо. Ҳамаи инро системаи амалиётӣ идора мекунад, масалан Windows, Linux ё Android: он барномаҳоро оғоз мекунад ва захираҳоро байни онҳо тақсим менамояд."], ["The main part of a computer is the processor: it executes commands. RAM temporarily holds the data a program works with, while a hard disk or SSD stores files permanently.", "The keyboard and mouse are for input, the screen and speakers for output. All of this is managed by the operating system, such as Windows, Linux or Android: it starts programs and shares resources between them."]], "c": ""}]}, {"id": "py", "pl": "py", "lv": 1, "t": ["Python для начинающих", "Python барои навомӯзон", "Python for Beginners"], "d": ["Первые шаги: вывод, переменные, условия, циклы, функции и списки.", "Қадамҳои аввал: баровардан, тағйирёбандаҳо, шартҳо, даврҳо, функсияҳо ва рӯйхатҳо.", "First steps: output, variables, conditions, loops, functions and lists."], "ch": [{"t": ["Первая программа", "Барномаи аввал", "Your first program"], "p": [["Python — простой язык, с которого удобно начинать. Программа состоит из команд, которые выполняются сверху вниз. Команда print выводит текст на экран.", "Всё, что стоит после знака #, — комментарий: Python его игнорирует, а человеку он помогает понять код."], ["Python — забони осон аст, ки аз он оғоз кардан қулай аст. Барнома аз фармонҳо иборат аст, ки аз боло ба поён иҷро мешаванд. Фармони print матнро дар экран мебарорад.", "Ҳар чизе, ки пас аз аломати # меояд, шарҳ аст: Python онро сарфи назар мекунад, вале барои одам фаҳмидани кодро осон мекунад."], ["Python is a simple language that is easy to start with. A program is made of commands that run from top to bottom. The print command shows text on the screen.", "Anything after the # sign is a comment: Python ignores it, but it helps people understand the code."]], "c": "# my first program\nprint(\"Hello, world!\")"}, {"t": ["Переменные и типы данных", "Тағйирёбандаҳо ва навъҳои маълумот", "Variables and data types"], "p": [["Переменная — это имя, под которым хранится значение. Основные типы: int — целые числа, float — дробные, str — строки, bool — True или False.", "Функция input читает строку, которую ввёл пользователь. Чтобы получить число, оборачиваем её в int()."], ["Тағйирёбанда — номест, ки зери он қимат нигоҳ дошта мешавад. Навъҳои асосӣ: int — ададҳои бутун, float — ададҳои касрӣ, str — сатрҳо, bool — True ё False.", "Функсияи input сатрро мехонад, ки корбар ворид кардааст. Барои гирифтани адад, онро ба int() печонда мегирем."], ["A variable is a name under which a value is stored. The main types are int for whole numbers, float for fractions, str for strings and bool for True or False.", "The input function reads a line typed by the user. To get a number, wrap it in int()."]], "c": "name = input()\nage = int(input())\nprint(name, \"is\", age, \"years old\")\nprint(age + 1)"}, {"t": ["Условия и циклы", "Шартҳо ва даврҳо", "Conditions and loops"], "p": [["Условие if выбирает, какой код выполнить. Если условие неверно, срабатывает ветка else. Отступы в Python обязательны: они показывают, какие строки относятся к условию.", "Цикл for повторяет действие заданное число раз, а цикл while — пока условие истинно. Ниже программа определяет чётность числа и считает сумму от 1 до n."], ["Шарти if интихоб мекунад, кадом код иҷро шавад. Агар шарт нодуруст бошад, шохаи else кор мекунад. Фосилаҳо (отступ) дар Python ҳатмист: онҳо нишон медиҳанд, ки кадом сатрҳо ба шарт тааллуқ доранд.", "Давраи for амалро шумораи додашуда такрор мекунад, давраи while — то даме ки шарт дуруст аст. Дар поён барнома тоқ ё ҷуфт будани ададро муайян мекунад ва ҷамъи аз 1 то n-ро ҳисоб менамояд."], ["The if statement chooses which code to run. If the condition is false, the else branch runs. Indentation is required in Python: it shows which lines belong to the condition.", "A for loop repeats an action a set number of times, and a while loop repeats it while a condition is true. The program below checks whether a number is even and finds the sum from 1 to n."]], "c": "n = int(input())\nif n % 2 == 0:\n    print(\"even\")\nelse:\n    print(\"odd\")\n\ns = 0\nfor i in range(1, n + 1):\n    s += i\nprint(s)"}, {"t": ["Функции и списки", "Функсияҳо ва рӯйхатҳо", "Functions and lists"], "p": [["Функция — это именованный кусок кода, который можно вызывать много раз. Её создают командой def, а результат возвращают через return.", "Список хранит несколько значений в одной переменной. Метод append добавляет элемент в конец, а len возвращает число элементов."], ["Функсия — порчаи номдори код аст, ки онро борҳо даъват кардан мумкин аст. Онро бо фармони def месозанд ва натиҷаро бо return бармегардонанд.", "Рӯйхат якчанд қиматро дар як тағйирёбанда нигоҳ медорад. Методи append унсурро ба охир илова мекунад ва len шумораи унсурҳоро бармегардонад."], ["A function is a named piece of code that you can call many times. You create it with def and give back a result with return.", "A list stores several values in one variable. The append method adds an item to the end, and len returns the number of items."]], "c": "def square(x):\n    return x * x\n\nnums = [1, 2, 3]\nnums.append(4)\nprint(len(nums))   # 4\nfor v in nums:\n    print(square(v))"}]}, {"id": "olymp", "pl": "gen", "lv": 2, "t": ["Алгоритмы для олимпиад", "Алгоритмҳо барои олимпиадаҳо", "Algorithms for Olympiads"], "d": ["Как читать условия, оценивать сложность, искать и считать суммы быстро.", "Чӣ тавр шартҳоро хондан, мураккабиро баҳо додан, ҷустуҷӯ ва ҷамъро зуд ҳисоб кардан.", "How to read problems, estimate complexity, search and sum quickly."], "ch": [{"t": ["Как читать условие", "Шартро чӣ тавр бояд хонд", "How to read a problem"], "p": [["В олимпиадной задаче всегда есть четыре части: легенда, формат входных данных, формат выходных данных и ограничения. Сначала найдите, что именно нужно вывести.", "Обязательно разберите примеры и придумайте свой маленький тест. Особенно внимательно смотрите на ограничения: по ним видно, какой алгоритм успеет сработать за отведённое время."], ["Дар масъалаи олимпиадавӣ ҳамеша чаҳор қисм мавҷуд аст: ҳикоя, формати маълумоти воридотӣ, формати маълумоти хориҷӣ ва маҳдудиятҳо. Аввал ёбед, ки айнан чиро бояд баровард.", "Мисолҳоро ҳатман таҳлил кунед ва тести хурди худатонро ихтироъ намоед. Ба маҳдудиятҳо махсусан диққат диҳед: аз онҳо маълум мешавад, ки кадом алгоритм дар вақти додашуда ҷавоб медиҳад."], ["An olympiad problem always has four parts: the story, the input format, the output format and the constraints. First find out exactly what you must print.", "Always work through the examples and invent a small test of your own. Pay special attention to the constraints: they show which algorithm will finish in the given time."]], "c": ""}, {"t": ["Сложность алгоритма", "Мураккабии алгоритм", "Algorithm complexity"], "p": [["Сложность показывает, как растёт время работы при увеличении данных. Запись O(n) значит, что время растёт пропорционально n, а O(n²) — что при увеличении n вдвое время вырастет примерно в четыре раза.", "Простое правило: за одну секунду программа успевает выполнить порядка 10⁸ простых операций. Если n = 100000, то алгоритм O(n²) (10¹⁰ операций) не успеет, а O(n log n) успеет."], ["Мураккабӣ нишон медиҳад, ки бо зиёд шудани маълумот вақти кор чӣ тавр меафзояд. Навишти O(n) маънои онро дорад, ки вақт мутаносиби n меафзояд, O(n²) бошад — ки бо ду баробар шудани n вақт тахминан чор маротиба зиёд мешавад.", "Қоидаи оддӣ: дар як сония барнома тақрибан 10⁸ амали оддиро иҷро карда метавонад. Агар n = 100000 бошад, алгоритми O(n²) (10¹⁰ амал) намерасад, вале O(n log n) мерасад."], ["Complexity shows how running time grows as the data grows. O(n) means the time grows in proportion to n, and O(n²) means that doubling n makes the time about four times longer.", "A simple rule: in one second a program can do about 10⁸ simple operations. If n = 100000, an O(n²) algorithm (10¹⁰ operations) is too slow, but O(n log n) is fast enough."]], "c": ""}, {"t": ["Сортировка и бинарный поиск", "Мураттабкунӣ ва ҷустуҷӯи дуӣ", "Sorting and binary search"], "p": [["Отсортированные данные легче обрабатывать. В Python список сортируют функцией sorted, и она работает за O(n log n).", "В отсортированном списке нужный элемент ищут бинарным поиском: берут середину, сравнивают с искомым числом и отбрасывают половину списка. Так поиск занимает всего около log n шагов."], ["Маълумоти мураттабшуда барои коркард осонтар аст. Дар Python рӯйхатро бо функсияи sorted мураттаб мекунанд ва он дар O(n log n) кор мекунад.", "Дар рӯйхати мураттабшуда унсури лозимиро бо ҷустуҷӯи дуӣ меёбанд: мобайнро мегиранд, бо адади ҷустуҷӯшаванда муқоиса мекунанд ва нисфи рӯйхатро ҳазф менамоянд. Ҷустуҷӯ ҳамин тавр тақрибан log n қадам мегирад."], ["Sorted data is easier to work with. In Python a list is sorted with the sorted function, which runs in O(n log n).", "In a sorted list you find an item with binary search: take the middle, compare it with the target and throw away half of the list. This way the search takes only about log n steps."]], "c": "def binary_search(a, x):\n    lo, hi = 0, len(a) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if a[mid] == x:\n            return mid\n        if a[mid] < x:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n\na = sorted([7, 2, 9, 4, 1])\nprint(binary_search(a, 7))  # 3"}, {"t": ["Префиксные суммы", "Ҷамъҳои префиксӣ", "Prefix sums"], "p": [["Допустим, нужно много раз быстро узнавать сумму элементов на отрезке массива. Считать сумму каждый раз слишком долго, поэтому один раз строим массив префиксных сумм.", "В нём pref[i] — сумма первых i элементов. Тогда сумма элементов с индекса l по r равна pref[r + 1] − pref[l], то есть любой запрос выполняется за одну операцию."], ["Фарз мекунем, ки борҳо ҷамъи унсурҳоро дар порчаи массив зуд донистан лозим аст. Ҳар дафъа ҷамъро ҳисоб кардан хеле дароз мекашад, барои ҳамин як маротиба массиви ҷамъҳои префиксиро месозем.", "Дар он pref[i] — ҷамъи i унсури аввал аст. Он гоҳ ҷамъи унсурҳо аз индекси l то r ба pref[r + 1] − pref[l] баробар аст, яъне ҳар як дархост бо як амал иҷро мешавад."], ["Suppose you must quickly find the sum of items on a segment of an array many times. Adding them up each time is too slow, so we build an array of prefix sums once.", "In it, pref[i] is the sum of the first i items. Then the sum of items from index l to r equals pref[r + 1] − pref[l], so every query takes a single operation."]], "c": "a = [3, 1, 4, 1, 5]\npref = [0]\nfor v in a:\n    pref.append(pref[-1] + v)\n\nl, r = 1, 3                  # indexes from 0\nprint(pref[r + 1] - pref[l])  # 6"}]}];

/* syntax highlighting */
function hl(code,id){
  var kw={};KW[id].split(' ').forEach(function(w){kw[w]=1});
  var cm=id==='py'?'#.*':'\\/\\/.*';
  var re=new RegExp('('+cm+')|("(?:[^"\\\\]|\\\\.)*")|(#include\\s*<[^>]+>)|(\\b\\d+\\b)|([A-Za-z_]\\w*)','g');
  var out='',last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    var t=m[0],cls='';
    if(m[1])cls='c';else if(m[2])cls='s';else if(m[3])cls='p';else if(m[4])cls='n';
    else if(kw[t])cls='k';
    else if(code.charAt(re.lastIndex)==='(')cls='f';
    else if(/^[A-Z]/.test(t))cls='t';
    out+=cls?'<span class="'+cls+'">'+esc(t)+'</span>':esc(t);
    last=re.lastIndex;
  }
  return out+esc(code.slice(last));
}
